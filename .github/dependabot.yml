version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      gradle-plugin-dependencies:
        patterns:
          - "*"
  - package-ecosystem: gradle
    directory: /android/app
    schedule:
      interval: weekly
    groups:
      gradle-app-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
