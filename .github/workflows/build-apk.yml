name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: List Generated APKs
        run: |
          ls -lh app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/*.apk ./xlite-fup-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xlite-fup-apk
          path: ./xlite-fup-release.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.4
          name: "𝕏 Lite v1.0.4 (For You Feed Fix & Complete Modern Features Schema)"
          body: |
            ### 𝕏 Lite Android APK v1.0.4 (Hotfix Release)
            - **Fixed For You Feed**: Configured modern query ID `KmJCeZ__ef1fNos7tKN_fg` with complete GraphQL features schema (40+ flags) and fallback chain.
            - **Graceful Fallback**: Automatically cascades from primary to fallback queries, ensuring no red validation errors.
            - **Version Display**: Explicit `v1.0.4` build `2026.11.10.5` in Settings.
          files: ./xlite-fup-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
