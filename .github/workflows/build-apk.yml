name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: List Generated APKs
        run: |
          ls -lh app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/*.apk ./xlite-fup-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xlite-fup-apk
          path: ./xlite-fup-release.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.2
          name: "𝕏 Lite v1.0.2 (Clean Native Minimal UI & Fixed Replies)"
          body: |
            ### 𝕏 Lite Android APK v1.0.2
            - **Clean Minimal UI**: Stripped all vibecoded neon colors, header pills, and badges. Pure black OLED aesthetic matching official 𝕏.
            - **Fixed Replies**: Configured modern `CreateTweet` endpoint with full variables (`in_reply_to_tweet_id`, `exclude_reply_user_ids`) and error handling.
            - **Fixed OTA Updates**: Cleaned network headers so GitHub update requests are not rejected with 404s.
            - **Settings-Only Updates**: Moved the update button exclusively into Settings to keep the main interface distraction-free.

            **Download the attached APK below and install on your phone.**
          files: ./xlite-fup-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
