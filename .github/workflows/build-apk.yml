name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: List Generated APKs
        run: |
          ls -lh app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/*.apk ./xlite-fup-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xlite-fup-apk
          path: ./xlite-fup-release.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.3
          name: "𝕏 Lite v1.0.3 (Search & For You Fixes, Thread Navigation & Version Display)"
          body: |
            ### 𝕏 Lite Android APK v1.0.3 (Hotfix Release)
            - **Fixed Search**: Multi-tier search fallback supporting modern GraphQL query IDs (`flaR-PUMshxFWZWPNpq4zA`, `1BP5aKg8NvTNvRCyyCyq8g`) and direct v1.1 REST search.
            - **Fixed "For You" Feed**: Verified query ID `2ee46L1AFXmnTa0EvUog-Q/HomeTimeline` with clean parameters matching Following timeline.
            - **Fixed Persistent "Updating..." Status**: Auto-clearing background refresh toast (auto-hides after 4s) and explicit "Feed updated" confirmation.
            - **Fixed Thread Navigation**: Retains source feed (`For You` vs `Following`), instant focal tweet rendering via global cache, and tab bar retention.
            - **Version Display in Settings**: Explicit version number (`v1.0.3`), build timestamp, and runtime indicator (`Live OTA` vs `Bundled APK`).
            - **OTA Hot Updates**: Pull future updates seamlessly in Settings without reinstalling.
          files: ./xlite-fup-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
