name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: List Generated APKs
        run: |
          ls -lh app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/*.apk ./xlite-fup-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xlite-fup-apk
          path: ./xlite-fup-release.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.1
          name: "𝕏 Lite v1.0.1 (Dynamic Loading & In-App Hot Updates)"
          body: |
            ### 𝕏 Lite Android APK v1.0.1 (Airtel 64kbps FUP Edition)
            - **Fixed Usernames & Handles**: Authors and retweeters display correctly across all modern Twitter GraphQL schemas.
            - **Fixed "For You" Feed**: Dedicated query ID `fedFLLzmiCAuzPgA8lyh8Q` with clean parameters.
            - **Instant Stale-While-Revalidate**: Cached tweets appear immediately (0.01s), refreshing 12 tweets in background (~3.5 KB).
            - **In-App Hot OTA Updates**: Tap `🔄 Update` in the app to pull future frontend changes directly without reinstalling the APK!
            - **100% On-Phone Compute**: Runs directly on your phone, zero server or Mac needed.

            **Download the attached APK below and install on your phone.**
          files: ./xlite-fup-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
