name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Check web interface behavior
        run: |
          node scripts/feed-media.test.cjs
          node scripts/search-pagination.test.cjs
          node scripts/post-actions.test.cjs

      - name: Decode Release Keystore
        env:
          XLITE_KEYSTORE_B64: ${{ secrets.XLITE_KEYSTORE_B64 }}
        run: |
          if [ -n "$XLITE_KEYSTORE_B64" ]; then
            echo "$XLITE_KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/release.keystore"
            echo "XLITE_KEYSTORE_FILE=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        env:
          XLITE_KEYSTORE_PASSWORD: ${{ secrets.XLITE_KEYSTORE_PASSWORD }}
          XLITE_KEY_ALIAS: ${{ secrets.XLITE_KEY_ALIAS }}
          XLITE_KEY_PASSWORD: ${{ secrets.XLITE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: List Generated APKs
        run: |
          ls -lh app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/*.apk ./xlite-fup-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xlite-fup-apk
          path: ./xlite-fup-release.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "𝕏 Lite ${{ github.ref_name }}"
          body: |
            Android APK for ${{ github.ref_name }}.
          files: ./xlite-fup-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
