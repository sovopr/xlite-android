name: Verified Android Release

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release Source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Asset Consistency & Version Parity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-assets.cjs
      - name: Run Web UI Deterministic Suites
        run: |
          node scripts/feed-media.test.cjs
          node scripts/search-pagination.test.cjs
          node scripts/post-actions.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
          fi
      - name: Run Kotlin Unit Tests & Android Lint
        working-directory: android
        env:
          XLITE_GIT_SHA: ${{ github.sha }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest lintRelease --no-daemon --stacktrace

  build-and-publish:
    name: Build Signed APK & Publish Release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
          fi
      - name: Decode Release Keystore
        env:
          XLITE_KEYSTORE_B64: ${{ secrets.XLITE_KEYSTORE_B64 }}
        run: |
          if [ -n "$XLITE_KEYSTORE_B64" ]; then
            echo "$XLITE_KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/release.keystore"
            echo "XLITE_KEYSTORE_FILE=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build Signed Release APK
        working-directory: android
        env:
          XLITE_KEYSTORE_PASSWORD: ${{ secrets.XLITE_KEYSTORE_PASSWORD }}
          XLITE_KEY_ALIAS: ${{ secrets.XLITE_KEY_ALIAS }}
          XLITE_KEY_PASSWORD: ${{ secrets.XLITE_KEY_PASSWORD }}
          XLITE_GIT_SHA: ${{ github.sha }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/*.apk ../xlite-fup-release.apk
          test -s ../xlite-fup-release.apk
          (cd .. && sha256sum xlite-fup-release.apk > SHA256SUMS.txt && cat SHA256SUMS.txt && ls -lh ./xlite-fup-release.apk)
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xlite-fup-apk
          path: |
            ./xlite-fup-release.apk
            ./SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish Verified GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view --repo "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists; refusing to overwrite published release assets"
            exit 1
          fi
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create --repo "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" \
              ./xlite-fup-release.apk ./SHA256SUMS.txt \
              --verify-tag \
              --title "X Lite ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES_FILE"
          else
            gh release create --repo "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" \
              ./xlite-fup-release.apk ./SHA256SUMS.txt \
              --verify-tag \
              --title "X Lite ${GITHUB_REF_NAME}" \
              --notes "Verified signed Android APK release for ${GITHUB_REF_NAME} with SHA-256 checksums."
          fi
