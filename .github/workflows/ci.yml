name: CI Verification Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            CHANGED=$(git diff --name-only FETCH_HEAD HEAD)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          fi
          echo "Changed files:"
          echo "$CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          elif echo "$CHANGED" | grep -qvE '^(README(\.md)?|LICENSE|\.gitignore|\.gitattributes|docs/|\.github/(ISSUE_TEMPLATE/|pull_request_template\.md|dependabot\.yml|CODE_OF_CONDUCT\.md|CONTRIBUTING\.md|SECURITY\.md|workflows/codeql\.yml))'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  docs-fast-pass:
    name: ${{ matrix.check_name }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code != 'true'
    strategy:
      fail-fast: false
      matrix:
        check_name:
          - "Web UI & Static Verification"
          - "Android Kotlin Test, Lint & Build"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify Docs Links, SVGs & Images (${{ matrix.check_name }})
        run: node scripts/verify-assets.cjs

  web-suite:
    name: Web UI & Static Verification
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify Assets, Version Parity & Secret Scan
        run: node scripts/verify-assets.cjs
      - name: Run Deterministic Web UI Unit Suites
        run: |
          node scripts/feed-media.test.cjs
          node scripts/search-pagination.test.cjs
          node scripts/post-actions.test.cjs

  android-suite:
    name: Android Kotlin Test, Lint & Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
          fi
      - name: Make Gradle Wrapper Executable
        working-directory: android
        run: chmod +x gradlew
      - name: Run Kotlin Unit Tests, Android Lint & Release Compile Check
        working-directory: android
        env:
          XLITE_GIT_SHA: ${{ github.sha }}
        run: ./gradlew testReleaseUnitTest lintRelease assembleRelease --no-daemon --stacktrace
