name: Dependency Submission

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/gradle/**'
      - 'android/gradle.properties'
      - 'android/settings.gradle.kts'
      - 'android/build.gradle.kts'
      - 'android/app/build.gradle.kts'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  submit-gradle-dependencies:
    name: Submit Gradle Dependency Graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
          fi

      - name: Make Gradle Wrapper Executable
        working-directory: android
        run: chmod +x gradlew

      - name: Generate and Submit Gradle Dependency Graph
        uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: android
          additional-arguments: --no-daemon --stacktrace

