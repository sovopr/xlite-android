<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>𝕏 Lite</title>
<style>
:root {
  --bg: #000000;
  --surface: #000000;
  --card: #16181c;
  --border: #2f3336;
  --text: #e7e9ea;
  --text-muted: #71767b;
  --accent: #1d9bf0;
  --accent-hover: #1a8cd8;
  --red: #f4212e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.4;
  padding-bottom: 65px;
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--accent); text-decoration: none; }

/* Clean official header */
.header {
  position: sticky;
  top: 0;
  background: rgba(0, 0, 0, 0.95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  height: 52px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 100;
}
.header-logo {
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 9px;
}
.header-logo svg {
  width: 30px;
  height: 30px;
  flex: none;
  display: block;
}
.header-sub {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 600;
  letter-spacing: .02em;
}

/* Tabs */
.nav-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.nav-tab {
  flex: 1;
  text-align: center;
  padding: 14px 6px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 3px solid transparent;
}
.nav-tab.active {
  color: var(--text);
  border-bottom: 3px solid var(--accent);
}

/* Subtle status bar */
.status-bar {
  position: sticky;
  top: 52px;
  z-index: 95;
  padding: 6px 14px;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--border);
  background: #080808;
  color: var(--text-muted);
}
.status-bar.error {
  color: #fca5a5;
  background: rgba(244, 33, 46, 0.1);
}

/* Tweets */
.tweet {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  content-visibility: auto;
  contain-intrinsic-size: 0 210px;
}
.tweet:active {
  background: rgba(255, 255, 255, 0.02);
}
.tweet-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.tweet-meta {
  display: flex;
  align-items: baseline;
  gap: 0 6px;
  flex-wrap: wrap;
  min-width: 0;
}
.tweet-avatar {
  position: relative;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #1d2228;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
  cursor: pointer;
}
.tweet-avatar.mini {
  width: 18px;
  height: 18px;
  font-size: 10px;
}
body.rich-mode .tweet-avatar {
  width: 38px;
  height: 38px;
  font-size: 15px;
}
body.rich-mode .tweet-avatar.mini {
  width: 20px;
  height: 20px;
  font-size: 10px;
}
.tweet-avatar-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.12s ease;
}
.ad-badge {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  line-height: 1.3;
  flex-shrink: 0;
}
.tweet-name {
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
}
.tweet-handle {
  color: var(--text-muted);
  font-size: 14px;
}
.tweet-dot {
  color: var(--text-muted);
  font-size: 12px;
}
.tweet-time {
  color: var(--text-muted);
  font-size: 14px;
}
.tweet-body {
  font-size: 15px;
  word-break: break-word;
  white-space: pre-wrap;
  line-height: 1.45;
  cursor: pointer;
}
.tweet-img {
  max-width: 100%;
  border-radius: 12px;
  margin-top: 8px;
  display: block;
  background: #16181c;
  border: 1px solid var(--border);
}
.tweet-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 420px;
  margin-top: 10px;
  font-size: 13px;
  color: var(--text-muted);
}
.tweet-actions-left {
  display: flex;
  align-items: center;
  gap: 22px;
}
.tweet-actions-right {
  display: flex;
  align-items: center;
  gap: 16px;
}
.action-item {
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  user-select: none;
  padding: 2px 4px;
  margin: -2px -4px;
  border-radius: 6px;
}
.action-item:active {
  color: var(--accent);
}
.action-item.liked {
  color: #f91880;
  font-weight: 700;
}
.action-item.retweeted {
  color: #00ba7c;
  font-weight: 700;
}
.action-item.saved {
  color: var(--accent);
  font-weight: 700;
}
.action-item.busy {
  opacity: 0.6;
  pointer-events: none;
}
.retweet-banner {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.quoted-box {
  margin-top: 8px;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.02);
  cursor: pointer;
}
.quoted-box:active {
  background: rgba(255, 255, 255, 0.05);
}

/* Bottom Bar */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 52px;
  background: rgba(0, 0, 0, 0.98);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}
.bottom-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 11px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px 12px;
}
.bottom-item.active {
  color: var(--text);
  font-weight: 700;
}
.bottom-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  margin-bottom: 2px;
}
.bottom-icon .icon-svg {
  width: 19px;
  height: 19px;
  vertical-align: 0;
}

/* Buttons and Inputs */
.btn {
  display: inline-block;
  padding: 8px 18px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 9999px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
}
.btn:active {
  background: var(--accent-hover);
}
.btn-block {
  display: block;
  width: 100%;
}
.btn-secondary {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:active {
  background: #16181c;
}
.form-input, .form-textarea {
  width: 100%;
  background: #16181c;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px;
  border-radius: 8px;
  font-size: 15px;
  margin-bottom: 12px;
  font-family: inherit;
}
.form-input:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.form-textarea {
  resize: vertical;
  min-height: 90px;
}

/* Clean cards for Settings */
.card {
  border-bottom: 1px solid var(--border);
  padding: 16px;
}
.card-title {
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 6px;
}
.card-desc {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 14px;
  line-height: 1.4;
}
.spinner {
  text-align: center;
  padding: 36px 16px;
  color: var(--text-muted);
  font-size: 14px;
}
.spinner::before, .inline-spinner::before {
  content: '';
  display: inline-block;
  width: 14px;
  height: 14px;
  margin-right: 7px;
  vertical-align: -2px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.feed-toolbar {
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.feed-progress { color: var(--text-muted); font-size: 12px; }
.feed-progress.error { color: #fca5a5; }
.feed-toolbar button:disabled { opacity: .7; }
.load-more-box {
  padding: 16px;
  text-align: center;
}
.sub-header {
  height: 48px;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 16px;
  font-weight: 700;
}
.back-btn {
  background: none;
  border: none;
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 9999px;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.header-btn {
  background: #16181c;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 9999px;
  height: 32px;
  padding: 0 11px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.header-btn.active {
  border-color: var(--accent);
  color: var(--accent);
}
.verified-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: var(--accent);
  color: #000;
  vertical-align: -2px;
  margin-left: 4px;
  flex-shrink: 0;
}
.verified-badge .icon-svg {
  width: 10px;
  height: 10px;
  stroke-width: 2.8;
  vertical-align: 0;
}
/* Rich media, photo grids, video, cards, polls */
.media-grid {
  display: grid;
  gap: 4px;
  margin-top: 8px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: #16181c;
}
.media-grid-1 { grid-template-columns: 1fr; }
.media-grid-2 { grid-template-columns: 1fr 1fr; }
.media-grid-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 135px 135px; }
.media-grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 135px 135px; }
.media-grid-1 .tweet-img {
  margin-top: 0;
  border: none;
  border-radius: 0;
  width: 100%;
  max-height: 440px;
  object-fit: cover;
  cursor: zoom-in;
}
.media-grid-2 .tweet-img,
.media-grid-3 .tweet-img,
.media-grid-4 .tweet-img {
  margin-top: 0;
  border: none;
  border-radius: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  cursor: zoom-in;
}
.media-grid-2 .tweet-img { height: 210px; }
.media-grid-3 .media-cell-0 { grid-row: 1 / span 2; }
.video-wrap {
  position: relative;
  margin-top: 8px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: #0d0f12;
}
.tweet-video {
  display: block;
  width: 100%;
  max-height: 520px;
  background: #000;
  object-fit: contain;
}
.quoted-box .media-grid,
.quoted-box .video-wrap,
.quoted-box .link-card,
.quoted-box .poll-box {
  margin-top: 6px;
}
.quoted-box .media-grid-1 .tweet-img,
.quoted-box .tweet-video {
  max-height: 280px;
}
.video-mute-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.64);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.22);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 2;
  padding: 0;
}
.video-mute-btn .icon-svg {
  width: 15px;
  height: 15px;
  vertical-align: 0;
}
.gif-pill {
  position: absolute;
  left: 8px;
  bottom: 8px;
  background: rgba(0, 0, 0, 0.72);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  pointer-events: none;
}
.link-card {
  display: block;
  margin-top: 8px;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.02);
  color: var(--text);
}
.link-card-img {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  display: block;
  border-bottom: 1px solid var(--border);
}
.link-card-body { padding: 10px 12px; }
.link-card-domain { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
.link-card-title { font-size: 14px; font-weight: 700; line-height: 1.3; margin-bottom: 3px; }
.link-card-desc { font-size: 13px; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.poll-box {
  margin-top: 8px;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.02);
}
.poll-row {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  padding: 7px 10px;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  font-size: 13px;
}
.poll-bar {
  position: absolute;
  inset: 0 auto 0 0;
  background: rgba(29, 155, 240, 0.22);
  pointer-events: none;
}
.poll-label, .poll-pct { position: relative; z-index: 1; }
.poll-pct { font-weight: 700; color: var(--text-muted); }
.poll-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
/* Fullscreen lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 300;
  background: rgba(0, 0, 0, 0.96);
  display: none;
  flex-direction: column;
}
.lightbox.open { display: flex; }
.lightbox-bar {
  height: 48px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #fff;
  font-size: 14px;
}
.lightbox-stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  position: relative;
}
.lightbox-img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  transition: transform 0.15s ease;
}
.lightbox-img.zoomed {
  max-width: none;
  max-height: none;
  transform: scale(1.8);
  transform-origin: center;
}
.lightbox-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0, 0, 0, 0.65);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 50%;
  width: 38px;
  height: 38px;
  font-size: 20px;
  cursor: pointer;
}
.lightbox-cap {
  padding: 10px 14px;
  font-size: 13px;
  color: #d1d5db;
  border-top: 1px solid #222;
  max-height: 90px;
  overflow-y: auto;
}
/* Profile & Notifications */
.profile-banner { width: 100%; height: 130px; background: #16181c; object-fit: cover; display: block; }
.profile-card { padding: 0 16px 14px; border-bottom: 1px solid var(--border); }
.profile-top { display: flex; justify-content: space-between; align-items: flex-end; margin-top: -32px; margin-bottom: 10px; }
.profile-avatar { width: 68px; height: 68px; font-size: 24px; border: 3px solid #000; }
.profile-stats { display: flex; gap: 16px; margin-top: 10px; font-size: 13px; color: var(--text-muted); }
.profile-stats strong { color: var(--text); }
.notif-row { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; gap: 10px; }
.notif-icon { font-size: 16px; width: 22px; flex-shrink: 0; text-align: center; padding-top: 2px; display: inline-flex; justify-content: center; }

/* Unified SVG Icons */
.icon-svg {
  width: 1em;
  height: 1em;
  display: inline-block;
  vertical-align: -0.15em;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.icon-svg.filled {
  fill: currentColor;
  stroke: none;
}
.action-item .icon-svg {
  width: 15px;
  height: 15px;
}

/* Reddit-style Conversation Thread */
.thread-ancestors {
  border-bottom: 1px solid var(--border);
}
.thread-ancestor {
  position: relative;
  border-bottom: 1px solid rgba(47, 51, 54, 0.55);
  background: rgba(255, 255, 255, 0.015);
}
.thread-ancestor::before {
  content: '';
  position: absolute;
  left: 28px;
  top: 46px;
  bottom: -10px;
  width: 2px;
  background: var(--border);
  pointer-events: none;
}
.thread-focal {
  background: rgba(29, 155, 240, 0.03);
  border-bottom: 1px solid var(--border);
}
.thread-replying-banner {
  padding: 8px 16px 0;
  font-size: 12px;
  color: var(--text-muted);
}
.reddit-thread-header {
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
}
.reddit-node {
  min-width: 0;
}
.reddit-node[data-depth="0"] {
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
}
.reddit-comment {
  padding: 2px 0 4px;
  min-width: 0;
}
.reddit-meta-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  cursor: pointer;
  margin-bottom: 4px;
  min-width: 0;
}
.reddit-collapse-btn {
  margin-left: auto;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: 9999px;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
  padding: 3px 8px;
  cursor: pointer;
  flex-shrink: 0;
}
.reddit-reply-to {
  font-size: 12px;
  color: var(--text-muted);
  margin: 0 0 4px;
}
.reddit-body {
  font-size: 14px;
  line-height: 1.45;
  word-break: break-word;
  white-space: pre-wrap;
  cursor: pointer;
}
.reddit-actions {
  margin-top: 8px;
  max-width: 390px;
}
.reddit-children {
  margin-top: 6px;
  margin-left: 8px;
  padding-left: 11px;
  border-left: 2px solid rgba(29, 155, 240, 0.55);
  min-width: 0;
}
.reddit-children[data-parent-depth="1"] { border-left-color: rgba(0, 186, 124, 0.55); }
.reddit-children[data-parent-depth="2"] { border-left-color: rgba(245, 158, 11, 0.55); }
.reddit-children[data-parent-depth="3"] { border-left-color: rgba(168, 85, 247, 0.55); }
.reddit-children[data-parent-depth="4"] { border-left-color: rgba(244, 63, 94, 0.55); }
.reddit-children[data-parent-depth="5"] {
  margin-left: 4px;
  padding-left: 8px;
  border-left-color: var(--border);
}
.reddit-children .reddit-node {
  margin-top: 8px;
  padding-top: 6px;
  border-top: 1px solid rgba(47, 51, 54, 0.45);
}
.reddit-children .reddit-node:first-child {
  margin-top: 2px;
  padding-top: 0;
  border-top: none;
}
.reddit-collapsed-hint {
  display: none;
  font-size: 12px;
  color: var(--text-muted);
  font-style: italic;
  padding: 2px 0 4px;
  cursor: pointer;
}
.reddit-node.collapsed > .reddit-comment > .reddit-body-wrap,
.reddit-node.collapsed > .reddit-children {
  display: none;
}
.reddit-node.collapsed > .reddit-comment > .reddit-collapsed-hint {
  display: block;
}
</style>
</head>
<body>

<div class="header">
    <div class="header-logo" onclick="nav('feed')" style="cursor:pointer;">
        <svg viewBox="0 0 64 64" role="img" aria-label="X Lite logo" xmlns="http://www.w3.org/2000/svg">
            <rect width="64" height="64" rx="14" fill="#000"/>
            <path d="M14 13h9l30 39h-9z" fill="#f7f9fa"/>

function formatCount(n) {
    const num = Number(n);
    if (!Number.isFinite(num) || num <= 0) return '0';
    if (num < 1000) return String(Math.round(num));
    if (num < 1000000) return (num / 1000).toFixed(num < 100000 ? 1 : 0).replace(/\.0$/, '') + 'K';
    return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
}

function formatRelativeTime(dateInput) {
    if (!dateInput) return '';
    const d = dateInput instanceof Date ? dateInput : new Date(dateInput);
    const ms = d.getTime();
    if (!Number.isFinite(ms)) return '';
    const diffSec = Math.max(0, Math.floor((Date.now() - ms) / 1000));
    if (diffSec < 60) return 'now';
    if (diffSec < 3600) return Math.floor(diffSec / 60) + 'm';
    if (diffSec < 86400) return Math.floor(diffSec / 3600) + 'h';
    if (diffSec < 7 * 86400) return Math.floor(diffSec / 86400) + 'd';
    try { return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch (_) { return ''; }
}

function extractViewerFromHomeHtml(html) {

    const uidMatch = html.match(/"(?:viewerId|user_id)":"(\d{3,25})"/);
    const uid = uidMatch ? uidMatch[1] : '';
    if (uid) {
        const idNeedle = '"id_str":"' + uid + '"';
        let idx = html.indexOf(idNeedle);
        if (idx === -1) idx = html.indexOf('"rest_id":"' + uid + '"');
        if (idx !== -1) {
            const slice = html.slice(Math.max(0, idx - 500), Math.min(html.length, idx + 800));
            const sn = slice.match(/"screen_name":"([A-Za-z0-9_]{1,30})"/);
            const nm = slice.match(/"name":"([^"\\]{1,80})"/);
            if (sn) return saveViewerIdentity({ id: uid, screen_name: sn[1], name: nm ? nm[1] : sn[1] });
        }
    }
    const pair = html.match(/"id_str":"(\d{3,25})"[^}]{0,260}"screen_name":"([A-Za-z0-9_]{1,30})"/)
        || html.match(/"screen_name":"([A-Za-z0-9_]{1,30})"[^}]{0,260}"id_str":"(\d{3,25})"/);
    if (pair) {
        const isNumFirst = /^\d+$/.test(pair[1]);

    return null;
}

function markTweetSeen(twId, sectionName, dwellMs) {
    const idStr = String(twId || '');

                section: sectionName || (currentTab === 'foryou' ? 'home' : 'latest'),
                component: 'tweet',

                action: 'results'

            items: [{

                impression_details: {

                    visibility_end: now,
                    percent_screen_height_100k: 50000

function initSeenObserver(rootEl) {
    disconnectSeenObserver();
    if (typeof IntersectionObserver !== 'function') return;
    const container = rootEl || document.getElementById('feedContainer') || document.getElementById('mainContent');
    if (!container) return;
    const sectionName = currentTab === 'foryou' ? 'home' : 'latest';
    seenTweetObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
            const twId = entry.target?.dataset?.id;
            if (!twId) return;
            if (entry.isIntersecting && entry.intersectionRatio >= 0.35) {
                if (!seenDwellTimers.has(twId)) {
                    const start = Date.now();
                    const timer = setTimeout(() => {
                        seenDwellTimers.delete(twId);
                        markTweetSeen(twId, sectionName, Date.now() - start);
                        if (seenTweetObserver) try { seenTweetObserver.unobserve(entry.target); } catch (_) {}
                    }, 450);
                    seenDwellTimers.set(twId, timer);
                }
            } else if (seenDwellTimers.has(twId)) {
                clearTimeout(seenDwellTimers.get(twId));
                seenDwellTimers.delete(twId);
            }
        });
    }, { threshold: [0.35] });
    container.querySelectorAll('.tweet[data-id]').forEach((el) => {
        if (/^\d+$/.test(el.dataset.id)) seenTweetObserver.observe(el);
    });
}

// Global callback dispatcher for native Android async requests
window.__onAsyncFinish = function(callbackId, directResult) {
    if (pendingCallbacks[callbackId]) {
        let resStr = '';
        if (directResult !== undefined) {
            resStr = directResult;
        } else if (window.AndroidBridge && typeof AndroidBridge.takeTempResult === 'function') {
            resStr = AndroidBridge.takeTempResult(callbackId);
        } else if (window.AndroidBridge && AndroidBridge.getCache) {
            resStr = AndroidBridge.getCache('temp_res_' + callbackId);
            AndroidBridge.saveCache('temp_res_' + callbackId, '');
        }
        let cb = pendingCallbacks[callbackId];
        delete pendingCallbacks[callbackId];
        try {
            cb(resStr);
        } catch(err) {
            console.error("Callback error:", err);
        }
    }
};

function performAsyncGet(url, callback, transactionId) {
    let cbId = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
    pendingCallbacks[cbId] = callback;

    try {
        if (transactionId) {
            const signedFn = window.AndroidBridge && (typeof AndroidBridge.executeSignedGetAsync === 'function'
                ? AndroidBridge.executeSignedGetAsync
                : (typeof AndroidBridge.executeSearchGetAsync === 'function' ? AndroidBridge.executeSearchGetAsync : null));
            if (signedFn) {
                signedFn.call(AndroidBridge, url, transactionId, cbId);
            } else {
                window.__onAsyncFinish(cbId, JSON.stringify({ error: true, message: 'Install the v1.0.6 APK to enable search.' }));
            }
        } else if (window.AndroidBridge && AndroidBridge.executeGetAsync) {
            AndroidBridge.executeGetAsync(url, cbId);
        } else if (window.AndroidBridge && AndroidBridge.executeGet) {
            setTimeout(() => {
                try {
                    window.__onAsyncFinish(cbId, AndroidBridge.executeGet(url));
                } catch (error) {
                    window.__onAsyncFinish(cbId, JSON.stringify({ error: true, message: error.message || 'Request failed' }));
                }
            }, 10);
        } else {
            // Fallback to native browser fetch
            fetch(url)
                .then(r => r.text())
                .then(txt => window.__onAsyncFinish(cbId, txt))
                .catch(err => window.__onAsyncFinish(cbId, JSON.stringify({ error: true, message: err.message })));
        }
    } catch (error) {
        window.__onAsyncFinish(cbId, JSON.stringify({ error: true, message: error.message || 'Request failed' }));
    }
}

/** Signs and dispatches an X API request, retrying once with a fresh transaction if a warm cache fails auth. */
function runSignedTransactionRequest(method, path, dispatchWithTid, callback) {
    const signPath = String(path || '').split('?')[0];
    function attempt(forceFresh, canRetryCached) {
        prepareXTransaction((prepErr) => {
            if (prepErr) {
                callback(JSON.stringify({ error: true, message: prepErr }));
                return;
            }
            const usedCached = !!searchTransactionFromCache;
            let tid = '';
            try {
                tid = searchTransactionClient.generateTransactionId(method, signPath);
            } catch (e) {
                if (usedCached && canRetryCached) {
                    invalidateXTransaction(true);
                    attempt(true, false);
                    return;
                }
                callback(JSON.stringify({ error: true, message: 'Could not sign X request. Please try again.' }));
                return;
            }
            dispatchWithTid(tid, (resStr) => {
                const authFailed = typeof resStr === 'string' && /"status"\s*:\s*40[13]\b/.test(resStr);
                if (usedCached && canRetryCached && authFailed) {
                    invalidateXTransaction(true);
                    attempt(true, false);
                    return;
                }
                callback(resStr);
            });
        }, forceFresh);
    }
    attempt(false, true);
}

function performSignedGet(path, callback) {
    const url = 'https://x.com' + path;
    if (window.AndroidBridge && (typeof AndroidBridge.executeSignedGetAsync === 'function' || typeof AndroidBridge.executeSearchGetAsync === 'function')) {
        runSignedTransactionRequest('GET', path, (tid, onDone) => {
            performAsyncGet(url, onDone, tid);
        }, callback);
        return;
    }
    performAsyncGet(url, callback);
}

function performAsyncPost(url, payload, callback) {

    } catch (error) {

}

function performSignedPost(path, payload, callback) {
    const url = 'https://x.com' + path;
    if (window.AndroidBridge && typeof AndroidBridge.executePostWithTransactionAsync === 'function') {
        runSignedTransactionRequest('POST', path, (tid, onDone) => {
            const cbId = 'post_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
            pendingCallbacks[cbId] = onDone;
            try {
                AndroidBridge.executePostWithTransactionAsync(url, payload, tid, cbId);
            } catch (err) {
                delete pendingCallbacks[cbId];
                onDone(JSON.stringify({ error: true, message: err.message || 'Post failed' }));
            }
        }, callback);
        return;
    }
    if (!path.endsWith('/CreateTweet') && window.AndroidBridge) {
        callback(JSON.stringify({ error: true, message: 'Update to v1.0.16 APK from GitHub Releases to enable Like & Retweet.' }));
        return;
    }
    performAsyncPost(url, payload, callback);
}

function performSignedFormPost(path, formBody, callback) {

        } catch (err) {

        }
    }, callback);
}

function parsePostResponse(resStr, op) {
    let res;
    try { res = JSON.parse(resStr); } catch (err) { res = { error: true, message: resStr || 'Empty response' }; }
    const spec = POST_MUTATIONS[op];
    if (op === 'CreateTweet') {
        const errObj = Array.isArray(res?.errors) ? res.errors[0] : null;
        const error = errObj?.message || (res?.error ? (res.message || 'Error') : (!res?.data?.create_tweet ? 'Unexpected response from X' : ''));
        return { ok: !error, res, error, status: res?.status };
    }
    if (spec?.ok && spec.ok(res)) {
        return { ok: true, res, error: '', status: res?.status || 200 };
    }
    const errObj = Array.isArray(res?.errors) ? res.errors[0] : null;
    const error = errObj?.message || (res?.error ? (res.message || 'Error') : 'Unexpected response from X');
    return { ok: false, res, error, status: res?.status };
}

function performPostMutation(op, variables, callback) {
    const spec = POST_MUTATIONS[op];
    if (!spec || !spec.queryIds?.length) {
        callback({ ok: false, error: 'Unsupported action' });
        return;
    }
    function tryIndex(index, lastFailure) {
        if (index >= spec.queryIds.length) {
            callback(lastFailure || { ok: false, error: 'Request failed' });
            return;
        }
        const queryId = spec.queryIds[index];
        const path = '/i/api/graphql/' + queryId + '/' + op;
        const bodyObj = { variables, queryId };
        if (spec.includeFeatures) bodyObj.features = GRAPHQL_FEATURES;
        performSignedPost(path, JSON.stringify(bodyObj), (resStr) => {
            const parsed = parsePostResponse(resStr, op);
            if (!parsed.ok && index + 1 < spec.queryIds.length && isQueryIdFailure(parsed)) {
                tryIndex(index + 1, parsed);
                return;
            }
            callback(parsed);
        });
    }
    tryIndex(0, null);
}

function decodeHtmlEntities(text) {
    if (!text) return '';
    // Decode named/numeric entities before &amp; so double-encoded text stays literal on re-escape.
    return String(text)
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/&quot;/g, '"')
        .replace(/&#(?:39|x27);|&apos;/gi, "'")
        .replace(/&amp;/g, '&');
}

function escapeHtml(text) {
    if (!text) return '';
    return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function linkify(text) {
    const source = String(text || '');
    const matcher = /https?:\/\/[^\s<>"']+|@[a-zA-Z0-9_]+|#[a-zA-Z0-9_]+/g;
    let result = '';
    let offset = 0;
    for (const match of source.matchAll(matcher)) {
        result += escapeHtml(source.slice(offset, match.index));
        const token = match[0];
        if (token.startsWith('http')) {
            result += `<a href="${escapeHtml(token)}" onclick="event.stopPropagation()">${escapeHtml(token)}</a>`;
        } else if (token[0] === '@') {
            const handle = escapeHtml(token.slice(1));
            result += `<a href="javascript:openProfile('${handle}')" onclick="event.stopPropagation()">${escapeHtml(token)}</a>`;
        } else {
            const query = escapeHtml(token);
            result += `<a href="javascript:searchTag('${query}')" onclick="event.stopPropagation()">${escapeHtml(token)}</a>`;
        }
        offset = match.index + token.length;
    }
    return result + escapeHtml(source.slice(offset));
}

function getBookmarks() {
    if (Array.isArray(bookmarksCache)) return bookmarksCache;
    try {
        let b = window.AndroidBridge ? AndroidBridge.getCache('bookmarks') : localStorage.getItem('bookmarks');
        let parsed = b ? JSON.parse(b) : [];
        bookmarksCache = Array.isArray(parsed) ? parsed : [];
        return bookmarksCache;
    } catch(e) { bookmarksCache = []; return bookmarksCache; }
}

function saveBookmarks(list) {
    bookmarksCache = Array.isArray(list) ? list : [];
    const s = JSON.stringify(bookmarksCache);
    if (window.AndroidBridge && AndroidBridge.saveCache) AndroidBridge.saveCache('bookmarks', s);
    else if (typeof localStorage !== 'undefined') localStorage.setItem('bookmarks', s);
}

function isBookmarked(id) {
    const key = String(id || '');
    return getBookmarks().some(t => t && String(t.id) === key);
}

function findTweetById(twId) {
    const key = String(twId || '');
    if (!key) return null;
    if (allTweetsMap[key]) return allTweetsMap[key];
    let found = currentTweetsList.find(t => t && String(t.id) === key);
    if (!found) found = getBookmarks().find(t => t && String(t.id) === key);
    if (!found && window.AndroidBridge && AndroidBridge.getCache) {
        try {
            const raw = AndroidBridge.getCache('feed_cache');
            const cached = raw ? JSON.parse(raw) : [];
            if (Array.isArray(cached)) {
                cached.forEach(t => { if (t && t.id && !allTweetsMap[t.id]) allTweetsMap[t.id] = t; });
                found = allTweetsMap[key] || null;
            }
        } catch(e) {}
    }
    if (found) allTweetsMap[key] = found;
    return found || null;
}

function readNodeAttr(el, name) {
    if (!el) return null;
    if (typeof el.getAttribute === 'function') return el.getAttribute(name);
    if (name.startsWith('data-') && el.dataset) {
        const camel = name.slice(5).replace(/-([a-z])/g, (_, c) => c.toUpperCase());
        return el.dataset[camel] ?? null;
    }
    return null;
}

function setTweetActionElements(root, attr, twId, updateFn) {
    if (!root || typeof root.querySelectorAll !== 'function') return;
    root.querySelectorAll('[' + attr + ']').forEach(el => {
        if (readNodeAttr(el, attr) === twId) updateFn(el);
    });
}

function syncTweetActionDom(root, twId, tw) {
    if (!root || typeof root.querySelectorAll !== 'function') return;
    const saved = isBookmarked(twId);
    const liked = !!tw?.liked;
    const retweeted = !!tw?.retweeted;
    setTweetActionElements(root, 'data-reply-id', twId, el => {
        if (tw) el.innerHTML = renderActionInner('reply', formatCount(tw.replies || 0));
    });
    setTweetActionElements(root, 'data-rt-id', twId, el => {
        if (tw) el.innerHTML = renderActionInner('retweet', formatCount(tw.retweets || 0));
        if (el.classList) {
            el.classList.toggle('retweeted', retweeted);
            el.classList.toggle('busy', !!pendingActionLocks['rt:' + twId]);
        }
    });
    setTweetActionElements(root, 'data-like-id', twId, el => {
        if (tw) el.innerHTML = renderActionInner(liked ? 'heartFilled' : 'heart', formatCount(tw.likes || 0));
        if (el.classList) {
            el.classList.toggle('liked', liked);
            el.classList.toggle('busy', !!pendingActionLocks['like:' + twId]);
        }
    });
    setTweetActionElements(root, 'data-bm-id', twId, el => {
        el.innerHTML = renderActionInner(saved ? 'bookmarkFilled' : 'bookmark', saved ? 'Saved' : 'Save');
        if (el.classList) el.classList.toggle('saved', saved);
    });
}

function syncTweetActionState(twId) {
    const key = String(twId || '');
    const tw = findTweetById(key);
    if (tw) {
        allTweetsMap[key] = tw;
        currentTweetsList.forEach(item => {
            if (item && String(item.id) === key) Object.assign(item, tw);
        });
        const bmList = getBookmarks();
        let bmChanged = false;
        bmList.forEach(item => {
            if (item && String(item.id) === key && item !== tw) {
                Object.assign(item, tw);
                bmChanged = true;
            }
        });
        if (bmChanged) saveBookmarks(bmList);
    }
    syncTweetActionDom(document, key, tw);
    if (typeof savedFeedNodes !== 'undefined' && savedFeedNodes) {
        syncTweetActionDom(savedFeedNodes, key, tw);
    }
}

function syncVisibleTweetActions() {
    if (typeof document.querySelectorAll !== 'function') return;
    const seen = new Set();
    document.querySelectorAll('.tweet[data-id]').forEach(node => {
        const id = readNodeAttr(node, 'data-id');
        if (id && !seen.has(id)) {
            seen.add(id);
            syncTweetActionDom(document, id, findTweetById(id));
        }
    });
}

function toggleLike(twId, event) {
    if (event && event.stopPropagation) event.stopPropagation();
    const key = String(twId || '');
    markTweetSeen(key);
    const tw = findTweetById(key);
    if (!tw) return;
    const lockKey = 'like:' + key;
    if (pendingActionLocks[lockKey]) return;

    const prevLiked = !!tw.liked;
    const prevLikes = Number(tw.likes) || 0;
    const targetLiked = !prevLiked;

    pendingActionLocks[lockKey] = true;
    tw.liked = targetLiked;
    tw.likes = Math.max(0, prevLikes + (targetLiked ? 1 : -1));
    syncTweetActionState(key);

    const op = targetLiked ? 'FavoriteTweet' : 'UnfavoriteTweet';
    performPostMutation(op, { tweet_id: key }, (res) => {
        delete pendingActionLocks[lockKey];
        if (!res.ok) {
            tw.liked = prevLiked;
            tw.likes = prevLikes;
            syncTweetActionState(key);
            showStatus('Like failed: ' + (res.error || 'Try again'), true, 4500);
            return;
        }
        syncTweetActionState(key);
    });
}

function toggleRetweet(twId, event) {
    if (event && event.stopPropagation) event.stopPropagation();
    const key = String(twId || '');
    markTweetSeen(key);
    const tw = findTweetById(key);
    if (!tw) return;
    const lockKey = 'rt:' + key;
    if (pendingActionLocks[lockKey]) return;

    const prevRetweeted = !!tw.retweeted;
    const prevRetweets = Number(tw.retweets) || 0;
    const targetRetweeted = !prevRetweeted;

    pendingActionLocks[lockKey] = true;
    tw.retweeted = targetRetweeted;
    tw.retweets = Math.max(0, prevRetweets + (targetRetweeted ? 1 : -1));
    syncTweetActionState(key);

    const op = targetRetweeted ? 'CreateRetweet' : 'DeleteRetweet';
    const vars = targetRetweeted
        ? { tweet_id: key, dark_request: false }
        : { source_tweet_id: key, dark_request: false };

    performPostMutation(op, vars, (res) => {
        delete pendingActionLocks[lockKey];
        if (!res.ok) {
            tw.retweeted = prevRetweeted;
            tw.retweets = prevRetweets;
            syncTweetActionState(key);
            showStatus('Retweet failed: ' + (res.error || 'Try again'), true, 4500);
            return;
        }
        syncTweetActionState(key);
    });
}

function toggleBookmark(twId, event) {
    if (event && event.stopPropagation) event.stopPropagation();
    const key = String(twId || '');
    let list = getBookmarks().slice();
    let idx = list.findIndex(t => t && String(t.id) === key);
    let tweetObj = findTweetById(key);
    const willSave = idx < 0;

    if (!willSave) {
        list.splice(idx, 1);
        if (tweetObj) tweetObj.bookmarked = false;
        saveBookmarks(list);
        showStatus('Removed from offline saved', false, 2000);
    } else if (tweetObj) {
        tweetObj.bookmarked = true;
        list.unshift({ ...tweetObj });
        saveBookmarks(list);
        showStatus('Saved for offline reading', false, 2000);
    } else {
        showStatus('Could not save tweet offline', true, 3000);
        return;
    }

    syncTweetActionState(key);
    if (currentView === 'feed' && currentTab === 'cache') {
        const prevY = typeof window.scrollY === 'number' ? window.scrollY : 0;
        loadFeed('cache', false, true);
        if (typeof window.scrollTo === 'function') window.scrollTo(0, prevY);
    }
    if (window.AndroidBridge && typeof AndroidBridge.executePostWithTransactionAsync === 'function' &&
        (typeof navigator === 'undefined' || navigator.onLine !== false)) {
        performPostMutation(willSave ? 'CreateBookmark' : 'DeleteBookmark', { tweet_id: key }, () => {});
    }
}

// In-place HD image loader
function localImageUrl(url, mode, fresh = false) {
    const attempt = fresh ? imageRequestNonce + '-' + (++imageRequestSequence) : '';
    const target = fresh ? url + (url.includes('#') ? '&' : '#') + 'xlite-retry=' + attempt : url;
    const base = 'https://local.xlite/img?url=' + encodeURIComponent(target) + '&mode=' + mode;
    return fresh ? base + '&retry=' + attempt : base;
