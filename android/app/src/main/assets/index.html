}

function loadMoreSearch() {
    if (!searchState || !searchState.cursor || searchState.loading || currentView !== 'search') return;
    fetchSearchPage(viewGeneration, searchState.cursor);
}

function renderSearchLoadMore(message) {
    const box = document.getElementById('searchLoadMoreBox');
    if (!box || !searchState) return;
    if (!searchState.cursor && !message) { box.innerHTML = ''; return; }
    box.innerHTML = `<div class="load-more-box">
        ${message ? `<p class="card-desc" role="alert" style="margin-bottom:10px;">${escapeHtml(message)}</p>` : ''}
        <button type="button" class="btn btn-secondary btn-block" onclick="loadMoreSearch()" ${searchState.loading ? 'disabled' : ''}>
            ${searchState.loading ? 'Loading...' : message ? 'Retry Load More' : 'Load More'}
        </button>
    </div>`;
}

function fetchSearchPage(generation, cursor) {
    if (!searchState || searchState.loading || generation !== viewGeneration || currentView !== 'search') return;
    const state = searchState;
    const q = state.query;
    const isPaging = !!cursor;
    const resDiv = document.getElementById('searchResults');
    const btn = document.getElementById('searchBtn');
    state.loading = true;
    if (btn) btn.disabled = true;
    if (isPaging) renderSearchLoadMore();

    let variables = {
        rawQuery: q,
        count: 8,
        querySource: 'typed_query',
        product: 'Top'
    };
    if (cursor) variables.cursor = cursor;

    // Query IDs rotate. The first ID was verified against X's current web client.
    const queryIds = [state.queryId, 'vLHjqbDv7TPFMBkIIO1nOA', 'GcXk9vN_d1jUfHNqLacXQA'].filter((id, i, all) => id && all.indexOf(id) === i);
    let lastError = '';
    function showUnavailable(message) {
        if (generation !== viewGeneration || state !== searchState || currentView !== 'search') return;
        state.loading = false;
        if (btn) btn.disabled = false;
        if (isPaging) renderSearchLoadMore(message);
        else resDiv.innerHTML = `<div class="card"><div class="card-title" style="color:var(--red);">Search unavailable</div><p class="card-desc">${escapeHtml(message)}</p><button type="button" class="btn btn-secondary" onclick="openSearchInX()">Open X search (uses more data)</button></div>`;
    }
    function handleResponse(response, index, retry) {
        if (generation !== viewGeneration || state !== searchState || currentView !== 'search') return;
        const parsed = parseTwitterGraphql(response);
        if (parsed.error) {
            lastError = parsed.error;
            if (isQueryIdFailure(parsed)) retry(index + 1);
            else showUnavailable(lastError);
            return;
        }
        state.loading = false;
        state.queryId = queryIds[index];
        if (cursor) state.usedCursors.add(cursor);
        const freshTweets = parsed.tweets.filter(tweet => !state.seenIds.has(tweet.id));
        freshTweets.forEach(tweet => {
            state.seenIds.add(tweet.id);
            allTweetsMap[tweet.id] = tweet;
        });
        const next = parsed.nextCursor;
        state.cursor = next && next !== cursor && !state.usedCursors.has(next) ? next : null;
        if (btn) btn.disabled = false;
        if (isPaging) {
            currentTweetsList.push(...freshTweets);
            resDiv.insertAdjacentHTML('beforeend', freshTweets.map(renderTweetHtml).join(''));
        } else {
            renderSearchResults(q, freshTweets, resDiv);
        }
        renderSearchLoadMore();
    }
    function tryPostQuery(index) {
        if (generation !== viewGeneration || state !== searchState || currentView !== 'search') return;
        if (index >= queryIds.length) {
            showUnavailable(lastError || 'X changed its search endpoint. Please try again later.');
            return;
        }
        const path = `/i/api/graphql/${queryIds[index]}/SearchTimeline`;
        const body = JSON.stringify({ variables, features: GRAPHQL_FEATURES, queryId: queryIds[index] });
        // The original APK supports POST without X's newer GET transaction header.
        setTimeout(() => {
            if (generation !== viewGeneration || state !== searchState || currentView !== 'search') return;
            let response;
            try {
                response = AndroidBridge.executePost(`https://x.com${path}`, body);
            } catch (e) {
                showUnavailable('Search request failed. Please try again.');
                return;
            }
            handleResponse(response, index, tryPostQuery);
        }, 50);
    }
    function tryQuery(index) {
        if (generation !== viewGeneration || state !== searchState || currentView !== 'search') return;
        if (index >= queryIds.length) {
            showUnavailable(lastError || 'X changed its search endpoint. Please try again later.');
            return;
        }
        const path = `/i/api/graphql/${queryIds[index]}/SearchTimeline`;
        let transactionId;
        try {
            transactionId = searchTransactionClient.generateTransactionId('GET', path);
        } catch (e) {
            showUnavailable('Could not prepare X search. Please try again.');
            return;
        }
        const url = `https://x.com${path}?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;
        performAsyncGet(url, (response) => handleResponse(response, index, tryQuery), transactionId);
    }
    if (window.AndroidBridge && typeof AndroidBridge.executeSearchGetAsync !== 'function' && typeof AndroidBridge.executePost === 'function') {
        tryPostQuery(0);
        return;
    }
    prepareSearchTransaction((error) => {
        if (generation !== viewGeneration || state !== searchState || currentView !== 'search') return;
        if (error) showUnavailable(error);
        else tryQuery(0);
    });
}

function openSearchInX() {
    window.location.href = 'https://x.com/search?q=' + encodeURIComponent(lastSearchQuery);
}

function buildTweetVariables(text, replyToId, quoteTweet) {
    const variables = {
        tweet_text: text,
        dark_request: false,
        media: {
            media_entities: [],
            possibly_sensitive: false
        },
        semantic_annotation_ids: [],
        disallowed_reply_options: null
    };
    if (replyToId) {
        variables.reply = {
            in_reply_to_tweet_id: String(replyToId),
            exclude_reply_user_ids: []
        };
    }
    if (quoteTweet && quoteTweet.id) {
        variables.attachment_url = 'https://x.com/' + (quoteTweet.screenName || 'i') + '/status/' + String(quoteTweet.id);
    }
    return variables;
}

function postReply(e, replyToId) {
    e.preventDefault();
    const input = document.getElementById('replyText');
    const btn = document.getElementById('replyBtn');
    const text = input ? input.value.trim() : '';
    if (!text) return;
    const submitGeneration = viewGeneration;

    if (btn) {
        btn.disabled = true;
        btn.innerHTML = 'Posting...';
    }

    performPostMutation('CreateTweet', buildTweetVariables(text, replyToId), ({ ok, error }) => {
        const stillInThread = submitGeneration === viewGeneration && currentView === 'thread';
        if (!ok || error) {
            if (stillInThread) alert('Reply failed: ' + (error || 'Error'));
            else showStatus('Reply failed: ' + (error || 'Error'), true, 5000);
            if (btn) { btn.disabled = false; btn.innerHTML = 'Reply'; }
            return;
        }
        const parentTweet = findTweetById(replyToId);
        if (parentTweet) {
            parentTweet.replies = (Number(parentTweet.replies) || 0) + 1;
            syncTweetActionState(replyToId);
        }
        showStatus('Reply posted', false, 2500);
        if (stillInThread) {
            if (input) input.value = '';
            renderThreadView(replyToId);
        }
    });
}

function renderSearchResults(q, tweets, resDiv) {
    if (!tweets || tweets.length === 0) {
        currentTweetsList = [];
        resDiv.innerHTML = `<div class="card"><p class="card-desc">No results found for "${escapeHtml(q)}"</p></div>`;
        return;
    }
    currentTweetsList = tweets;
    let header = '';
    if (q.startsWith('from:')) {
        let user = q.replace('from:', '').trim();
        header = `
        <div style="padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:8px;">
            <div>
                <div style="font-weight:800; font-size:17px;">@${escapeHtml(user)}</div>
                <div style="font-size:13px; color:var(--text-muted);">Recent tweets</div>
            </div>
            <button type="button" class="btn btn-secondary" style="padding:6px 12px; font-size:12px;" onclick="openProfile('${escapeHtml(user)}')">Open Profile</button>
        </div>`;
    }
    resDiv.innerHTML = header + tweets.map(renderTweetHtml).join('');
    initVideoAutoPauseObserver(resDiv);
}

function updateComposeCharCount() {
    const input = document.getElementById('postText');
    const counter = document.getElementById('postCharCount');
    if (!input || !counter) return;
    const len = input.value.length;
    counter.textContent = len + ' / 280';
    counter.style.color = len > 280 ? 'var(--red)' : (len >= 260 ? '#f59e0b' : 'var(--text-muted)');
}

function renderPost() {
    const container = document.getElementById('mainContent');
    const quotedTweet = composeQuoteTweetId ? findTweetById(composeQuoteTweetId) : null;
    const quotePreviewHtml = quotedTweet ? `
        <div class="quoted-box" style="margin-bottom:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                <span style="font-size:12px; font-weight:700; color:var(--accent);">Quoting @${escapeHtml(quotedTweet.user_screen_name || 'post')}</span>
                <button type="button" class="header-btn" style="padding:2px 8px; font-size:11px;" onclick="composeQuoteTweetId=null;renderPost()">Cancel</button>
            </div>
            <div style="font-size:13px; color:var(--text-muted);">${escapeHtml(quotedTweet.text).slice(0, 180)}</div>
        </div>` : '';

    container.innerHTML = `
    <div class="card">
        <div class="card-title">${quotedTweet ? 'Quote Post' : 'Compose Post'}</div>
        ${quotePreviewHtml}
        <form onsubmit="executePostTweet(event)">
            <textarea id="postText" class="form-textarea" placeholder="${quotedTweet ? 'Add your comment...' : 'What is happening?!'}" maxlength="280" oninput="updateComposeCharCount()" required></textarea>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span id="postCharCount" style="font-size:12px; color:var(--text-muted);">0 / 280</span>
                <button type="submit" id="postBtn" class="btn">Post</button>
            </div>
        </form>
    </div>`;
}

function executePostTweet(e) {
    e.preventDefault();
    const input = document.getElementById('postText');
    const text = input ? input.value.trim() : '';
    const btn = document.getElementById('postBtn');
    if (!text) return;
    const submitGeneration = viewGeneration;
    const quoteTw = composeQuoteTweetId ? {
        id: composeQuoteTweetId,
        screenName: findTweetById(composeQuoteTweetId)?.user_screen_name || 'i'
    } : null;

    if (btn) {
        btn.disabled = true;
        btn.innerHTML = 'Posting...';
    }

    performPostMutation('CreateTweet', buildTweetVariables(text, null, quoteTw), ({ ok, error }) => {
        const stillComposing = submitGeneration === viewGeneration && currentView === 'post';
        if (!ok || error) {
            if (stillComposing) alert('Post failed: ' + (error || 'Error'));
            else showStatus('Post failed: ' + (error || 'Error'), true, 5000);
            if (btn) { btn.disabled = false; btn.innerHTML = 'Post'; }
            return;
        }
        composeQuoteTweetId = null;
        showStatus('Post published', false, 2500);
        if (stillComposing) nav('feed');
    });
}

function openProfile(screenName) {
    const clean = String(screenName || '').replace(/^@+/, '').trim();
    if (!clean) return;
    profileState = {
        screenName: clean,
        user: null,
        tab: 'tweets',
        tweets: [],
        cursor: null,
        loading: true,
        loadingMore: false,
        error: ''
    };
    nav('profile');
}

function openOwnProfile() {
    if (viewerIdentity?.screen_name) {
        openProfile(viewerIdentity.screen_name);
        return;
    }
    if (!appConfig.auth_token || !appConfig.ct0) {
        nav('settings');
        return;
    }
    showStatus('Loading your profile…', false, 2000);
    prepareXTransaction((err) => {
        if (!err && viewerIdentity?.screen_name) {
            openProfile(viewerIdentity.screen_name);
        } else {
            showStatus('Could not detect your handle yet. Tap any @username or search from:@you.', true, 4000);
        }
    });
}

function parseUserProfileResult(jsonStr) {
    let data;
    try { data = JSON.parse(jsonStr); } catch (_) { return null; }
    let u = data?.data?.user?.result || null;
    if (!u || u.__typename === 'UserUnavailable') return null;
    if (u.__typename === 'UserWithVisibilityResults') u = u.user || u;
    const core = u.core || {};
    const legacy = u.legacy || {};
    const id = String(u.rest_id || legacy.id_str || '');
    const screenName = core.screen_name || legacy.screen_name || '';
    if (!id && !screenName) return null;
    return {
        id,
        name: decodeHtmlEntities(core.name || legacy.name || screenName),
        screen_name: screenName,
        bio: decodeHtmlEntities(u.profile_bio?.description || legacy.description || ''),
        location: decodeHtmlEntities(u.location?.location || legacy.location || ''),
        avatar: u.avatar?.image_url || legacy.profile_image_url_https || '',
        banner: u.banner?.image_url || legacy.profile_banner_url || '',
        followers: Number(u.relationship_counts?.followers ?? legacy.followers_count) || 0,
        following_count: Number(u.relationship_counts?.following ?? legacy.friends_count) || 0,
        tweets_count: Number(u.tweet_counts?.tweets ?? legacy.statuses_count) || 0,
        following: !!(u.relationship_perspectives?.following ?? legacy.following),
        followed_by: !!(u.relationship_perspectives?.followed_by ?? legacy.followed_by),
        verified: !!(u.is_blue_verified || legacy.verified)
    };
}

function renderProfileShell(container) {
    const u = profileState?.user;
    const handle = u?.screen_name || profileState?.screenName || '';
    const isSelf = !!(viewerIdentity?.screen_name && handle.toLowerCase() === viewerIdentity.screen_name.toLowerCase());
    let headerCard = '';
    if (u) {
        const bannerHtml = (appConfig.image_mode === 'auto' && u.banner)
            ? `<img class="profile-banner" src="${localImageUrl(u.banner, supportsRichModeNative() ? 'rich' : 'hd')}" alt="" onerror="this.remove()" />`
            : `<div class="profile-banner"></div>`;
        const avatarMode = appConfig.image_mode === 'off' ? 'off' : (appConfig.image_mode === 'auto' ? 'hd' : 'normal');
        const avatarProxyMode = appConfig.image_mode === 'auto' ? (supportsRichModeNative() ? 'rich' : 'hd') : 'thumb';
        const avatarUrl = avatarVariantUrl(u.avatar, avatarMode);
        const initial = escapeHtml((u.name || u.screen_name || 'X')[0].toUpperCase());
        const avatarHtml = `<span class="tweet-avatar profile-avatar"><span>${initial}</span>${avatarUrl ? `<img class="tweet-avatar-img" src="${localImageUrl(avatarUrl, avatarProxyMode)}" alt="" onload="this.style.opacity='1'" onerror="this.remove()" />` : ''}</span>`;
        const followBtn = !isSelf && u.id
            ? `<button type="button" id="followToggleBtn" class="btn ${u.following ? 'btn-secondary' : ''}" onclick="toggleFollowUser('${escapeHtml(u.id)}')">${u.following ? 'Following' : 'Follow'}</button>`
            : `<button type="button" class="btn btn-secondary" onclick="searchTag('from:${escapeHtml(u.screen_name)}')">Search Posts</button>`;
        const verifiedBadge = verifiedBadgeHtml(u.verified);
        headerCard = `
        ${bannerHtml}
        <div class="profile-card">
            <div class="profile-top">
                ${avatarHtml}
                ${followBtn}
            </div>
            <div style="font-size:19px; font-weight:800;">${escapeHtml(u.name)}${verifiedBadge}</div>
            <div style="font-size:14px; color:var(--text-muted);">@${escapeHtml(u.screen_name)}${u.followed_by ? ' · Follows you' : ''}</div>
            ${u.bio ? `<div style="font-size:14px; margin-top:8px; white-space:pre-wrap;">${linkify(u.bio)}</div>` : ''}
            ${u.location ? `<div style="font-size:13px; color:var(--text-muted); margin-top:6px;">${uiSvg('pin')} ${escapeHtml(u.location)}</div>` : ''}
            <div class="profile-stats">
                <span><strong>${formatCount(u.following_count)}</strong> Following</span>
                <span><strong>${formatCount(u.followers)}</strong> Followers</span>
                <span><strong>${formatCount(u.tweets_count)}</strong> Posts</span>
            </div>
        </div>`;
    } else {
        headerCard = `
        <div class="profile-card" style="padding-top:14px;">
            <div style="font-size:18px; font-weight:800;">@${escapeHtml(handle)}</div>
            <div style="font-size:13px; color:var(--text-muted); margin-top:4px;">${profileState?.loading ? 'Loading profile…' : escapeHtml(profileState?.error || 'Profile details unavailable')}</div>
        </div>`;
    }

    const tabsHtml = `
    <div class="nav-tabs" style="position:static; border-bottom:1px solid var(--border);">
        <div class="nav-tab ${profileState?.tab !== 'replies' ? 'active' : ''}" onclick="switchProfileTab('tweets')">Posts</div>
        <div class="nav-tab ${profileState?.tab === 'replies' ? 'active' : ''}" onclick="switchProfileTab('replies')">Replies</div>
    </div>`;

    let bodyHtml = '';
    if (profileState?.loading && !profileState.tweets.length) {
        bodyHtml = '<div class="spinner">Loading posts...</div>';
    } else if (profileState?.error && !profileState.tweets.length) {
        bodyHtml = `<div class="card"><div class="card-title" style="color:var(--red);">Could not load profile</div><p class="card-desc">${escapeHtml(profileState.error)}</p><button type="button" class="btn btn-secondary" onclick="searchTag('from:${escapeHtml(handle)}')">View in Search</button></div>`;
    } else if (!profileState?.tweets?.length) {
        bodyHtml = '<div class="card"><p class="card-desc">No posts found for this user.</p></div>';
    } else {
        bodyHtml = profileState.tweets.map(renderTweetHtml).join('');
        if (profileState.cursor) {
            bodyHtml += `<div class="load-more-box"><button type="button" id="profileMoreBtn" class="btn btn-secondary btn-block" style="padding:10px;" onclick="loadMoreProfileTweets()" ${profileState.loadingMore ? 'disabled' : ''}>${profileState.loadingMore ? 'Loading...' : 'Load More'}</button></div>`;
        }
    }

    container.innerHTML = `
    <div class="sub-header">
        <button type="button" class="back-btn" onclick="restoreFeedView(currentFeedOrigin || currentTab, false)">&larr;</button>
        <span>${u ? escapeHtml(u.name) : '@' + escapeHtml(handle)}</span>
    </div>
    ${headerCard}
    ${tabsHtml}
    <div id="profileFeedBox">${bodyHtml}</div>`;
    initVideoAutoPauseObserver(container);
}

function renderProfileView() {
    const container = document.getElementById('mainContent');
    if (!profileState || !profileState.screenName) {
        openOwnProfile();
        return;
    }
    const gen = viewGeneration;
    renderProfileShell(container);

    const vars = { screen_name: profileState.screenName, withGuxResearchUserId: true };
    const path = `/i/api/graphql/AMIBMjtxEEATh4z8V9GtRg/UserByScreenName?variables=${encodeURIComponent(JSON.stringify(vars))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;
    performSignedGet(path, (resStr) => {
        if (gen !== viewGeneration || currentView !== 'profile') return;
        const user = parseUserProfileResult(resStr);
        if (!user || !user.id) {
            profileState.loading = false;
            profileState.error = 'Profile unavailable or suspended.';
            renderProfileShell(container);
            return;
        }
        profileState.user = user;
        renderProfileShell(container);
        fetchProfileTimeline(gen, false);
    });
}

function switchProfileTab(tab) {
    if (!profileState || profileState.tab === tab) return;
    profileState.tab = tab;
    profileState.tweets = [];
    profileState.cursor = null;
    profileState.loading = true;
    profileState.error = '';
    const gen = ++viewGeneration;
    renderProfileShell(document.getElementById('mainContent'));
    if (profileState.user?.id) fetchProfileTimeline(gen, false);
}

function loadMoreProfileTweets() {
    if (!profileState || !profileState.cursor || profileState.loadingMore || !profileState.user?.id) return;
    profileState.loadingMore = true;
    const btn = document.getElementById('profileMoreBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Loading...'; }
    fetchProfileTimeline(viewGeneration, true);
}

function fetchProfileTimeline(gen, isPaging) {
    if (!profileState?.user?.id) return;
    const isReplies = profileState.tab === 'replies';
    const qId = isReplies ? 'FmuxExUC21Xn_C2NwtX5sQ' : 'D6z-FJI2pKuwEeYYxVIGbg';
    const op = isReplies ? 'UserTweetsAndReplies' : 'UserTweets';
    const vars = {
        userId: profileState.user.id,
        count: getFeedPageSize(),
        includePromotedContent: false,
        withQuickPromoteEligibilityTweetFields: false,
        withVoice: true,
        withV2Timeline: true
    };
    if (isReplies) vars.withCommunity = true;
    if (isPaging && profileState.cursor) vars.cursor = profileState.cursor;
    const path = `/i/api/graphql/${qId}/${op}?variables=${encodeURIComponent(JSON.stringify(vars))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;
    performSignedGet(path, (resStr) => {
        if (gen !== viewGeneration || currentView !== 'profile') return;
        profileState.loading = false;
        profileState.loadingMore = false;
        const parsed = parseTwitterGraphql(resStr);
        if (parsed.error && !parsed.tweets.length) {
            profileState.error = parsed.error;
        } else {
            const existing = new Set(profileState.tweets.map(t => t.id));
            const added = (parsed.tweets || []).filter(t => t && !existing.has(t.id) && existing.add(t.id));
            if (isPaging) profileState.tweets.push(...added);
            else profileState.tweets = parsed.tweets || [];
            profileState.cursor = parsed.nextCursor || null;
            profileState.error = '';
        }
        renderProfileShell(document.getElementById('mainContent'));
    });
}

function toggleFollowUser(userId) {
    if (!profileState?.user || String(profileState.user.id) !== String(userId)) return;
    if (!supportsSignedPostTimelines()) {
        showStatus('Update to v1.0.22 APK to follow accounts in-app.', true, 3500);
        return;
    }
    const u = profileState.user;
    const prev = !!u.following;
    const target = !prev;
    u.following = target;
    u.followers = Math.max(0, u.followers + (target ? 1 : -1));
    renderProfileShell(document.getElementById('mainContent'));
    const endpoint = target ? '/i/api/1.1/friendships/create.json' : '/i/api/1.1/friendships/destroy.json';
    performSignedFormPost(endpoint, 'user_id=' + encodeURIComponent(String(userId)), (resStr) => {
        let ok = false;
        try {
            const parsed = JSON.parse(resStr);
            ok = !parsed.error && !parsed.errors;
        } catch (_) {}
        if (!ok) {
            u.following = prev;
            u.followers = Math.max(0, u.followers + (prev ? 1 : -1));
            showStatus('Follow action failed. Try again.', true, 3500);
            if (currentView === 'profile') renderProfileShell(document.getElementById('mainContent'));
        } else {
            showStatus(target ? 'Followed @' + u.screen_name : 'Unfollowed @' + u.screen_name, false, 2000);
        }
    });
}

function renderNotifications() {
    const container = document.getElementById('mainContent');
    const gen = viewGeneration;
    container.innerHTML = `
    <div class="sub-header">
        <button type="button" class="back-btn" onclick="restoreFeedView(currentFeedOrigin || currentTab, false)">&larr;</button>
        <span>Notifications</span>
    </div>
    <div id="notifListBox"><div class="spinner">Loading notifications...</div></div>`;

    const path = '/i/api/2/notifications/all.json?count=30&tweet_mode=extended&include_profile_interstitial_type=1&include_blocking=1&include_blocked_by=1&include_followed_by=1&include_want_retweets=1&include_mute_edge=1&include_can_dm=1&include_ext_has_nft_avatar=1&include_ext_is_blue_verified=1&include_ext_verified_type=1&include_ext_profile_image_shape=1&skip_status=1';
    performSignedGet(path, (resStr) => {
        if (gen !== viewGeneration || currentView !== 'notifications') return;
        const box = document.getElementById('notifListBox');
        if (!box) return;
        let data;
        try { data = JSON.parse(resStr); } catch (_) { data = null; }
        if (!data || data.error || !data.globalObjects) {
            box.innerHTML = `<div class="card"><div class="card-title" style="color:var(--red);">Could not load alerts</div><p class="card-desc">${escapeHtml(data?.message || data?.errors?.[0]?.message || 'Check connection and retry.')}</p><button type="button" class="btn btn-secondary" onclick="renderNotifications()">Retry</button></div>`;
            return;
        }
        const go = data.globalObjects;
        const users = go.users || {};
        const rawTweets = go.tweets || {};
        for (const tid in rawTweets) {
            const tw = rawTweets[tid];
            if (tw && !tw.user) tw.user = users[tw.user_id_str] || {};
            parseSingleTweet(tw);
        }
        const items = Object.values(go.notifications || {}).sort((a, b) => Number(b.timestampMs || 0) - Number(a.timestampMs || 0));
        if (!items.length) {
            box.innerHTML = '<div class="card"><p class="card-desc">No recent notifications.</p></div>';
            return;
        }
        const iconMap = {
            reply_icon: uiSvg('reply'),
            heart_icon: uiSvg('heartFilled'),
            retweet_icon: uiSvg('retweet'),
            person_icon: uiSvg('user'),
            bird_icon: uiSvg('xLogo'),
            bell_icon: uiSvg('bell')
        };
        box.innerHTML = items.map(n => {
            const msg = decodeHtmlEntities(n.message?.text || '');
            const iconKey = n.icon?.id || '';
            const icon = iconMap[iconKey] || uiSvg('bell');
            const tpl = n.template?.aggregateUserActionsV1 || {};
            const targetTweetId = tpl.targetObjects?.[0]?.tweet?.id || n.targetObjects?.[0]?.tweet?.id || '';
            const firstUid = tpl.fromUsers?.[0]?.user?.id || '';
            const firstUser = users[firstUid] || null;
            const targetTweet = targetTweetId ? findTweetById(targetTweetId) : null;
            const timeTxt = n.timestampMs ? formatRelativeTime(Number(n.timestampMs)) : '';
            const clickAction = targetTweetId
                ? `viewThread('${escapeHtml(targetTweetId)}')`
                : (firstUser?.screen_name ? `openProfile('${escapeHtml(firstUser.screen_name)}')` : '');
            const iconColor = iconKey === 'heart_icon' ? '#f91880' : (iconKey === 'retweet_icon' ? '#00ba7c' : 'var(--accent)');
            return `
            <div class="notif-row" ${clickAction ? `onclick="${clickAction}"` : ''}>
                <div class="notif-icon" style="color:${iconColor};">${icon}</div>
                <div style="flex:1; min-width:0;">
                    <div style="font-size:14px; font-weight:600;">${escapeHtml(msg)} ${timeTxt ? `<span style="color:var(--text-muted); font-weight:400;">· ${escapeHtml(timeTxt)}</span>` : ''}</div>

        }).join('');
    });

        const hide = saveHideAdsPref(rawValue === 'true');

function compareSemver(a, b) {
    const pa = String(a || '').split('.').map(n => parseInt(n, 10));
    const pb = String(b || '').split('.').map(n => parseInt(n, 10));
    if (pa.length !== 3 || pb.length !== 3 || pa.some(Number.isNaN) || pb.some(Number.isNaN)) return 0;
    for (let i = 0; i < 3; i++) {
        if (pa[i] !== pb[i]) return pa[i] - pb[i];
    }
    return 0;
}

function formatBytesMb(bytes) {
    return (Math.max(0, Number(bytes) || 0) / (1024 * 1024)).toFixed(1) + ' MB';
}

function resolveApkDownloadUrl(apkVersion, candidateUrl) {
    if (candidateUrl && /^https:\/\/github\.com\/sovopr\/xlite-(?:android|releases)\/releases\/download\/v[0-9]+\.[0-9]+\.[0-9]+\/xlite-fup-release\.apk$/.test(candidateUrl)) {
        return candidateUrl;
    }
    if (apkVersion && /^[0-9]+\.[0-9]+\.[0-9]+$/.test(apkVersion)) {
        return 'https://github.com/sovopr/xlite-android/releases/download/v' + apkVersion + '/xlite-fup-release.apk';
    }
    return candidateUrl || LATEST_APK_URL;
}

function openApkDownloadInBrowser(targetVersion, targetUrl) {
    const ver = targetVersion || (pendingApkDownload && pendingApkDownload.version) || LATEST_APK_VERSION;
    const candidate = targetUrl || (pendingApkDownload && pendingApkDownload.url) || '';
    const resolved = resolveApkDownloadUrl(ver, candidate);
    if (window.AndroidBridge && typeof AndroidBridge.openExternalUrl === 'function') {
        if (AndroidBridge.openExternalUrl(resolved)) return true;
    }
    if (typeof window !== 'undefined' && window.location) {
        window.location.href = resolved;
    }
    return true;
}

function reloadSavedWebUpdate() {
    if (window.AndroidBridge && typeof AndroidBridge.reloadApp === 'function') {
        AndroidBridge.reloadApp();
        return true;
    }
    if (typeof window !== 'undefined' && window.location && typeof window.location.reload === 'function') {
        window.location.reload();
        return true;
    }
    return false;
}

window.__onApkUpdateEvent = function(rawJson) {
    let evt = null;
    try { evt = typeof rawJson === 'string' ? JSON.parse(rawJson) : rawJson; } catch (_) { return; }
    if (!evt || !evt.state) return;

    const statusText = document.getElementById('updateStatusText');
    const updateBtn = document.getElementById('updateBtn');
    const apkBtn = document.getElementById('apkUpdateBtn');
    const cancelBtn = document.getElementById('cancelApkUpdateBtn');
    const browserBtn = document.getElementById('apkBrowserFallbackBtn');
    const reloadBtn = document.getElementById('reloadWebUpdateBtn');

    if (evt.state === 'downloading') {
        activeApkDownloadState = evt;
        const pct = typeof evt.percent === 'number' && evt.percent >= 0 ? evt.percent + '% ' : '';
        const sizeNote = evt.totalBytes > 0
            ? '(' + formatBytesMb(evt.bytes) + ' / ' + formatBytesMb(evt.totalBytes) + ')'
            : '(' + formatBytesMb(evt.bytes) + ')';
        if (statusText) statusText.textContent = 'Downloading full update v' + (evt.version || '') + '... ' + pct + sizeNote;
        if (updateBtn) { updateBtn.disabled = true; updateBtn.textContent = 'Downloading Update...'; }
        if (apkBtn) apkBtn.disabled = true;
        if (cancelBtn) cancelBtn.style.display = 'block';
        if (browserBtn) browserBtn.style.display = 'none';
        if (reloadBtn) reloadBtn.style.display = 'none';
        return;
    }

    if (evt.state === 'verifying') {
        if (statusText) statusText.textContent = 'Verifying package signature and integrity...';
        if (cancelBtn) cancelBtn.style.display = 'none';
        return;
    }

    activeApkDownloadState = null;
    if (cancelBtn) cancelBtn.style.display = 'none';

    if (evt.state === 'permission_required') {
        if (statusText) statusText.textContent = evt.message || "Enable 'Allow from this source' in Android Settings, then return to X Lite.";
        if (updateBtn) { updateBtn.disabled = false; updateBtn.textContent = 'Install Ready Update (v' + (evt.version || LATEST_APK_VERSION) + ')'; }
        if (apkBtn) { apkBtn.disabled = false; apkBtn.textContent = 'Install Ready Update (v' + (evt.version || LATEST_APK_VERSION) + ')'; }
        return;
    }

    if (evt.state === 'installing') {
        pendingWebReloadVersion = '';
        if (statusText) statusText.textContent = 'Opening Android installer for v' + (evt.version || '') + ' — tap Install to finish.';
        if (updateBtn) { updateBtn.disabled = false; updateBtn.textContent = 'Check & Install Updates'; }
        if (apkBtn) { apkBtn.disabled = false; apkBtn.textContent = 'Install Ready Update (v' + (evt.version || LATEST_APK_VERSION) + ')'; }
        if (browserBtn) browserBtn.style.display = 'none';
        if (reloadBtn) reloadBtn.style.display = 'none';
        return;
    }

    if (evt.state === 'cancelled' || evt.state === 'error') {
        const errMsg = evt.message || 'Full app update failed. Please try again.';
        const httpMatch = errMsg.match(/HTTP\s*(401|403|404)\b/i);
        const httpCode = Number(evt.code || (httpMatch ? httpMatch[1] : 0));
        const isAuthHttpError = httpCode === 401 || httpCode === 403 || httpCode === 404;
        const targetVer = evt.version || (pendingApkDownload && pendingApkDownload.version) || LATEST_APK_VERSION;
        if (statusText) {
            if (isAuthHttpError && evt.state === 'error') {
                statusText.textContent = 'Direct APK download failed (HTTP ' + httpCode + ' — private GitHub release). Tap Open Download in Browser below (signed into GitHub) to install v' + targetVer + '.'
                    + (pendingWebReloadVersion ? ' Web UI v' + pendingWebReloadVersion + ' is ready — tap Apply Saved Web UI.' : '');
            } else {
                statusText.textContent = errMsg;
            }
        }
        if (updateBtn) { updateBtn.disabled = false; updateBtn.textContent = 'Check & Install Updates'; }
        if (apkBtn) apkBtn.disabled = false;
        if (browserBtn && evt.state === 'error') {
            browserBtn.style.display = 'block';
            browserBtn.textContent = 'Open Download in Browser (v' + targetVer + ')';
        }
        if (reloadBtn && pendingWebReloadVersion) {
            reloadBtn.style.display = 'block';
            reloadBtn.textContent = 'Apply Saved Web UI (v' + pendingWebReloadVersion + ')';
        }
    }
};

function startNativeApkUpdate(apkVersion, apkUrl, apkSha256 = LATEST_APK_SHA256) {
    const statusText = document.getElementById('updateStatusText');
    const updateBtn = document.getElementById('updateBtn');
    const apkBtn = document.getElementById('apkUpdateBtn');
    const targetUrl = resolveApkDownloadUrl(apkVersion, apkUrl);
    const targetVersion = apkVersion || LATEST_APK_VERSION;
    const expectedSha = typeof apkSha256 === 'string' && /^[0-9a-fA-F]{64}$/.test(apkSha256.trim()) ? apkSha256.trim().toLowerCase() : '';
    pendingApkDownload = { version: targetVersion, url: targetUrl, sha256: expectedSha };

    if (window.AndroidBridge && (typeof AndroidBridge.installApkUpdateVerifiedAsync === 'function' || typeof AndroidBridge.installApkUpdateAsync === 'function')) {
        if (statusText) statusText.textContent = 'Preparing full update v' + targetVersion + '...';
        if (updateBtn) { updateBtn.disabled = true; updateBtn.textContent = 'Downloading Update...'; }
        if (apkBtn) apkBtn.disabled = true;
        const started = typeof AndroidBridge.installApkUpdateVerifiedAsync === 'function'
            ? AndroidBridge.installApkUpdateVerifiedAsync(targetUrl, targetVersion, expectedSha)
            : AndroidBridge.installApkUpdateAsync(targetUrl, targetVersion);
        if (!started) {
            if (statusText) statusText.textContent = 'Update download is already in progress or blocked.';
            if (updateBtn) { updateBtn.disabled = false; updateBtn.textContent = 'Check & Install Updates'; }
            if (apkBtn) apkBtn.disabled = false;
        }
        return started;
    }
    return false;
}

function cancelNativeApkUpdate() {
    if (window.AndroidBridge && typeof AndroidBridge.cancelApkDownload === 'function') {
        AndroidBridge.cancelApkDownload();
    }
}

function downloadApkUpdate(targetVersion = LATEST_APK_VERSION, targetUrl = LATEST_APK_URL) {
    if (window.AndroidBridge && typeof AndroidBridge.installApkUpdateAsync === 'function') {
        if (startNativeApkUpdate(targetVersion, targetUrl)) return;
    }
    const resolved = targetUrl || resolveApkDownloadUrl(targetVersion, '');
    if (window.AndroidBridge && typeof AndroidBridge.openExternalUrl === 'function') {
        if (AndroidBridge.openExternalUrl(resolved)) return;
    }
    window.location.href = resolved;
}

// In-app hot updater
function triggerAppUpdate() {
    const statusText = document.getElementById('updateStatusText');
    const updateBtn = document.getElementById('updateBtn');
    if (statusText) statusText.innerHTML = 'Checking for updates...';
    if (updateBtn) updateBtn.disabled = true;

    const updateUrl = 'https://gist.githubusercontent.com/sovopr/c52e8a1490b3a5415525b27063726bbe/raw/index.html?t=' + Date.now();
    const controller = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = controller ? setTimeout(() => controller.abort(), 25000) : null;

    // Use native fetch first (clean network stack without Twitter headers)
    fetch(updateUrl, controller ? { signal: controller.signal } : undefined)
        .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
        })
        .then(html => {
            if (timer) clearTimeout(timer);
            if (html && html.includes('<!DOCTYPE html>') && html.includes('mainContent')) {
                applyUpdate(html);
            } else {
                throw new Error('Invalid update file');
            }
        })
        .catch(() => {
            if (timer) clearTimeout(timer);
            // Fallback to bridge with clean headers
            performAsyncGet(updateUrl, (bridgeHtml) => {
                if (bridgeHtml && bridgeHtml.includes('<!DOCTYPE html>') && bridgeHtml.includes('mainContent')) {
                    applyUpdate(bridgeHtml);
                } else {
                    if (statusText) statusText.innerHTML = 'Update check failed or timed out. Please try again.';
                    if (updateBtn) updateBtn.disabled = false;
                }
            });
        });
}

function applyUpdate(newHtml) {
    const statusText = document.getElementById('updateStatusText');
    const updateBtn = document.getElementById('updateBtn');
    const versionMatch = newHtml.match(/const APP_VERSION = '([0-9]+\.[0-9]+\.[0-9]+)'/);
    if (!versionMatch) {
        if (statusText) statusText.textContent = 'Update file has no version information.';
        if (updateBtn) { updateBtn.disabled = false; updateBtn.textContent = 'Check & Install Updates'; }
        return;
    }

    const remoteWeb = versionMatch[1];
    const apkMatch = newHtml.match(/const LATEST_APK_VERSION = '([0-9]+\.[0-9]+\.[0-9]+)'/);
    const remoteApk = apkMatch ? apkMatch[1] : remoteWeb;
    const urlMatch = newHtml.match(/const LATEST_APK_URL = '(https:\/\/[^']+)'/);
    const remoteApkUrl = resolveApkDownloadUrl(remoteApk, urlMatch ? urlMatch[1] : '');
    const shaMatch = newHtml.match(/const LATEST_APK_SHA256 = '([0-9a-fA-F]{64})'/);
    const remoteApkSha256 = shaMatch ? shaMatch[1].toLowerCase() : '';

    let installedApk = 'unknown';
    try {
        if (window.AndroidBridge && AndroidBridge.getAppVersionInfo) {
            installedApk = JSON.parse(AndroidBridge.getAppVersionInfo()).version || 'unknown';
        }
    } catch(e) {}

    const needsApk = installedApk !== 'unknown' && compareSemver(remoteApk, installedApk) > 0;
    const needsWeb = compareSemver(remoteWeb, APP_VERSION) > 0;
    const supportsInAppApk = !!(window.AndroidBridge && (typeof AndroidBridge.installApkUpdateVerifiedAsync === 'function' || typeof AndroidBridge.installApkUpdateAsync === 'function'));

    if (needsApk && supportsInAppApk) {
        if (needsWeb && AndroidBridge.saveLiveHtml) {
            if (AndroidBridge.saveLiveHtml(newHtml)) {
                pendingWebReloadVersion = remoteWeb;
            }
        }
        startNativeApkUpdate(remoteApk, remoteApkUrl, remoteApkSha256);
        return;
    }

    if (needsWeb) {
        if (window.AndroidBridge && AndroidBridge.saveLiveHtml) {
            let ok = AndroidBridge.saveLiveHtml(newHtml);
            if (ok) {
                if (statusText) statusText.innerHTML = needsApk
                    ? 'Web UI updated to v' + remoteWeb + '. Reloading to show APK update...'
                    : 'Update installed. Reloading...';
                setTimeout(() => {
                    AndroidBridge.reloadApp();
                }, 800);
            } else {
                if (statusText) statusText.innerHTML = 'Failed to save update.';
                if (updateBtn) { updateBtn.disabled = false; updateBtn.textContent = 'Check & Install Updates'; }
            }
        } else {
            alert("Please install the current APK once to enable in-app updates.");
        }
        return;
    }

    if (statusText) {
        statusText.textContent = needsApk
            ? 'Web UI is up to date (v' + APP_VERSION + '). Install v' + remoteApk + ' APK below once to enable full self-updates.'
            : 'Already up to date (v' + APP_VERSION + ').';
    }
    if (updateBtn) { updateBtn.disabled = false; updateBtn.textContent = 'Check & Install Updates'; }
}

function resetToFactoryAsset() {
    if (window.AndroidBridge && AndroidBridge.resetLiveHtml) {
        AndroidBridge.resetLiveHtml();
        alert("Reset to bundled version. Reloading...");
        AndroidBridge.reloadApp();
    }
}

window.onload = init;
</script>
