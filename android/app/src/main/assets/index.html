function mediaHdUrl(url) {
    try {
        const parsed = new URL(url);
        if (parsed.protocol !== 'https:' || parsed.hostname !== 'pbs.twimg.com') return url;
        const cleanPath = parsed.pathname.replace(/:(thumb|small|medium|large|orig)$/, '');
        if (cleanPath.startsWith('/media/') && (/\.png$/i.test(cleanPath) || parsed.searchParams.get('format') === 'png')) {
            parsed.pathname = cleanPath;
            parsed.searchParams.set('format', 'webp');
            return parsed.href;
        }
        return url;
    } catch (_) { return url; }
}

function loadHdImg(btn, url, imgId, fallbackUrl) {
    const fresh = btn.dataset.retryRequested === '1';
    const rawTarget = fallbackUrl || url;
    const hdTarget = mediaHdUrl(url);
    btn.innerHTML = 'Loading HD...';
    btn.disabled = true;
    const img = document.getElementById(imgId);
    if (!img) {
        btn.innerHTML = 'Retry HD';
        btn.disabled = false;
        return;
    }

    let settled = false;
    const hdImg = new Image();
    activeImageLoads.add(hdImg);
    const timer = setTimeout(() => {
        if (!settled && typeof hdImg.onerror === 'function') hdImg.onerror();
    }, 95000);
    const cleanup = () => {
        clearTimeout(timer);
        activeImageLoads.delete(hdImg);
    };

    hdImg.onload = function() {
        if (settled) return;
        settled = true;
        cleanup();
        img.src = hdImg.src;
        btn.innerHTML = uiSvg('check') + ' HD · Reload';
        btn.disabled = false;
        btn.dataset.retryRequested = '1';
        btn.style.color = 'var(--accent)';
    };
    hdImg.onerror = function() {
        if (settled) return;
        if (!hdImg.dataset.fallbackTried && hdTarget !== rawTarget) {
            hdImg.dataset.fallbackTried = '1';
            hdImg.src = localImageUrl(rawTarget, 'hd', true);
            return;
        }
        settled = true;
        cleanup();
        btn.innerHTML = 'Retry HD';
        btn.disabled = false;
        btn.dataset.retryRequested = '1';
    };
    hdImg.src = localImageUrl(hdTarget, 'hd', fresh);
}

function loadThumbImg(btn, url, imgId, hdUrl = url) {
    const fresh = btn.dataset.retryRequested === '1';
    btn.innerHTML = 'Loading image...';
    btn.disabled = true;
    let settled = false;
    const img = document.createElement('img');
    img.id = imgId;
    img.className = 'tweet-img';
    activeImageLoads.add(img);
    const timer = setTimeout(() => {
        if (!settled && typeof img.onerror === 'function') img.onerror();
    }, 55000);
    const cleanup = () => {
        clearTimeout(timer);
        activeImageLoads.delete(img);
    };

    img.onload = function() {
        if (settled) return;
        settled = true;
        cleanup();
        const parent = btn.parentElement;
        parent.innerHTML = '';
        parent.appendChild(img);
        const hdBox = document.createElement('div');
        hdBox.style = 'text-align:right; margin-top:4px;';
        hdBox.innerHTML = `
            <button type="button" data-url="${escapeHtml(hdUrl)}" onclick="loadHdImg(this, this.dataset.url, '${imgId}')" style="font-size:12px; color:var(--text-muted); background:none; border:none; cursor:pointer; padding:4px 8px;">
                HD View
            </button>`;
        parent.appendChild(hdBox);
    };
    img.onerror = function() {
        if (settled) return;
        if (url !== hdUrl && !img.dataset.originalRetried) {
            img.dataset.originalRetried = '1';
            img.src = localImageUrl(hdUrl, 'thumb', true);
            return;
        }
        settled = true;
        cleanup();
        btn.innerHTML = 'Retry loading';
        btn.disabled = false;
        btn.dataset.retryRequested = '1';
    };
    img.src = localImageUrl(url, 'thumb', fresh);
}

function retryOriginalPreview(img) {
    const originalUrl = img.dataset.originalUrl || img.dataset.previewUrl;
    if (!img.dataset.originalRetried && originalUrl !== img.dataset.previewUrl) {
        img.dataset.originalRetried = '1';
        img.src = localImageUrl(originalUrl, 'thumb', true);
        return;
    }
    if (!img.parentElement) return;
    const retryButton = document.createElement('button');
    retryButton.type = 'button';
    retryButton.className = 'btn btn-secondary btn-block';
    retryButton.textContent = 'Retry small preview';
    retryButton.dataset.retryRequested = '1';
    retryButton.onclick = () => loadThumbImg(retryButton, img.dataset.previewUrl, img.id, originalUrl);
    img.replaceWith(retryButton);
}

function mediaPreviewUrl(url, isVideo) {
    if (!isVideo) return url;
    try {
        const parsed = new URL(url);
        if (parsed.protocol !== 'https:' || parsed.hostname !== 'pbs.twimg.com') return url;
        const cleanPath = parsed.pathname.replace(/:(thumb|small|medium|large|orig)$/, '');
        if (cleanPath.startsWith('/media/')) {
            parsed.pathname = cleanPath;
            parsed.searchParams.set('name', 'thumb');
            return parsed.href;
        }
        const ext = (cleanPath.split('.').pop() || 'jpg').toLowerCase();
        const format = ['jpg', 'jpeg', 'png', 'webp'].includes(ext) ? (ext === 'jpeg' ? 'jpg' : ext) : 'jpg';
        parsed.pathname = cleanPath + ':thumb';
        parsed.search = '';
        parsed.searchParams.set('format', format);
        return parsed.href;
    } catch (_) { return url; }
}

function mediaPosterUrl(url) {
    try {
        const parsed = new URL(url);
        if (parsed.protocol !== 'https:' || parsed.hostname !== 'pbs.twimg.com') return url;
        parsed.pathname = parsed.pathname.replace(/:(thumb|small|medium|large|orig)$/, '');
        return parsed.href;
    } catch (_) { return url; }
}

function avatarVariantUrl(url, mode = 'mini') {
    if (!url || mode === 'off') return '';
    try {
        const parsed = new URL(url);
        if (parsed.protocol !== 'https:' || parsed.hostname !== 'pbs.twimg.com') return '';
        if (!parsed.pathname.startsWith('/profile_images/')) return '';
        if (/\.gif$/i.test(parsed.pathname)) return '';
        const suffix = mode === 'hd' ? '_200x200'
            : (mode === 'bigger' ? '_bigger'
            : (mode === 'normal' ? '_normal' : '_mini'));
        parsed.pathname = parsed.pathname.replace(/_(mini|normal|bigger|200x200|400x400)(\.[a-z0-9]+)$/i, suffix + '$2');
        return parsed.href;
    } catch (_) { return ''; }
}

function getEffectiveAvatarMode() {
    if (appConfig.image_mode === 'off') return 'off';
    const pref = appConfig.avatar_mode || 'mini';
    return ['mini', 'normal', 'off'].includes(pref) ? pref : 'mini';
}

function renderAvatarHtml(tw, sizeClass = '') {
    const label = String(tw.user_name || tw.user_screen_name || 'X').trim();
    const initial = escapeHtml((label[0] || 'X').toUpperCase());
    const effective = getEffectiveAvatarMode();
    const isRich = appConfig.image_mode === 'auto';
    const variant = effective === 'off'
        ? 'off'
        : (isRich ? (effective === 'normal' ? 'bigger' : 'normal') : effective);
    const proxyMode = isRich ? (supportsRichModeNative() ? 'rich' : 'hd') : 'thumb';
    const srcUrl = avatarVariantUrl(tw.user_avatar, variant);
    const clickAttr = (!sizeClass && tw.user_screen_name)
        ? ` onclick="openProfile('${escapeHtml(tw.user_screen_name)}'); event.stopPropagation();"`
        : '';
    const imgTag = srcUrl
        ? `<img class="tweet-avatar-img" src="${localImageUrl(srcUrl, proxyMode)}" alt="" loading="lazy" decoding="async" onload="this.style.opacity='1'" onerror="this.remove()" />`
        : '';
    return `<span class="tweet-avatar${sizeClass ? ' ' + sizeClass : ''}"${clickAttr}><span>${initial}</span>${imgTag}</span>`;
}

function renderLightboxFrame() {
    if (!lightboxState || !lightboxState.photos.length) return;
    const item = lightboxState.photos[lightboxState.index];
    const img = document.getElementById('lightboxImg');
    const counter = document.getElementById('lightboxCounter');
    const zoomBtn = document.getElementById('lightboxZoomBtn');
    const prev = document.getElementById('lightboxPrev');
    const next = document.getElementById('lightboxNext');
    const cap = document.getElementById('lightboxCaption');
    if (img) {
        img.classList.toggle('zoomed', !!lightboxState.zoomed);
        img.src = localImageUrl(mediaHdUrl(item.url), 'hd');
        img.alt = item.alt_text || '';
    }
    if (counter) counter.textContent = (lightboxState.index + 1) + ' / ' + lightboxState.photos.length;
    if (zoomBtn) zoomBtn.textContent = lightboxState.zoomed ? 'Fit' : 'Zoom';
    if (prev) prev.style.display = lightboxState.photos.length > 1 ? 'block' : 'none';
    if (next) next.style.display = lightboxState.photos.length > 1 ? 'block' : 'none';
    if (cap) {
        if (item.alt_text) {
            cap.textContent = item.alt_text;
            cap.style.display = 'block';
        } else {
            cap.textContent = '';
            cap.style.display = 'none';
        }
    }
}

function openLightbox(twId, idx, event) {
    if (event && event.stopPropagation) event.stopPropagation();
    const tw = findTweetById(twId);
    const photos = (tw?.media || []).filter(m => m && m.type !== 'video' && m.type !== 'animated_gif' && m.url);
    if (!photos.length) return;
    lightboxState = {
        photos,
        index: Math.max(0, Math.min(photos.length - 1, Number(idx) || 0)),
        zoomed: false
    };
    const modal = document.getElementById('mediaLightbox');
    if (modal) modal.classList.add('open');
    renderLightboxFrame();
}

function stepLightbox(delta, event) {
    if (event && event.stopPropagation) event.stopPropagation();
    if (!lightboxState || !lightboxState.photos.length) return;
    const len = lightboxState.photos.length;
    lightboxState.index = (lightboxState.index + delta + len) % len;
    lightboxState.zoomed = false;
    renderLightboxFrame();
}

function toggleLightboxZoom(event) {
    if (event && event.stopPropagation) event.stopPropagation();
    if (!lightboxState) return;
    lightboxState.zoomed = !lightboxState.zoomed;
    renderLightboxFrame();
}

function closeLightbox(event) {
    if (event && event.stopPropagation) event.stopPropagation();
    lightboxState = null;
    const modal = document.getElementById('mediaLightbox');
    const img = document.getElementById('lightboxImg');
    if (modal) modal.classList.remove('open');
    if (img) {
        img.classList.remove('zoomed');
        img.removeAttribute('src');
    }
}

if (typeof document !== 'undefined' && document.addEventListener) {
    document.addEventListener('keydown', (e) => {
        if (!lightboxState) return;
        if (e.key === 'Escape') closeLightbox();
        else if (e.key === 'ArrowLeft') stepLightbox(-1);
        else if (e.key === 'ArrowRight') stepLightbox(1);
    });
}

function pauseOtherVideos(activeVid) {
    if (typeof document.querySelectorAll !== 'function') return;
    document.querySelectorAll('video.tweet-video').forEach((v) => {
        if (v !== activeVid) {
            try { v.pause(); } catch (_) {}
        }
    });
}

function fallbackVideoSource(vid) {
    const fallbackSrc = vid?.dataset?.fallbackSrc;
    if (!fallbackSrc || vid.dataset.fallbackApplied === '1') return;
    vid.dataset.fallbackApplied = '1';
    const curTime = Number(vid.currentTime) || 0;
    const wasPlaying = !vid.paused;
    vid.src = fallbackSrc;
    if (curTime > 0 || wasPlaying) {
        vid.addEventListener?.('loadedmetadata', () => {
            try { if (curTime > 0) vid.currentTime = curTime; } catch (_) {}
            if (wasPlaying) { try { const p = vid.play(); if (p && p.catch) p.catch(() => {}); } catch (_) {} }
        }, { once: true });
    }
}

/** Toggles mute state for an inline tweet video and starts playback if unmuting a paused clip. */
function toggleVideoMute(btn, videoId, event) {
    if (event && event.stopPropagation) event.stopPropagation();
    const vid = document.getElementById(videoId);
    if (!vid) return;
    vid.muted = !vid.muted;
    if (!vid.muted) {
        pauseOtherVideos(vid);
        if (vid.paused) {
            try { const p = vid.play(); if (p && p.catch) p.catch(() => {}); } catch (_) {}
        }
    }
    if (btn) {
        btn.dataset.muted = vid.muted ? '1' : '0';
        btn.setAttribute('aria-pressed', String(!vid.muted));
        btn.setAttribute('aria-label', vid.muted ? 'Unmute video' : 'Mute video');
        btn.innerHTML = uiSvg(vid.muted ? 'volumeOff' : 'volumeOn');
    }
}

function renderMediaHtml(tw) {
    if (!tw.media || tw.media.length === 0) return '';
    let out = '<div style="margin-top:8px;" onclick="event.stopPropagation()">';
    if (appConfig.image_mode === 'auto') {
        const photos = [];
        const videos = [];
        tw.media.forEach(m => {
            if (m && (m.type === 'video' || m.type === 'animated_gif')) videos.push(m);
            else if (m && m.url) photos.push(m);
        });
        if (photos.length > 0) {
            const imgMode = supportsRichModeNative() ? 'rich' : 'hd';
            const gridCount = Math.min(4, photos.length);
            out += `<div class="media-grid media-grid-${gridCount}">`;
            photos.slice(0, 4).forEach((m, idx) => {
                const imgId = 'img_' + Math.random().toString(36).substr(2, 9);
                const previewUrl = mediaPreviewUrl(m.url, false);
                out += `
                <div class="media-cell-${idx}">
                    <img id="${imgId}" src="${localImageUrl(previewUrl, imgMode)}" class="tweet-img" loading="lazy" decoding="async" data-preview-url="${escapeHtml(previewUrl)}" data-original-url="${escapeHtml(m.url)}" onclick="openLightbox('${escapeHtml(tw.id)}', ${idx}, event)" onerror="retryOriginalPreview(this)" />
                </div>`;
            });
            out += '</div>';
            const firstAlt = photos.find(p => p.alt_text)?.alt_text;
            if (firstAlt) out += `<div style="font-size:12px; color:var(--text-muted); margin-top:5px;">${escapeHtml(firstAlt)}</div>`;
        }
        videos.forEach(m => {
            const vidId = 'vid_' + Math.random().toString(36).substr(2, 9);
            const posterSrc = localImageUrl(mediaPosterUrl(m.url), supportsRichModeNative() ? 'rich' : 'hd');
            const isGif = m.type === 'animated_gif';
            const durText = !isGif && m.duration_ms ? Math.ceil(m.duration_ms / 1000) + 's' : '';
            if (m.video_url) {
                const hdAvailable = !isGif && m.hd_video_url && m.hd_video_url !== m.video_url;
                const initialSrc = hdAvailable ? m.hd_video_url : m.video_url;
                const fallbackAttr = hdAvailable ? ` data-fallback-src="${escapeHtml(m.video_url)}" onerror="fallbackVideoSource(this)"` : '';
                const autoplayEnabled = isGif || shouldAutoplayVideos();
                const videoAttrs = isGif
                    ? 'autoplay loop muted playsinline data-autoplay="1" data-is-gif="1" preload="metadata"'
                    : (autoplayEnabled
                        ? 'controls muted loop playsinline data-autoplay="1" preload="none" onplay="pauseOtherVideos(this)"'
                        : 'controls playsinline preload="none" onplay="pauseOtherVideos(this)"');
                const muteOverlay = (!isGif && autoplayEnabled)
                    ? `<button type="button" class="video-mute-btn" data-muted="1" aria-pressed="false" aria-label="Unmute video" onclick="toggleVideoMute(this, '${vidId}', event)">${uiSvg('volumeOff')}</button>`
                    : '';
                out += `
                <div class="video-wrap">
                    <video id="${vidId}" class="tweet-video" ${videoAttrs} poster="${posterSrc}" src="${escapeHtml(initialSrc)}"${fallbackAttr}></video>
                    ${isGif ? '<span class="gif-pill">GIF</span>' : muteOverlay}
                </div>`;
            } else {
                const imgId = 'img_' + Math.random().toString(36).substr(2, 9);
                const previewUrl = mediaPosterUrl(m.url);
                out += `
                <div>
                    <div style="font-size:12px; color:var(--text-muted); margin-top:6px;">${isGif ? 'GIF' : 'Video'}${durText ? ' · ' + durText : ''} · poster frame</div>
                    <img id="${imgId}" src="${posterSrc}" class="tweet-img" loading="lazy" data-preview-url="${escapeHtml(previewUrl)}" data-original-url="${escapeHtml(m.url)}" onerror="retryOriginalPreview(this)" />
                </div>`;
            }
            if (m.alt_text) out += `<div style="font-size:12px; color:var(--text-muted); margin-top:5px;">${escapeHtml(m.alt_text)}</div>`;
        });
        return out + '</div>';
    }

    tw.media.forEach(m => {
        const imgId = 'img_' + Math.random().toString(36).substr(2, 9);
        const isVideo = m.type === 'video' || m.type === 'animated_gif';
        const previewUrl = mediaPreviewUrl(m.url, isVideo);
        const mediaLabel = isVideo ? (m.type === 'animated_gif' ? 'GIF' : 'Video') + (m.duration_ms ? ' · ' + Math.ceil(m.duration_ms / 1000) + 's' : '') + ' · poster frame' : 'Photo';
        if (isVideo) out += `<div style="font-size:12px; color:var(--text-muted); margin-top:6px;">${mediaLabel}</div>`;
        if (appConfig.image_mode === 'off') {
            out += `<div style="font-size:13px; color:var(--text-muted); margin-top:4px;">[${mediaLabel}]</div>`;
        } else {
            out += `
            <div style="margin-top:6px;">
                <button type="button" class="btn btn-secondary btn-block" data-url="${escapeHtml(previewUrl)}" data-hd-url="${escapeHtml(m.url)}" onclick="loadThumbImg(this, this.dataset.url, '${imgId}', this.dataset.hdUrl)" style="font-size:13px; padding:8px 14px;">
                    ${isVideo ? 'Load poster frame' : 'Load small preview'}
                </button>
            </div>`;
        }
        if (m.alt_text) out += `<div style="font-size:13px; color:var(--text-muted); margin-top:6px;">${escapeHtml(m.alt_text)}</div>`;
    });
    return out + '</div>';
}

function renderCardHtml(card) {
    if (!card || (!card.title && !card.thumb_url)) return '';
    const imgHtml = (appConfig.image_mode === 'auto' && card.thumb_url)
        ? `<img class="link-card-img" src="${localImageUrl(card.thumb_url, supportsRichModeNative() ? 'rich' : 'hd')}" alt="" loading="lazy" onerror="this.remove()" />`
        : '';
    const inner = `
        ${imgHtml}
        <div class="link-card-body">
            ${card.domain ? `<div class="link-card-domain">${escapeHtml(card.domain)}</div>` : ''}
            ${card.title ? `<div class="link-card-title">${escapeHtml(card.title)}</div>` : ''}
            ${card.description ? `<div class="link-card-desc">${escapeHtml(card.description)}</div>` : ''}
        </div>`;
    if (card.url) {
        return `<a class="link-card" href="${escapeHtml(card.url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${inner}</a>`;
    }
    return `<div class="link-card" onclick="event.stopPropagation()">${inner}</div>`;
}

function renderPollHtml(poll) {
    if (!poll || !Array.isArray(poll.choices) || !poll.choices.length) return '';
    const total = Number(poll.total) || 0;
    const rows = poll.choices.map(ch => {
        const pct = total > 0 ? Math.round((ch.count / total) * 100) : 0;
        return `
        <div class="poll-row">
            <div class="poll-bar" style="width:${pct}%"></div>
            <span class="poll-label">${escapeHtml(ch.label)}</span>
            <span class="poll-pct">${total > 0 ? pct + '%' : ''}</span>
        </div>`;
    }).join('');
    const meta = formatCount(total) + (total === 1 ? ' vote' : ' votes') + (poll.final ? ' · Final results' : '');
    return `<div class="poll-box" onclick="event.stopPropagation()">${rows}<div class="poll-meta">${meta}</div></div>`;
}

/** Renders the SVG action row shared between timeline tweets and threaded comments. */
function renderTweetActionsHtml(tw, extraClass) {
    const id = escapeHtml(tw.id);
    const screen = escapeHtml(tw.user_screen_name || '');
    const bookmarked = isBookmarked(tw.id);
    const cls = 'tweet-actions' + (extraClass ? ' ' + extraClass : '');
    return `
        <div class="${cls}">
            <div class="tweet-actions-left">
                <span class="action-item" data-reply-id="${id}" onclick="commentTweet('${id}', event)">${renderActionInner('reply', formatCount(tw.replies || 0))}</span>
                <span class="action-item${tw.retweeted ? ' retweeted' : ''}" data-rt-id="${id}" onclick="toggleRetweet('${id}', event)">${renderActionInner('retweet', formatCount(tw.retweets || 0))}</span>
                <span class="action-item${tw.liked ? ' liked' : ''}" data-like-id="${id}" onclick="toggleLike('${id}', event)">${renderActionInner(tw.liked ? 'heartFilled' : 'heart', formatCount(tw.likes || 0))}</span>
            </div>
            <div class="tweet-actions-right">
                <span class="action-item" onclick="openQuoteComposer('${id}', event)" title="Quote">${uiSvg('quote')}</span>
                <span class="action-item${bookmarked ? ' saved' : ''}" data-bm-id="${id}" onclick="toggleBookmark('${id}', event)">${renderActionInner(bookmarked ? 'bookmarkFilled' : 'bookmark', bookmarked ? 'Saved' : 'Save')}</span>
                <span class="action-item" onclick="copyTweetLink('${screen}', '${id}', event)" title="Copy link">${uiSvg('link')}</span>
            </div>
        </div>`;
}

/** Renders an embedded quoted post card when a tweet quotes another post. */
function renderQuotedHtml(quotedTweet) {
    if (!quotedTweet) return '';
    const q = quotedTweet;
    const qBadge = verifiedBadgeHtml(q.user_verified);
    const qMedia = appConfig.image_mode === 'auto' ? renderMediaHtml(q) : '';
    const qPoll = appConfig.image_mode === 'auto' ? renderPollHtml(q.poll) : '';
    const qCard = appConfig.image_mode === 'auto' && !qMedia && !qPoll ? renderCardHtml(q.card_preview) : '';
    return `
        <div class="quoted-box" onclick="viewThread('${escapeHtml(q.id)}'); event.stopPropagation();">
            <div class="tweet-header" style="margin-bottom:4px;">
                ${renderAvatarHtml(q, 'mini')}
                <div class="tweet-meta">
                    <span class="tweet-name">${escapeHtml(q.user_name || q.user_screen_name || 'X User')}</span>${qBadge}
                    <span class="tweet-handle">${q.user_screen_name ? '@' + escapeHtml(q.user_screen_name) : ''}</span>
                </div>
            </div>
            <div class="tweet-body" style="font-size:14px; margin-top:2px;">${linkify(q.text)}</div>
            ${qMedia}
            ${qPoll}
            ${qCard}
        </div>`;
}

function renderTweetHtml(tw) {
    let rtHtml = tw.is_retweet
        ? `<div class="retweet-banner">${uiSvg('retweet')} Retweeted by ${escapeHtml(tw.retweeted_by || 'Someone')}</div>`
        : '';

    const mediaHtml = renderMediaHtml(tw);
    const pollHtml = renderPollHtml(tw.poll);
    const cardHtml = !mediaHtml && !pollHtml ? renderCardHtml(tw.card_preview) : '';
    const quotedHtml = renderQuotedHtml(tw.quoted);

    const verifiedHtml = verifiedBadgeHtml(tw.user_verified);
    let handleHtml = tw.user_screen_name ? `<span class="tweet-handle">@${escapeHtml(tw.user_screen_name)}</span>` : '';
    let timeHtml = tw.created_at ? `<span class="tweet-dot">&middot;</span><span class="tweet-time">${escapeHtml(tw.created_at)}</span>` : '';

    return `
    <div class="tweet" data-id="${escapeHtml(tw.id)}">
        ${rtHtml}
        <div class="tweet-header">
            ${renderAvatarHtml(tw)}
            <div class="tweet-meta">
                <span class="tweet-name" onclick="openProfile('${escapeHtml(tw.user_screen_name)}'); event.stopPropagation();">
                    ${escapeHtml(tw.user_name || tw.user_screen_name || 'X User')}
                </span>${verifiedHtml}
                ${handleHtml}
                ${timeHtml}
            </div>
            ${tw.is_ad ? '<span class="ad-badge">Ad</span>' : ''}
        </div>
        <div class="tweet-body" onclick="viewThread('${escapeHtml(tw.id)}')">${linkify(tw.text)}</div>
        ${mediaHtml}
        ${pollHtml}
        ${cardHtml}
        ${quotedHtml}
        ${renderTweetActionsHtml(tw)}
    </div>`;
}

function extractUser(tw) {
    let uRes = tw.core?.user_results?.result || tw.user_results?.result || tw.user;
    if (!uRes) return { id: '', name: '', screen_name: '', avatar: '', verified: false };

    if (uRes.__typename === 'UserWithVisibilityResults') {
        uRes = uRes.user || uRes;
    }

    let core = uRes.core || {};
    let legacy = uRes.legacy || {};

    let id = String(uRes.rest_id || legacy.id_str || uRes.id_str || '');
    let name = decodeHtmlEntities(core.name || legacy.name || uRes.name || '');
    let screen_name = core.screen_name || legacy.screen_name || uRes.screen_name || '';
    let avatar = uRes.avatar?.image_url || legacy.profile_image_url_https || uRes.profile_image_url_https || '';
    let verified = !!(uRes.is_blue_verified || legacy.verified || uRes.ext_is_blue_verified);

    return { id, name, screen_name, avatar, verified };
}

function findInstructions(obj) {
    if (!obj || typeof obj !== 'object') return null;
    if (Array.isArray(obj.instructions)) return obj.instructions;
    for (let k in obj) {
        if (obj[k] && typeof obj[k] === 'object') {
            let found = findInstructions(obj[k]);
            if (found) return found;
        }
    }
    return null;
}

function isPromotedItem(item, entryId, container, twRes) {
    const injectionType = String(
        container?.clientEventInfo?.details?.timelinesDetails?.injectionType ||
        item?.clientEventInfo?.details?.timelinesDetails?.injectionType ||
        ''
    );
    const component = String(
        container?.clientEventInfo?.component ||
        item?.clientEventInfo?.component ||
        ''
    );
    return !!(
        item?.promotedMetadata ||
        item?.promoted_metadata ||
        item?.adMetadataContainer ||
        container?.promotedMetadata ||
        container?.promoted_metadata ||
        container?.adMetadataContainer ||
        twRes?.promotedMetadata ||
        twRes?.adMetadataContainer ||
        item?.tweetDisplayType === 'Promoted' ||
        item?.socialContext?.contextType === 'Promoted' ||
        (entryId && /promoted/i.test(String(entryId))) ||
        /promoted/i.test(injectionType) ||
        /promoted/i.test(component)
    );
}

function collectTimelineTweet(tweets, item, res, entryId, container) {
    if (!res) return;
    let parsed = parseSingleTweet(res);
    if (!parsed) return;
    if (isPromotedItem(item, entryId, container, res)) {
        parsed.is_ad = true;
        if (shouldHideAds()) return;
    }
    allTweetsMap[parsed.id] = parsed;
    tweets.push(parsed);
}

function parseTwitterGraphql(jsonStr) {
    let data;
    try {
        data = JSON.parse(jsonStr);
    } catch(e) {
        return { tweets: [], error: 'JSON parse error' };
    }

    if (data.errors && data.errors.length > 0 && !data.data) {
        return { tweets: [], error: data.errors[0]?.message || 'GraphQL Error', status: data.status };
    }
    if (data.error && !data.statuses && !data.globalObjects) {
        return { tweets: [], error: data.message || 'Error from Twitter', status: data.status };
    }

    // Direct REST v1.1 search format: { statuses: [...] }
    if (Array.isArray(data.statuses)) {
        let tweets = [];
        data.statuses.forEach(st => {
            if (!st) return;
            const isAd = !!(st.promoted || st.promoted_content || st.metadata?.promoted);
            let p = parseSingleTweet(st);
            if (!p) return;
            if (isAd) {
                p.is_ad = true;
                if (shouldHideAds()) return;
            }
            tweets.push(p);
        });
        return { tweets, nextCursor: null };
    }

    // Direct Adaptive format: { globalObjects: { tweets: {...}, users: {...} } }
    if (data.globalObjects && data.globalObjects.tweets) {
        let tweets = [];
        let users = data.globalObjects.users || {};
        for (let tid in data.globalObjects.tweets) {
            let tw = data.globalObjects.tweets[tid];
            if (!tw) continue;
            const isAd = !!(tw.promoted || tw.promoted_content || tw.metadata?.promoted);
            let user = users[tw.user_id_str] || {};
            tw.user = user;
            let p = parseSingleTweet(tw);
            if (!p) continue;
            if (isAd) {
                p.is_ad = true;
                if (shouldHideAds()) continue;
            }
            tweets.push(p);
        }
        return { tweets, nextCursor: null };
    }

    let instructions = findInstructions(data) || [];

    let entries = [];
    instructions.forEach(ins => {
        if (ins.type === 'TimelineAddEntries') entries.push(...(ins.entries || []));
        if (ins.type === 'TimelineAddToModule') entries.push(...(ins.moduleItems || []));
    });

    let tweets = [];
    let nextCursor = null;

    entries.forEach(entry => {
        let content = entry.content || {};
        if (content.entryType === 'TimelineTimelineCursor' && content.cursorType === 'Bottom') {
            nextCursor = content.value;
        }

        let item = content.itemContent;
        if (item && item.itemType === 'TimelineTweet') {
            collectTimelineTweet(tweets, item, item.tweet_results?.result, entry.entryId, content);
        }

        // Conversation thread replies & modules
        let subItems = content.items || [];
        const isConvModule = typeof entry.entryId === 'string' && entry.entryId.startsWith('conversationthread-');
        let prevModuleTweet = null;
        subItems.forEach(sub => {
            let sItem = sub.item?.itemContent || sub.itemContent || sub.item?.content?.itemContent;
            if (sItem && sItem.itemType === 'TimelineTweet') {
                const prevLen = tweets.length;
                collectTimelineTweet(tweets, sItem, sItem.tweet_results?.result || sItem.result, sub.entryId || entry.entryId, sub.item || sItem);
                if (tweets.length > prevLen) {
                    const added = tweets[tweets.length - 1];
                    if (isConvModule && prevModuleTweet && !added.in_reply_to_id) {
                        added.in_reply_to_id = prevModuleTweet.id;
                        if (!added.in_reply_to_screen_name) added.in_reply_to_screen_name = prevModuleTweet.user_screen_name || '';
                    }
                    prevModuleTweet = added;
                }
            }
        });
    });

    return { tweets, nextCursor, error: tweets.length ? null : (data.errors?.[0]?.message || null), status: data.status };
}

function isQueryIdFailure(result) {
    return result.status === 404 || /GRAPHQL_VALIDATION_FAILED|unknown query|query.*not found/i.test(result.error || '');
}

function safeHttpsUrl(candidate, allowedHosts) {
    if (!candidate || typeof candidate !== 'string') return '';
    try {
        const parsed = new URL(candidate);
        if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') return '';
        if (allowedHosts && !allowedHosts.includes(parsed.hostname)) return '';
        if (allowedHosts && parsed.protocol !== 'https:') return '';
        return parsed.href;
    } catch (_) {
        return '';
    }
}

function selectMp4Variants(videoInfo) {
    const raw = videoInfo?.variants;
    if (!Array.isArray(raw)) return { videoUrl: '', hdVideoUrl: '' };
    const mp4s = raw
        .filter(v => v && v.content_type === 'video/mp4')
        .map(v => ({ url: safeHttpsUrl(v.url, ['video.twimg.com']), bitrate: Number(v.bitrate) || 0 }))
        .filter(v => !!v.url)
        .sort((a, b) => a.bitrate - b.bitrate);
    if (!mp4s.length) return { videoUrl: '', hdVideoUrl: '' };
    const standard = mp4s.filter(v => v.bitrate > 0 && v.bitrate <= 950000);
    const fast = standard.length ? standard[standard.length - 1] : mp4s[0];
    const best = mp4s[mp4s.length - 1];
    return {
        videoUrl: fast.url,
        hdVideoUrl: best.url !== fast.url ? best.url : ''
    };
}

function extractCard(tw) {
    const rawCard = tw?.card?.legacy || tw?.card;
    if (!rawCard || !rawCard.binding_values) return { poll: null, card_preview: null };
    const bv = {};
    if (Array.isArray(rawCard.binding_values)) {
        rawCard.binding_values.forEach(item => {
            if (item && item.key && item.value) bv[item.key] = item.value;
        });
    } else if (typeof rawCard.binding_values === 'object') {
        Object.assign(bv, rawCard.binding_values);
    }
    const strVal = (k) => decodeHtmlEntities(bv[k]?.string_value || '');
    const cardName = String(rawCard.name || '');

    if (/^poll\d+choice/i.test(cardName)) {
        const choices = [];
        let total = 0;
        for (let i = 1; i <= 4; i++) {
            const label = strVal('choice' + i + '_label');
            if (!label) continue;
            const count = Number(bv['choice' + i + '_count']?.string_value) || 0;
            choices.push({ label, count });
            total += count;
        }
        if (choices.length >= 2) {
            return {
                poll: {
                    choices,
                    total,
                    final: bv.counts_are_final?.boolean_value === true || strVal('counts_are_final') === 'true'
                },
                card_preview: null
            };
        }
    }

    const cardUrlRaw = strVal('card_url') || rawCard.url || '';
    let expandedUrl = safeHttpsUrl(cardUrlRaw);
    const urls = tw?.legacy?.entities?.urls || tw?.entities?.urls || [];
    for (const u of urls) {
        if (u && (u.url === cardUrlRaw || !expandedUrl) && u.expanded_url) {
            const safeExp = safeHttpsUrl(u.expanded_url);
            if (safeExp) { expandedUrl = safeExp; break; }
        }
    }
    let domain = strVal('domain');
    if (!domain && expandedUrl) {
        try { domain = new URL(expandedUrl).hostname.replace(/^www\./, ''); } catch (_) {}
    }
    const title = strVal('title');
    const description = strVal('description');
    const thumbRaw = bv.summary_photo_image_large?.image_value?.url
        || bv.photo_image_full_size?.image_value?.url
        || bv.thumbnail_image_large?.image_value?.url
        || bv.summary_photo_image?.image_value?.url
        || bv.thumbnail_image?.image_value?.url
        || '';
    const thumbUrl = safeHttpsUrl(thumbRaw, ['pbs.twimg.com']);
    if (!title && !thumbUrl) return { poll: null, card_preview: null };
    return {
        poll: null,
        card_preview: {
            url: expandedUrl,
            domain,
            title,
            description,
            thumb_url: thumbUrl
        }
    };
}

function parseSingleTweet(tw) {
    if (!tw) return null;
    if (tw.__typename === 'TweetWithVisibilityResults') tw = tw.tweet || tw;
    let legacy = tw.legacy || {};
    let id = legacy.id_str || tw.rest_id || tw.id_str || tw.id;
    if (!id) return null;
    id = String(id);

    let isRetweet = false;
    let retweetedBy = null;
    if (legacy.retweeted_status_result) {
        let orig = legacy.retweeted_status_result.result;
        if (orig) {
            let p = parseSingleTweet(orig);
            if (p) {
                p.is_retweet = true;
                let retweeter = extractUser(tw);
                p.retweeted_by = retweeter.name || retweeter.screen_name || 'Someone';
                allTweetsMap[p.id] = p;
                return p;
            }
        }
    }

    let text = decodeHtmlEntities(tw.note_tweet?.note_tweet_results?.result?.text || legacy.full_text || tw.full_text || tw.text || '');

    // Quoted tweet (parsed early so redundant quote permalinks can be stripped cleanly)
    let quoted = null;
    let qRes = tw.quoted_status_result?.result;
    if (qRes) {
        quoted = parseSingleTweet(qRes);
    }

    const entityUrls = tw.note_tweet?.note_tweet_results?.result?.entity_set?.urls
        || legacy.entities?.urls
        || tw.entities?.urls
        || [];
    if (Array.isArray(entityUrls)) {
        entityUrls.forEach(u => {
            if (!u || !u.url) return;
            const expanded = safeHttpsUrl(u.expanded_url);
            if (!expanded) return;
            if (quoted && (expanded.includes('/status/' + quoted.id))) {
                text = text.split(u.url).join('').trim();
            } else {
                text = text.split(u.url).join(expanded);
            }
        });
    }
    text = text.replace(/\s*https?:\/\/t\.co\/\S+$/, '').trim();

    let user = extractUser(tw);

    let media = [];
    let extMedia = legacy.extended_entities?.media || tw.extended_entities?.media || tw.entities?.media || [];
    extMedia.forEach(m => {
        let mUrl = m.media_url_https || m.media_url;
        if (mUrl) {
            const { videoUrl, hdVideoUrl } = selectMp4Variants(m.video_info);
            const entry = {
                url: mUrl,
                type: m.type,
                duration_ms: m.video_info?.duration_millis || 0,
                alt_text: decodeHtmlEntities(m.ext_alt_text || m.alt_text || '')
            };
            if (videoUrl) entry.video_url = videoUrl;
            if (hdVideoUrl) entry.hd_video_url = hdVideoUrl;
            media.push(entry);
        }
    });

    // Card & poll extraction; quoted tweet already parsed above
    const { poll, card_preview } = extractCard(tw);

    const rawDate = legacy.created_at || tw.created_at;
    const inReplyToId = legacy.in_reply_to_status_id_str || tw.in_reply_to_status_id_str || '';
    const inReplyToScreenName = legacy.in_reply_to_screen_name || tw.in_reply_to_screen_name || '';
    const conversationId = legacy.conversation_id_str || tw.conversation_id_str || '';
    let parsed = {
        id,
        text,
        user_id: user.id || '',
        user_name: user.name,
        user_screen_name: user.screen_name,
        user_avatar: user.avatar || '',
        user_verified: !!user.verified,
        created_at: rawDate ? formatRelativeTime(rawDate) : '',
        likes: legacy.favorite_count || tw.favorite_count || 0,
        retweets: legacy.retweet_count || tw.retweet_count || 0,
        replies: legacy.reply_count || tw.reply_count || 0,
        liked: !!(legacy.favorited || tw.favorited),
        retweeted: !!(legacy.retweeted || tw.retweeted),
        bookmarked: !!(legacy.bookmarked || tw.bookmarked),
        in_reply_to_id: inReplyToId ? String(inReplyToId) : '',
        in_reply_to_screen_name: inReplyToScreenName ? String(inReplyToScreenName) : '',
        conversation_id: conversationId ? String(conversationId) : '',
        media,
        poll,
        card_preview,
        quoted,
        is_retweet: isRetweet,
        retweeted_by: retweetedBy,
        is_ad: false
    };
    allTweetsMap[id] = parsed;
    return parsed;
}

function feedToolbar() {
    return '<div class="feed-toolbar"><span id="feedProgress" class="feed-progress" role="status" aria-live="polite"></span><button id="feedRefreshButton" type="button" class="btn btn-secondary" onclick="refreshFeed()">Refresh</button></div>';
}

function setFeedProgress(loading, message, error = false) {
    const button = document.getElementById('feedRefreshButton');
    const progress = document.getElementById('feedProgress');
    if (button) {
        button.disabled = loading;
        button.innerHTML = loading ? '<span class="inline-spinner">Refreshing</span>' : 'Refresh';
    }
    if (progress) {
        progress.textContent = message || '';
        progress.classList.toggle('error', error);
    }
}

function refreshFeed() {
    if (currentView !== 'feed' || currentTab === 'cache') return;
    if (isFetching && isFetching.startsWith(currentTab + ':' + viewGeneration + ':')) {
        if (isFetching.endsWith(':true')) setFeedProgress(false, 'Loading more posts. Refresh again shortly.');
        return;
    }
    if (document.getElementById('feedContainer')) {
        fetchFeedData(currentTab, false);
    } else {
        loadFeed(currentTab, true);
    }
}

function loadFeed(feedType, forceRefresh = false, preserveStatus = false) {
    const container = document.getElementById('mainContent');

    if (feedType === 'cache') {
        if (!preserveStatus) showStatus('Viewing offline tweets', false, 0);
        let bookmarks = getBookmarks();
        let cached = window.AndroidBridge ? AndroidBridge.getCache('feed_cache') : '';
        let cachedList = [];
        try {
            const parsed = cached ? JSON.parse(cached) : [];
            if (Array.isArray(parsed)) cachedList = parsed;
        } catch(e){}
        if (shouldHideAds()) cachedList = cachedList.filter(t => t && !t.is_ad);

        bookmarks.forEach(t => { if (t && t.id) allTweetsMap[t.id] = { ...(allTweetsMap[t.id] || {}), ...t }; });
        cachedList.forEach(t => { if (t && t.id && !allTweetsMap[t.id]) allTweetsMap[t.id] = t; });

        if (bookmarks.length === 0 && cachedList.length === 0) {
            container.innerHTML = '<div class="card"><div class="card-title">No Offline Tweets</div><p class="card-desc">Tap ' + uiSvg('bookmark') + ' Save on any tweet or browse feeds to save offline.</p></div>';
            return;
        }

        let out = '';
        if (bookmarks.length > 0) {
            out += '<div style="padding:12px 16px; font-weight:700; font-size:14px; border-bottom:1px solid var(--border);">Saved Tweets (' + bookmarks.length + ')</div>';
            out += bookmarks.map(t => renderTweetHtml(allTweetsMap[t.id] || t)).join('');
        }
        if (cachedList.length > 0) {
            out += '<div style="padding:12px 16px; font-weight:700; font-size:14px; color:var(--text-muted); border-bottom:1px solid var(--border);">Recent Cache</div>';
            out += cachedList.map(t => renderTweetHtml(allTweetsMap[t.id] || t)).join('');
        }
        container.innerHTML = '<div id="feedContainer">' + out + '</div>';
        initVideoAutoPauseObserver(container);
        return;
    }

    // Stale-While-Revalidate: Instant Load
    let cachedFeed = '';
    if (window.AndroidBridge) {
        cachedFeed = AndroidBridge.getCache('feed_' + feedType);
    }

    let hasCached = false;
    if (cachedFeed) {
        try {
            let list = JSON.parse(cachedFeed);
            if (Array.isArray(list) && shouldHideAds()) list = list.filter(t => t && !t.is_ad);
            if (list && list.length > 0) {
                currentTweetsList = list;
                cursors[feedType] = window.AndroidBridge ? AndroidBridge.getCache('feed_cursor_' + feedType) || null : null;
                usedFeedCursors[feedType].clear();
                list.forEach(t => { if (t && t.id) allTweetsMap[t.id] = t; });
                container.innerHTML = feedToolbar() + '<div id="feedContainer">' + list.map(renderTweetHtml).join('') + '</div>';
                hasCached = true;
                initSeenObserver(document.getElementById('feedContainer'));
                initVideoAutoPauseObserver(container);
                renderLoadMoreButton(feedType);
            }
        } catch (e) {}
    }

    if (!hasCached) {
        currentTweetsList = [];
        showStatus('', false);
        container.innerHTML = '<div class="spinner">Loading...</div>';
    } else if (!forceRefresh) {
        const lastUpdated = Number(window.AndroidBridge ? AndroidBridge.getCache('feed_updated_' + feedType) : localStorage.getItem('feed_updated_' + feedType));
        if (lastUpdated && Date.now() - lastUpdated < FEED_REFRESH_MS) {
            showStatus('Showing recent cached tweets', false, 2500);
            return;
        }
    }

    fetchFeedData(feedType, false);
}

function fetchFeedData(feedType, isPaging) {
    const generation = viewGeneration;
    const requestKey = feedType + ':' + generation + ':' + isPaging;
    if (isFetching && isFetching.startsWith(feedType + ':' + generation + ':')) return;
    isFetching = requestKey;
    if (!isPaging) setFeedProgress(true, 'Checking for new posts…');

    const cfg = TIMELINE_CONFIG[feedType];
    if (!cfg) {
        if (isFetching === requestKey) isFetching = false;
        return;
    }

    const pageSize = getFeedPageSize();
    const cursor = isPaging ? cursors[feedType] : null;
    const canPostTimeline = supportsSignedPostTimelines();
    const seenBatch = (canPostTimeline && shouldSyncSeen()) ? consumePendingSeenBatch(100) : [];
    const variables = cfg.buildVariables(pageSize, cursor, seenBatch);

    const dispatchFeedRequest = (queryId, onDone) => {
        const path = `/i/api/graphql/${queryId}/${cfg.op}`;
        if (canPostTimeline) {
            const payload = JSON.stringify({ variables, features: GRAPHQL_FEATURES, queryId });
            performSignedPost(path, payload, onDone);
        } else {
            const url = `https://x.com${path}?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;
            performAsyncGet(url, onDone);
        }
    };

    dispatchFeedRequest(cfg.queryId, (resStr) => {
        if (generation !== viewGeneration || currentView !== 'feed' || currentTab !== feedType) {
            try {
                const check = parseTwitterGraphql(resStr);
                if (check.error) requeueSeenBatch(seenBatch);
            } catch (_) { requeueSeenBatch(seenBatch); }
            return;
        }
        let fallbackPending = false;
        try {
            let parsed = parseTwitterGraphql(resStr);

            if (parsed.error) {
                if (cfg.fallbackQueryId && isQueryIdFailure(parsed)) {
                    fallbackPending = true;
                    dispatchFeedRequest(cfg.fallbackQueryId, (fbStr) => {
                        if (isFetching === requestKey) isFetching = false;
                        if (generation !== viewGeneration || currentView !== 'feed' || currentTab !== feedType) return;
                        try {
                            let fbParsed = parseTwitterGraphql(fbStr);
                            if (fbParsed.tweets && fbParsed.tweets.length > 0) {
                                applyFeedTweets(feedType, fbParsed, isPaging);
                            } else {
                                requeueSeenBatch(seenBatch);
                                displayFeedError(feedType, fbParsed.error ? fbParsed : parsed, isPaging);
                            }
                        } catch (error) {
                            requeueSeenBatch(seenBatch);
                            displayFeedError(feedType, { error: error.message || 'Could not read feed response' }, isPaging);
                        }
                    });
                    return;
                }
                requeueSeenBatch(seenBatch);
                displayFeedError(feedType, parsed, isPaging);
                return;
            }

            applyFeedTweets(feedType, parsed, isPaging);
        } catch(err) {
            console.error("fetchFeedData error:", err);
            requeueSeenBatch(seenBatch);
            displayFeedError(feedType, { error: err.message || 'Could not read feed response' }, isPaging);
        } finally {
            if (isFetching === requestKey && !fallbackPending) isFetching = false;
        }
    });
}

function applyFeedTweets(feedType, parsed, isPaging) {
    const container = document.getElementById('mainContent');
    if (parsed.tweets.length === 0 && !isPaging) {
        if (currentTweetsList.length) {
            setFeedProgress(false, 'No new posts returned. Tap Refresh to retry.', true);
        } else {
            container.innerHTML = feedToolbar() + '<div class="card"><p class="card-desc">No posts found. Tap Refresh to retry.</p></div>';
        }
        return;
    }

    const usedCursors = usedFeedCursors[feedType];
    if (isPaging && cursors[feedType]) usedCursors.add(cursors[feedType]);
    if (!isPaging) usedCursors.clear();
    const nextCursor = parsed.nextCursor;
    cursors[feedType] = nextCursor && !usedCursors.has(nextCursor) ? nextCursor : null;

    if (isPaging) {
        const existingIds = new Set(currentTweetsList.map(t => t.id));
        const freshTweets = parsed.tweets.filter(t => {
            if (existingIds.has(t.id)) return false;
            existingIds.add(t.id);
            return true;
        });
        currentTweetsList.push(...freshTweets);
        parsed.tweets.forEach(t => { if (t && t.id) allTweetsMap[t.id] = t; });
        let feedDiv = document.getElementById('feedContainer');
        if (feedDiv) {
            feedDiv.insertAdjacentHTML('beforeend', freshTweets.map(renderTweetHtml).join(''));
        }
        setFeedProgress(false, freshTweets.length ? '' : cursors[feedType] ? 'No new posts on this page. Load more to continue.' : 'No more posts.');
        showStatus('', false);
    } else {
        let sourceTweets = parsed.tweets;
        if (feedType === 'foryou' && shouldSyncSeen() && seenForYouIds.size > 0) {
            const unseen = sourceTweets.filter(t => t && !seenForYouIds.has(String(t.id)));
            if (unseen.length > 0) sourceTweets = unseen;
        }
        const seenIds = new Set();
        currentTweetsList = sourceTweets.filter(t => {
            if (seenIds.has(t.id)) return false;
            seenIds.add(t.id);
            return true;
        });
        sourceTweets.forEach(t => { if (t && t.id) allTweetsMap[t.id] = t; });
        if (window.AndroidBridge) {
            AndroidBridge.saveCache('feed_' + feedType, JSON.stringify(currentTweetsList));
            AndroidBridge.saveCache('feed_cache', JSON.stringify(currentTweetsList));
            AndroidBridge.saveCache('feed_cursor_' + feedType, cursors[feedType] || '');
            AndroidBridge.saveCache('feed_updated_' + feedType, String(Date.now()));

/** Returns true when linking childId under parentId would introduce a cycle. */
function threadHasCycle(nodeMap, parentId, childId) {
    let cursorId = parentId;
    const seen = new Set();
    while (cursorId && !seen.has(cursorId)) {
        if (cursorId === childId) return true;
        seen.add(cursorId);
        const parentNode = nodeMap.get(cursorId);
        cursorId = parentNode && parentNode.tweet.in_reply_to_id ? String(parentNode.tweet.in_reply_to_id) : '';
    }
    return false;
}

/** Counts all descendant replies beneath a thread tree node. */
function countThreadDescendants(node) {
    if (!node || !Array.isArray(node.children) || node.children.length === 0) return 0;
    let total = 0;
    node.children.forEach(child => {
        total += 1 + countThreadDescendants(child);
    });
    return total;
}

/** Organizes TweetDetail tweets into ancestor spine, focal tweet, and nested parent-child reply trees. */
function buildThreadHierarchy(tweetId, focal, rawTweets) {
    const focalId = String(tweetId || '');
    const byId = new Map();
    if (Array.isArray(rawTweets)) {
        rawTweets.forEach(t => {
            if (t && t.id) byId.set(String(t.id), t);
        });
    }
    let resolvedFocal = byId.get(focalId) || focal || null;
    if (resolvedFocal && !byId.has(focalId)) {
        byId.set(focalId, resolvedFocal);
    }

    const ancestors = [];
    const excludedIds = new Set([focalId]);
    let cursor = resolvedFocal;
    for (let hop = 0; hop < 15 && cursor && cursor.in_reply_to_id; hop++) {
        const pid = String(cursor.in_reply_to_id);
        if (excludedIds.has(pid) || !byId.has(pid)) break;
        const parentTweet = byId.get(pid);
        ancestors.unshift(parentTweet);
        excludedIds.add(pid);
        cursor = parentTweet;
    }

    const nodeMap = new Map();
    const orderedNodes = [];
    byId.forEach((tw, id) => {
        if (excludedIds.has(id)) return;
        const node = { tweet: tw, children: [] };
        nodeMap.set(id, node);
        orderedNodes.push(node);
    });

    const roots = [];
    orderedNodes.forEach(node => {
        const pid = node.tweet.in_reply_to_id ? String(node.tweet.in_reply_to_id) : '';
        if (pid && pid !== node.tweet.id && nodeMap.has(pid) && !threadHasCycle(nodeMap, pid, node.tweet.id)) {
            nodeMap.get(pid).children.push(node);
        } else {
            roots.push(node);
        }
    });

    return {
        ancestors,
        focal: resolvedFocal,
        roots,
        totalReplies: orderedNodes.length,
        byId
    };
}

/** Toggles collapse state for a Reddit-style nested reply branch. */
function toggleReplyBranch(tweetId, event) {
    if (event && event.stopPropagation) event.stopPropagation();
    const node = typeof document !== 'undefined'
        ? document.querySelector(`.reddit-node[data-tweet-id="${String(tweetId || '').replace(/"/g, '')}"]`)
        : null;
    if (!node) return;
    const collapsed = node.classList.toggle('collapsed');
    const btn = node.querySelector('.reddit-collapse-btn');
    if (btn) {
        const descCount = Number(btn.dataset.descCount || 0);
        btn.setAttribute('aria-expanded', String(!collapsed));
        btn.textContent = collapsed
            ? '+' + (descCount > 0 ? ' ' + (descCount + 1) : '')
            : (descCount > 0 ? '- ' + descCount : '-');
    }
}

/** Renders a collapsible Reddit-style comment node and its nested child replies. */
function renderRedditReplyNode(node, depth, focalTweet, byId) {
    const tw = node.tweet;
    const id = escapeHtml(tw.id);
    const visualDepth = Math.min(5, Math.max(0, depth));
    const descCount = countThreadDescendants(node);
    const badge = verifiedBadgeHtml(tw.user_verified);
    const handleHtml = tw.user_screen_name ? `<span class="tweet-handle" style="font-size:13px;">@${escapeHtml(tw.user_screen_name)}</span>` : '';
    const timeHtml = tw.created_at ? `<span class="tweet-dot">&middot;</span><span class="tweet-time" style="font-size:13px;">${escapeHtml(tw.created_at)}</span>` : '';

    const parentId = tw.in_reply_to_id ? String(tw.in_reply_to_id) : '';
    const parentTweet = parentId ? byId.get(parentId) : null;
    const targetScreen = tw.in_reply_to_screen_name || parentTweet?.user_screen_name || '';
    const replyTargetHtml = targetScreen
        ? `<div class="reddit-reply-to">Replying to <span class="mention" onclick="openProfile('${escapeHtml(targetScreen)}'); event.stopPropagation();">@${escapeHtml(targetScreen)}</span></div>`
        : '';

    const mediaHtml = renderMediaHtml(tw);
    const pollHtml = renderPollHtml(tw.poll);
    const cardHtml = !mediaHtml && !pollHtml ? renderCardHtml(tw.card_preview) : '';
    const quotedHtml = renderQuotedHtml(tw.quoted);
    const childrenHtml = node.children.length > 0
        ? `<div class="reddit-children" data-parent-depth="${visualDepth}">${node.children.map(ch => renderRedditReplyNode(ch, depth + 1, focalTweet, byId)).join('')}</div>`
        : '';

    const collapseLabel = descCount > 0 ? '- ' + descCount : '-';
    const hiddenCount = descCount + 1;

    return `
    <div class="reddit-node" data-id="${id}" data-tweet-id="${id}" data-depth="${depth}">
        <div class="reddit-comment">
            <div class="reddit-meta-row" onclick="toggleReplyBranch('${id}', event)">
                ${renderAvatarHtml(tw, 'mini')}
                <span class="tweet-name" style="font-size:14px;" onclick="openProfile('${escapeHtml(tw.user_screen_name)}'); event.stopPropagation();">${escapeHtml(tw.user_name || tw.user_screen_name || 'X User')}</span>${badge}
                ${handleHtml}
                ${timeHtml}
                <button type="button" class="reddit-collapse-btn" data-desc-count="${descCount}" aria-expanded="true" aria-label="Toggle thread" onclick="toggleReplyBranch('${id}', event)">${collapseLabel}</button>
            </div>
            <div class="reddit-collapsed-hint" onclick="toggleReplyBranch('${id}', event)">Comment collapsed · tap to expand (${hiddenCount} ${hiddenCount === 1 ? 'item' : 'items'})</div>
            <div class="reddit-body-wrap">
                ${replyTargetHtml}
                <div class="reddit-body" onclick="viewThread('${id}')">${linkify(tw.text)}</div>
                ${mediaHtml}
                ${pollHtml}
                ${cardHtml}
                ${quotedHtml}
                ${renderTweetActionsHtml(tw, 'reddit-actions')}
            </div>
        </div>
        ${childrenHtml}
    </div>`;
}

    if (focusReply) {

            const input = document.getElementById('replyText');
            if (input) {
                if (typeof input.scrollIntoView === 'function') input.scrollIntoView({ block: 'center' });
                if (typeof input.focus === 'function') input.focus();
            }
        }, 50);
    }

    let variables = {
        focalTweetId: tweetId,
        referrer: "tweet",
        with_rux_injections: false,
        rankingMode: "Relevance",
        includePromotedContent: false,
        withCommunity: true,
        withQuickPromoteEligibilityTweetFields: false,
        withBirdwatchNotes: true,
        withVoice: true
    };

    const primaryQid = workingTweetDetailQueryId || 'dQDdKtt882nl-Km98FJGSQ';
    const fallbackQid = primaryQid === 'dQDdKtt882nl-Km98FJGSQ' ? 'qpemjmVMoTWDvcRT43JIVQ' : 'dQDdKtt882nl-Km98FJGSQ';
    const buildDetailUrl = (qid) => `https://x.com/i/api/graphql/${qid}/TweetDetail?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;

    performAsyncGet(buildDetailUrl(primaryQid), (resStr) => {
        if (generation !== viewGeneration || currentView !== 'thread') return;
        let parsed = parseTwitterGraphql(resStr);
        if (parsed.error && (!parsed.tweets || !parsed.tweets.length)) {
            performAsyncGet(buildDetailUrl(fallbackQid), (fbStr) => {
                if (generation !== viewGeneration || currentView !== 'thread') return;
                let fbParsed = parseTwitterGraphql(fbStr);
                if (fbParsed.tweets && fbParsed.tweets.length) workingTweetDetailQueryId = fallbackQid;
                renderThreadData(tweetId, focal, fbParsed);
            });
            return;
        }
        renderThreadData(tweetId, focal, parsed);
    });
}

function renderThreadData(tweetId, focal, parsed) {
    const repContainer = document.getElementById('repliesContainer');
    if (!repContainer) return;

    const hierarchy = buildThreadHierarchy(tweetId, focal, parsed?.tweets || []);
    const resolvedFocal = hierarchy.focal;
    if (resolvedFocal) {
        allTweetsMap[tweetId] = resolvedFocal;
        const focalBox = document.getElementById('threadFocal');
        if (focalBox && !focal) {
            const cue = (!hierarchy.ancestors.length && resolvedFocal.in_reply_to_screen_name)
                ? `<div class="thread-replying-banner">Replying to <span class="mention" onclick="openProfile('${escapeHtml(resolvedFocal.in_reply_to_screen_name)}'); event.stopPropagation();">@${escapeHtml(resolvedFocal.in_reply_to_screen_name)}</span></div>`
                : '';
            focalBox.innerHTML = cue + renderTweetHtml(resolvedFocal);
        }
    }

    const ancBox = document.getElementById('threadAncestors');
    if (ancBox && hierarchy.ancestors.length > 0) {
        ancBox.innerHTML = hierarchy.ancestors
            .map(a => `<div class="thread-ancestor">${renderTweetHtml(a)}</div>`)
            .join('');
    }

    if (hierarchy.roots.length > 0) {
        repContainer.innerHTML = '<div class="reddit-thread-header">Replies (' + hierarchy.totalReplies + ')</div>' +
            hierarchy.roots.map(root => renderRedditReplyNode(root, 0, resolvedFocal, hierarchy.byId)).join('');
        initVideoAutoPauseObserver(document.getElementById('threadContainer'));
    } else if (parsed.error) {
        repContainer.innerHTML = `<div class="card"><div class="card-title" style="color:var(--red);">Error</div><p class="card-desc">${escapeHtml(parsed.error)}</p></div>`;
    } else {
        repContainer.innerHTML = '<div style="padding:28px 16px; text-align:center; color:var(--text-muted); font-size:14px;">No replies yet</div>';
    }
}

function restoreNonFeedOrigin() {
    if (threadOriginView === 'search' && savedSearchMarkup) {
        activeThreadTweetId = null;
        currentView = 'search';
        viewGeneration++;
        document.getElementById('mainContent').innerHTML = savedSearchMarkup;
        syncVisibleTweetActions();
        initVideoAutoPauseObserver(document.getElementById('mainContent'));
        document.getElementById('tabNav').style.display = 'none';
        document.querySelectorAll('.bottom-item').forEach((el, idx) => el.classList.toggle('active', idx === 1));
        updateHeaderActions();
        restoreScrollPosition(savedSearchScrollY);
        savedSearchMarkup = '';
        return true;
    }
    if (threadOriginView === 'profile' && savedProfileMarkup) {
        activeThreadTweetId = null;
        currentView = 'profile';
        viewGeneration++;
        document.getElementById('mainContent').innerHTML = savedProfileMarkup;
        syncVisibleTweetActions();
        initVideoAutoPauseObserver(document.getElementById('mainContent'));
        document.getElementById('tabNav').style.display = 'none';
        document.querySelectorAll('.bottom-item').forEach(el => el.classList.remove('active'));
        updateHeaderActions();
        restoreScrollPosition(savedProfileScrollY);
        savedProfileMarkup = '';
        return true;
    }
    if (threadOriginView === 'notifications' && savedNotifMarkup) {
        activeThreadTweetId = null;

        document.getElementById('tabNav').style.display = 'none';
        document.querySelectorAll('.bottom-item').forEach(el => el.classList.remove('active'));
        updateHeaderActions();
        restoreScrollPosition(savedNotifScrollY);
        savedNotifMarkup = '';

    }
    return false;
}

function goBackToFeed() {
    if (window.history.state && window.history.state.view === 'thread') {
        window.history.back();
    } else if (!restoreNonFeedOrigin()) {
        restoreFeedView(currentFeedOrigin, threadOriginView === 'feed');
    }
}

function restoreFeedView(targetTab, fromThread = false) {
    activeThreadTweetId = null;
    currentView = 'feed';
    viewGeneration++;
    currentTab = targetTab || currentTab || 'following';
    const tabNav = document.getElementById('tabNav');
    if (tabNav) tabNav.style.display = 'flex';
    document.querySelectorAll('.nav-tab').forEach((el, idx) => {
        el.classList.toggle('active', ['following', 'foryou', 'cache'][idx] === currentTab);
    });
    document.querySelectorAll('.bottom-item').forEach((el, idx) => {
        el.classList.toggle('active', idx === 0);
    });
    updateHeaderActions();
    if (window.location.hash.startsWith('#thread-')) {
        try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch(e){}
    }
    if (fromThread && savedFeedMarkup && savedFeedTab === currentTab && savedFeedMarkup.includes('id="feedContainer"') && currentTab !== 'cache') {
        const scrollY = savedFeedScrollY;
        const container = document.getElementById('mainContent');
        if (savedFeedNodes && savedFeedNodes.firstChild) {
            container.innerHTML = '';
            container.appendChild(savedFeedNodes);
        } else {
            container.innerHTML = savedFeedMarkup;
        }
        syncVisibleTweetActions();
        initSeenObserver(document.getElementById('feedContainer'));
        initVideoAutoPauseObserver(container);
        attachFeedInfiniteScroll(currentTab);
        if (savedFeedRequestInterrupted) {
            setFeedProgress(false, 'Loading interrupted. Tap Refresh to retry.');
            const loadMoreButton = document.querySelector('#loadMoreBox button');
            if (loadMoreButton) {
                loadMoreButton.disabled = false;
                loadMoreButton.textContent = 'Load More';
            }
        }
        savedFeedMarkup = '';
        savedFeedNodes = null;
        savedFeedRequestInterrupted = false;
        restoreScrollPosition(scrollY);
        return;
    }
    const cacheScrollY = fromThread && currentTab === 'cache' ? savedFeedScrollY : null;
    savedFeedMarkup = '';
    savedFeedNodes = null;
    loadFeed(currentTab);
    if (cacheScrollY !== null) restoreScrollPosition(cacheScrollY);
}

// History stack back navigation
window.onpopstate = function(e) {
    if (lightboxState) closeLightbox();
    if (e.state && e.state.view === 'thread') {
        currentView = 'thread';
        viewGeneration++;
        updateHeaderActions();
        renderThreadView(e.state.id);
    } else if (currentView === 'thread' && restoreNonFeedOrigin()) {

    } else {
        let origin = (e.state && e.state.originTab) ? e.state.originTab : currentFeedOrigin || currentTab;
        restoreFeedView(origin, currentView === 'thread' && threadOriginView === 'feed');
    }
};

/** Extracts only verification meta and loading animation SVGs needed by ClientTransaction. */
function buildCompactHomeSnippet(html) {
    if (typeof html !== 'string') return '';
    const meta = html.match(/<meta[^>]*name=['"]twitter-site-verification['"][^>]*content=['"][^'"]+['"][^>]*>/i);
    const svgs = [...html.matchAll(/<svg[^>]*id="loading-x-anim-\d+"[^>]*>.*?<\/svg>/gs)].map(m => m[0]);
    if (!meta || svgs.length === 0) return '';
    return meta[0] + svgs.join('');
}

/** Extracts only the key-byte index tokens needed from ondemand.s.<hash>a.js. */
function buildCompactOndemandSnippet(script) {
    if (typeof script !== 'string') return '';
    const tokens = [...script.matchAll(/(\(\w\[(\d{1,2})\],\s*16\))/g)].map(m => m[1]);
    return tokens.length ? tokens.join(' ') : '';
}

/** Hydrates ClientTransaction from persisted compact snippets for zero-wait cold requests. */
function hydrateCachedXTransaction() {
    try {
        const raw = readCachePref(TX_CACHE_KEY, TX_STORAGE_KEY);
        if (!raw) return false;
        const data = JSON.parse(raw);
        if (!data || !data.homeSnippet || !data.ondemandSnippet || !data.fetchedAt) return false;
        if (Date.now() - Number(data.fetchedAt) >= TX_WARM_MAX_AGE_MS) return false;
        const client = new XClientTransaction.ClientTransaction(data.homeSnippet, data.ondemandSnippet);
        client.homePageResponse = '';
        client.ondemandFileResponse = '';
        searchTransactionClient = client;
        searchTransactionFetchedAt = Number(data.fetchedAt);
        searchTransactionFromCache = true;
        return true;
    } catch (_) {
        return false;
    }
}

/** Persists compact transaction setup data and content-addressed ondemand indices. */
function persistXTransactionCache(ondemandHash, homeSnippet, ondemandSnippet, fetchedAt) {
    if (!homeSnippet || !ondemandSnippet) return;
    try {
        if (ondemandHash) writeCachePref(TX_ONDEMAND_PREFIX + ondemandHash, TX_ONDEMAND_PREFIX + ondemandHash, ondemandSnippet);
        writeCachePref(TX_CACHE_KEY, TX_STORAGE_KEY, JSON.stringify({
            ondemandHash: ondemandHash || '',
            homeSnippet,
            ondemandSnippet,
            fetchedAt
        }));
    } catch (_) {}
}

/** Clears the active ClientTransaction client and optionally purges stored warmup state. */
function invalidateXTransaction(clearStorage = true) {
    searchTransactionClient = null;
    searchTransactionFetchedAt = 0;
    searchTransactionFromCache = false;
    if (clearStorage) {
        writeCachePref(TX_CACHE_KEY, TX_STORAGE_KEY, '');
    }
}

/** Fetches fresh X session verification metadata, reusing cached ondemand indices by hash. */
function fetchFreshXTransaction(done) {
    performAsyncGet('https://x.com/home', (html) => {
        if (!html || !html.includes('twitter-site-verification')) {
            done('Could not prepare X session. Check your connection and account cookies.');
            return;
        }
        try { extractViewerFromHomeHtml(html); } catch (_) {}
        const chunk = html.match(/,(\d+):"ondemand\.s"/);
        const hashMatch = chunk && html.match(new RegExp(',' + chunk[1] + ':"([0-9a-f]+)"'));
        if (!hashMatch) {
            done('X changed its session setup. Please check for an app update.');
            return;
        }
        const hash = hashMatch[1];
        const homeSnippet = buildCompactHomeSnippet(html);

        const applyOndemand = (ondemandSource, ondemandSnippet) => {
            try {
                const client = new XClientTransaction.ClientTransaction(homeSnippet || html, ondemandSnippet || ondemandSource);
                client.homePageResponse = '';
                client.ondemandFileResponse = '';
                const now = Date.now();
                searchTransactionClient = client;
                searchTransactionFetchedAt = now;
                searchTransactionFromCache = false;
                persistXTransactionCache(hash, homeSnippet, ondemandSnippet || buildCompactOndemandSnippet(ondemandSource), now);
                done(null);
            } catch (e) {
                done('X changed its session setup. Please check for an app update.');
            }
        };

        const cachedOndemand = readCachePref(TX_ONDEMAND_PREFIX + hash, TX_ONDEMAND_PREFIX + hash);
        if (cachedOndemand) {
            applyOndemand(cachedOndemand, cachedOndemand);
            return;
        }
        const scriptUrl = 'https://abs.twimg.com/responsive-web/client-web/ondemand.s.' + hash + 'a.js';
        performAsyncGet(scriptUrl, (script) => {
            applyOndemand(script, buildCompactOndemandSnippet(script));
        });
    });
}

/** Silently refreshes stale warm transaction state without blocking active requests. */
function refreshXTransactionBackground() {
    if (searchTransactionLoading || searchTransactionBackgroundLoading) return;
    searchTransactionBackgroundLoading = true;
    fetchFreshXTransaction(() => {
        searchTransactionBackgroundLoading = false;
    });
}

function prepareXTransaction(done, forceRefresh = false) {
    if (!window.AndroidBridge) {
        done('Native bridge unavailable');
        return;
    }
    if (!forceRefresh && !searchTransactionClient) {
        hydrateCachedXTransaction();
    }
    const age = searchTransactionClient ? Date.now() - searchTransactionFetchedAt : Infinity;
    if (!forceRefresh && searchTransactionClient && age < TX_WARM_MAX_AGE_MS) {
        done(null);
        if (age >= TX_REFRESH_MS) refreshXTransactionBackground();
        return;
    }
    searchTransactionWaiters.push(done);
    if (searchTransactionLoading) return;
    searchTransactionLoading = true;

    fetchFreshXTransaction((error) => {
        searchTransactionLoading = false;
        const waiters = searchTransactionWaiters.splice(0);
        waiters.forEach(waiter => waiter(error));
    });
}

function prepareSearchTransaction(done) {
    if (!window.AndroidBridge || typeof AndroidBridge.executeSearchGetAsync !== 'function') {
        done('Install the v1.0.6 APK to enable search.');
        return;
    }
    prepareXTransaction((error) => {
        if (error && error.includes('X session')) done('Could not prepare X search. Check your connection and account cookies.');
        else if (error && error.includes('session setup')) done('X changed its search setup. Please check for an app update.');
        else done(error);
    });
}

function executeSearch(e) {

    lastSearchQuery = q;
    const generation = ++viewGeneration;

    const moreBox = document.getElementById('searchLoadMoreBox');
    if (moreBox) moreBox.innerHTML = '';
