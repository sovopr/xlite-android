<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>𝕏 Lite</title>
<style>
:root {
  --bg: #000000;
  --surface: #000000;
  --card: #16181c;
  --border: #2f3336;
  --text: #e7e9ea;
  --text-muted: #71767b;
  --accent: #1d9bf0;
  --accent-hover: #1a8cd8;
  --red: #f4212e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.4;
  padding-bottom: 65px;
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--accent); text-decoration: none; }

/* Clean official header */
.header {
  position: sticky;
  top: 0;
  background: rgba(0, 0, 0, 0.95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  height: 52px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 100;
}
.header-logo {
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 9px;
}
.header-logo svg {
  width: 30px;
  height: 30px;
  flex: none;
  display: block;
}
.header-sub {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 600;
  letter-spacing: .02em;
}

/* Tabs */
.nav-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.nav-tab {
  flex: 1;
  text-align: center;
  padding: 14px 6px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 3px solid transparent;
}
.nav-tab.active {
  color: var(--text);
  border-bottom: 3px solid var(--accent);
}

/* Subtle status bar */
.status-bar {
  position: sticky;
  top: 52px;
  z-index: 95;
  padding: 6px 14px;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--border);
  background: #080808;
  color: var(--text-muted);
}
.status-bar.error {
  color: #fca5a5;
  background: rgba(244, 33, 46, 0.1);
}

/* Tweets */
.tweet {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.tweet:active {
  background: rgba(255, 255, 255, 0.02);
}
.tweet-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.tweet-meta {
  display: flex;
  align-items: baseline;
  gap: 0 6px;
  flex-wrap: wrap;
  min-width: 0;
}
.tweet-avatar {
  position: relative;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #1d2228;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
  cursor: pointer;
}
.tweet-avatar.mini {
  width: 18px;
  height: 18px;
  font-size: 10px;
}
.tweet-avatar-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.12s ease;
}
.ad-badge {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  line-height: 1.3;
  flex-shrink: 0;
}
.tweet-name {
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
}
.tweet-handle {
  color: var(--text-muted);
  font-size: 14px;
}
.tweet-dot {
  color: var(--text-muted);
  font-size: 12px;
}
.tweet-time {
  color: var(--text-muted);
  font-size: 14px;
}
.tweet-body {
  font-size: 15px;
  word-break: break-word;
  white-space: pre-wrap;
  line-height: 1.45;
  cursor: pointer;
}
.tweet-img {
  max-width: 100%;
  border-radius: 12px;
  margin-top: 8px;
  display: block;
  background: #16181c;
  border: 1px solid var(--border);
}
.tweet-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 420px;
  margin-top: 10px;
  font-size: 13px;
  color: var(--text-muted);
}
.tweet-actions-left {
  display: flex;
  align-items: center;
  gap: 22px;
}
.tweet-actions-right {
  display: flex;
  align-items: center;
  gap: 16px;
}
.action-item {
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  user-select: none;
  padding: 2px 4px;
  margin: -2px -4px;
  border-radius: 6px;
}
.action-item:active {
  color: var(--accent);
}
.action-item.liked {
  color: #f91880;
  font-weight: 700;
}
.action-item.retweeted {
  color: #00ba7c;
  font-weight: 700;
}
.action-item.saved {
  color: var(--accent);
  font-weight: 700;
}
.action-item.busy {
  opacity: 0.6;
  pointer-events: none;
}
.retweet-banner {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.quoted-box {
  margin-top: 8px;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.02);
  cursor: pointer;
}
.quoted-box:active {
  background: rgba(255, 255, 255, 0.05);
}

/* Bottom Bar */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 52px;
  background: rgba(0, 0, 0, 0.98);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}
.bottom-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 11px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px 12px;
}
.bottom-item.active {
  color: var(--text);
  font-weight: 700;
}
.bottom-icon {
  font-size: 18px;
  line-height: 1.2;
}

/* Buttons and Inputs */
.btn {
  display: inline-block;
  padding: 8px 18px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 9999px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
}
.btn:active {
  background: var(--accent-hover);
}
.btn-block {
  display: block;
  width: 100%;
}
.btn-secondary {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:active {
  background: #16181c;
}
.form-input, .form-textarea {
  width: 100%;
  background: #16181c;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px;
  border-radius: 8px;
  font-size: 15px;
  margin-bottom: 12px;
  font-family: inherit;
}
.form-input:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.form-textarea {
  resize: vertical;
  min-height: 90px;
}

/* Clean cards for Settings */
.card {
  border-bottom: 1px solid var(--border);
  padding: 16px;
}
.card-title {
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 6px;
}
.card-desc {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 14px;
  line-height: 1.4;
}
.spinner {
  text-align: center;
  padding: 36px 16px;
  color: var(--text-muted);
  font-size: 14px;
}
.spinner::before, .inline-spinner::before {
  content: '';
  display: inline-block;
  width: 14px;
  height: 14px;
  margin-right: 7px;
  vertical-align: -2px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.feed-toolbar {
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.feed-progress { color: var(--text-muted); font-size: 12px; }
.feed-progress.error { color: #fca5a5; }
.feed-toolbar button:disabled { opacity: .7; }
.load-more-box {
  padding: 16px;
  text-align: center;
}
.sub-header {
  height: 48px;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 16px;
  font-weight: 700;
}
.back-btn {
  background: none;
  border: none;
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 9999px;
}
</style>
</head>
<body>

<div class="header">
    <div class="header-logo">
        <svg viewBox="0 0 64 64" role="img" aria-label="X Lite logo" xmlns="http://www.w3.org/2000/svg">
            <rect width="64" height="64" rx="14" fill="#000"/>
            <path d="M14 13h9l30 39h-9z" fill="#f7f9fa"/>
            <path d="M18.5 15.5H21l27.5 34H46z" fill="#000"/>
            <path d="M47 13h5L19 52h-5z" fill="#f7f9fa"/>
            <circle cx="51" cy="20" r="7" fill="#1d9bf0" opacity=".12"/>
            <circle cx="51" cy="20" r="5" fill="#1d9bf0" opacity=".22"/>
            <circle cx="51" cy="20" r="3.5" fill="#1d9bf0"/>
        </svg>
        <span class="header-sub">Lite</span>
    </div>
</div>

<div id="tabNav" class="nav-tabs">
    <div class="nav-tab active" onclick="switchFeed('following')">Following</div>
    <div class="nav-tab" onclick="switchFeed('foryou')">For You</div>
    <div class="nav-tab" onclick="switchFeed('cache')">Offline</div>
</div>

<div id="statusBar" class="status-bar" style="display:none;"></div>

<div id="mainContent">
    <div id="feedContainer"></div>
</div>

<div class="bottom-bar">
    <div class="bottom-item active" onclick="nav('feed')">
        <span class="bottom-icon">⌂</span>
        <span>Home</span>
    </div>
    <div class="bottom-item" onclick="nav('search')">
        <span class="bottom-icon">⚲</span>
        <span>Search</span>
    </div>
    <div class="bottom-item" onclick="nav('post')">
        <span class="bottom-icon">✎</span>
        <span>Post</span>
    </div>
    <div class="bottom-item" onclick="nav('settings')">
        <span class="bottom-icon">⚙</span>
        <span>Settings</span>
    </div>
</div>

// Global callback dispatcher for native Android async requests
window.__onAsyncFinish = function(callbackId, directResult) {
    if (pendingCallbacks[callbackId]) {
        let resStr = '';
        if (directResult !== undefined) {
            resStr = directResult;
        } else if (window.AndroidBridge && AndroidBridge.getCache) {
            resStr = AndroidBridge.getCache('temp_res_' + callbackId);
            AndroidBridge.saveCache('temp_res_' + callbackId, '');
        }
        let cb = pendingCallbacks[callbackId];
        delete pendingCallbacks[callbackId];
        try {
            cb(resStr);
        } catch(err) {
            console.error("Callback error:", err);
        }
    }
};

    let cbId = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);

    try {
        if (transactionId) {
            if (window.AndroidBridge && typeof AndroidBridge.executeSearchGetAsync === 'function') {
                AndroidBridge.executeSearchGetAsync(url, transactionId, cbId);
            } else {
                window.__onAsyncFinish(cbId, JSON.stringify({ error: true, message: 'Install the v1.0.6 APK to enable search.' }));
            }
        } else if (window.AndroidBridge && AndroidBridge.executeGetAsync) {
            AndroidBridge.executeGetAsync(url, cbId);
        } else if (window.AndroidBridge && AndroidBridge.executeGet) {
            setTimeout(() => {
                try {
                    window.__onAsyncFinish(cbId, AndroidBridge.executeGet(url));
                } catch (error) {
                    window.__onAsyncFinish(cbId, JSON.stringify({ error: true, message: error.message || 'Request failed' }));
                }
            }, 10);
        } else {
            // Fallback to native browser fetch
            fetch(url)
                .then(r => r.text())
                .then(txt => window.__onAsyncFinish(cbId, txt))
                .catch(err => window.__onAsyncFinish(cbId, JSON.stringify({ error: true, message: err.message })));
        }
    } catch (error) {
        window.__onAsyncFinish(cbId, JSON.stringify({ error: true, message: error.message || 'Request failed' }));

}

        return { ok: !error, res, error, status: res?.status };
    }
    if (spec?.ok && spec.ok(res)) {
        return { ok: true, res, error: '', status: res?.status || 200 };
    }
    const errObj = Array.isArray(res?.errors) ? res.errors[0] : null;
    const error = errObj?.message || (res?.error ? (res.message || 'Error') : 'Unexpected response from X');

function performPostMutation(op, variables, callback) {

        callback({ ok: false, error: 'Unsupported action' });

        const path = '/i/api/graphql/' + queryId + '/' + op;
        const bodyObj = { variables, queryId };
        if (spec.includeFeatures) bodyObj.features = GRAPHQL_FEATURES;

            const parsed = parsePostResponse(resStr, op);
            if (!parsed.ok && index + 1 < spec.queryIds.length && isQueryIdFailure(parsed)) {
                tryIndex(index + 1, parsed);
                return;
            }
            callback(parsed);
        });
    }
    tryIndex(0, null);
}

function decodeHtmlEntities(text) {
    if (!text) return '';
    // Decode named/numeric entities before &amp; so double-encoded text stays literal on re-escape.
    return String(text)
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/&quot;/g, '"')
        .replace(/&#(?:39|x27);|&apos;/gi, "'")
        .replace(/&amp;/g, '&');
}

function escapeHtml(text) {
    if (!text) return '';
    return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function linkify(text) {
    const source = String(text || '');
    const matcher = /https?:\/\/[^\s<>"']+|@[a-zA-Z0-9_]+|#[a-zA-Z0-9_]+/g;
    let result = '';
    let offset = 0;
    for (const match of source.matchAll(matcher)) {
        result += escapeHtml(source.slice(offset, match.index));
        const token = match[0];
        if (token.startsWith('http')) {
            result += `<a href="${escapeHtml(token)}" onclick="event.stopPropagation()">${escapeHtml(token)}</a>`;
        } else {
            const query = token[0] === '@' ? 'from:' + token.slice(1) : token;
            result += `<a href="javascript:searchTag('${query}')" onclick="event.stopPropagation()">${escapeHtml(token)}</a>`;
        }
        offset = match.index + token.length;
    }
    return result + escapeHtml(source.slice(offset));
}

function findTweetById(twId) {
    const key = String(twId || '');
    if (!key) return null;
    if (allTweetsMap[key]) return allTweetsMap[key];
    let found = currentTweetsList.find(t => t && String(t.id) === key);
    if (!found) found = getBookmarks().find(t => t && String(t.id) === key);
    if (!found && window.AndroidBridge && AndroidBridge.getCache) {
        try {
            const raw = AndroidBridge.getCache('feed_cache');
            const cached = raw ? JSON.parse(raw) : [];
            if (Array.isArray(cached)) {
                cached.forEach(t => { if (t && t.id && !allTweetsMap[t.id]) allTweetsMap[t.id] = t; });
                found = allTweetsMap[key] || null;
            }
        } catch(e) {}
    }
    if (found) allTweetsMap[key] = found;
    return found || null;
}

function readNodeAttr(el, name) {
    if (!el) return null;
    if (typeof el.getAttribute === 'function') return el.getAttribute(name);
    if (name.startsWith('data-') && el.dataset) {
        const camel = name.slice(5).replace(/-([a-z])/g, (_, c) => c.toUpperCase());
        return el.dataset[camel] ?? null;
    }
    return null;
}

}

function syncTweetActionDom(root, twId, tw) {
    if (!root || typeof root.querySelectorAll !== 'function') return;
    const saved = isBookmarked(twId);
    const liked = !!tw?.liked;
    const retweeted = !!tw?.retweeted;
    setTweetActionElements(root, 'data-reply-id', twId, el => {
        if (tw) el.textContent = '💬 ' + (tw.replies || 0);
    });
    setTweetActionElements(root, 'data-rt-id', twId, el => {
        if (tw) el.textContent = '⇄ ' + (tw.retweets || 0);
        if (el.classList) {
            el.classList.toggle('retweeted', retweeted);
            el.classList.toggle('busy', !!pendingActionLocks['rt:' + twId]);
        }
    });
    setTweetActionElements(root, 'data-like-id', twId, el => {
        if (tw) el.textContent = (liked ? '♥ ' : '♡ ') + (tw.likes || 0);
        if (el.classList) {
            el.classList.toggle('liked', liked);
            el.classList.toggle('busy', !!pendingActionLocks['like:' + twId]);
        }
    });
    setTweetActionElements(root, 'data-bm-id', twId, el => {
        el.textContent = saved ? '★ Saved' : '☆ Save';
        if (el.classList) el.classList.toggle('saved', saved);
    });
}

function syncTweetActionState(twId) {
    const key = String(twId || '');
    const tw = findTweetById(key);
    if (tw) {
        allTweetsMap[key] = tw;
        currentTweetsList.forEach(item => {
            if (item && String(item.id) === key) Object.assign(item, tw);
        });
        const bmList = getBookmarks();
        let bmChanged = false;
        bmList.forEach(item => {
            if (item && String(item.id) === key && item !== tw) {
                Object.assign(item, tw);
                bmChanged = true;
            }
        });
        if (bmChanged) saveBookmarks(bmList);
    }
    syncTweetActionDom(document, key, tw);
    if (typeof savedFeedNodes !== 'undefined' && savedFeedNodes) {
        syncTweetActionDom(savedFeedNodes, key, tw);
    }
}

function syncVisibleTweetActions() {
    if (typeof document.querySelectorAll !== 'function') return;
    const seen = new Set();
    document.querySelectorAll('.tweet[data-id]').forEach(node => {
        const id = readNodeAttr(node, 'data-id');
        if (id && !seen.has(id)) {
            seen.add(id);
            syncTweetActionDom(document, id, findTweetById(id));
        }
    });
}

function toggleLike(twId, event) {
    if (event && event.stopPropagation) event.stopPropagation();
    const key = String(twId || '');
    const tw = findTweetById(key);
    if (!tw) return;
    const lockKey = 'like:' + key;
    if (pendingActionLocks[lockKey]) return;

    const prevLiked = !!tw.liked;
    const prevLikes = Number(tw.likes) || 0;
    const targetLiked = !prevLiked;

    pendingActionLocks[lockKey] = true;
    tw.liked = targetLiked;
    tw.likes = Math.max(0, prevLikes + (targetLiked ? 1 : -1));
    syncTweetActionState(key);

    const op = targetLiked ? 'FavoriteTweet' : 'UnfavoriteTweet';
    performPostMutation(op, { tweet_id: key }, (res) => {
        delete pendingActionLocks[lockKey];
        if (!res.ok) {
            tw.liked = prevLiked;
            tw.likes = prevLikes;
            syncTweetActionState(key);
            showStatus('Like failed: ' + (res.error || 'Try again'), true, 4500);
            return;
        }
        syncTweetActionState(key);
    });
}

function toggleRetweet(twId, event) {
    if (event && event.stopPropagation) event.stopPropagation();
    const key = String(twId || '');
    const tw = findTweetById(key);
    if (!tw) return;
    const lockKey = 'rt:' + key;
    if (pendingActionLocks[lockKey]) return;

    const prevRetweeted = !!tw.retweeted;
    const prevRetweets = Number(tw.retweets) || 0;
    const targetRetweeted = !prevRetweeted;

    pendingActionLocks[lockKey] = true;
    tw.retweeted = targetRetweeted;
    tw.retweets = Math.max(0, prevRetweets + (targetRetweeted ? 1 : -1));
    syncTweetActionState(key);

    const op = targetRetweeted ? 'CreateRetweet' : 'DeleteRetweet';
    const vars = targetRetweeted
        ? { tweet_id: key, dark_request: false }
        : { source_tweet_id: key, dark_request: false };

    performPostMutation(op, vars, (res) => {
        delete pendingActionLocks[lockKey];
        if (!res.ok) {
            tw.retweeted = prevRetweeted;
            tw.retweets = prevRetweets;
            syncTweetActionState(key);
            showStatus('Retweet failed: ' + (res.error || 'Try again'), true, 4500);
            return;
        }
        syncTweetActionState(key);
    });
}

function commentTweet(twId, event) {
    if (event && event.stopPropagation) event.stopPropagation();
    const key = String(twId || '');
    if (currentView === 'thread' && activeThreadTweetId === key) {
        const replyInput = document.getElementById('replyText');
        if (replyInput) {
            if (typeof replyInput.scrollIntoView === 'function') replyInput.scrollIntoView({ block: 'center' });
            if (typeof replyInput.focus === 'function') replyInput.focus();
            return;
        }
    }
    viewThread(key, true);
}

function toggleBookmark(twId, event) {
    if (event && event.stopPropagation) event.stopPropagation();
    const key = String(twId || '');
    let list = getBookmarks().slice();
    let idx = list.findIndex(t => t && String(t.id) === key);
    let tweetObj = findTweetById(key);
    const willSave = idx < 0;

    if (!willSave) {
        list.splice(idx, 1);
        if (tweetObj) tweetObj.bookmarked = false;
        saveBookmarks(list);
        showStatus('Removed from offline saved', false, 2000);
    } else if (tweetObj) {
        tweetObj.bookmarked = true;
        list.unshift({ ...tweetObj });
        saveBookmarks(list);
        showStatus('Saved for offline reading', false, 2000);
    } else {
        showStatus('Could not save tweet offline', true, 3000);
        return;
    }

    syncTweetActionState(key);
    if (currentView === 'feed' && currentTab === 'cache') {
        const prevY = typeof window.scrollY === 'number' ? window.scrollY : 0;
        loadFeed('cache', false, true);
        if (typeof window.scrollTo === 'function') window.scrollTo(0, prevY);
    }
    if (window.AndroidBridge && typeof AndroidBridge.executePostWithTransactionAsync === 'function' &&
        (typeof navigator === 'undefined' || navigator.onLine !== false)) {
        performPostMutation(willSave ? 'CreateBookmark' : 'DeleteBookmark', { tweet_id: key }, () => {});
    }
}

function copyTweetLink(screenName, id, event) {
    if (event && event.stopPropagation) event.stopPropagation();
    let url = 'https://x.com/' + (screenName || 'i') + '/status/' + id;
    if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => {
            showStatus('Link copied to clipboard', false, 2000);
        }).catch(() => {
            prompt('Copy link:', url);
        });
    } else {
        prompt('Copy link:', url);
    }
}

// In-place HD image loader
function localImageUrl(url, mode, fresh = false) {
    const attempt = fresh ? imageRequestNonce + '-' + (++imageRequestSequence) : '';
    const target = fresh ? url + (url.includes('#') ? '&' : '#') + 'xlite-retry=' + attempt : url;
    const base = 'https://local.xlite/img?url=' + encodeURIComponent(target) + '&mode=' + mode;
    return fresh ? base + '&retry=' + attempt : base;
}

function mediaHdUrl(url) {
    try {
        const parsed = new URL(url);
        if (parsed.protocol !== 'https:' || parsed.hostname !== 'pbs.twimg.com') return url;
        const cleanPath = parsed.pathname.replace(/:(thumb|small|medium|large|orig)$/, '');
        if (cleanPath.startsWith('/media/') && (/\.png$/i.test(cleanPath) || parsed.searchParams.get('format') === 'png')) {
            parsed.pathname = cleanPath;
            parsed.searchParams.set('format', 'webp');
            return parsed.href;
        }
        return url;
    } catch (_) { return url; }
}

function loadHdImg(btn, url, imgId, fallbackUrl) {
    const fresh = btn.dataset.retryRequested === '1';
    const rawTarget = fallbackUrl || url;
    const hdTarget = mediaHdUrl(url);
    btn.innerHTML = 'Loading HD...';
    btn.disabled = true;
    const img = document.getElementById(imgId);
    if (!img) {
        btn.innerHTML = 'Retry HD';
        btn.disabled = false;
        return;
    }

    let settled = false;
    const hdImg = new Image();
    activeImageLoads.add(hdImg);
    const timer = setTimeout(() => {
        if (!settled && typeof hdImg.onerror === 'function') hdImg.onerror();
    }, 95000);
    const cleanup = () => {
        clearTimeout(timer);
        activeImageLoads.delete(hdImg);
    };

    hdImg.onload = function() {
        if (settled) return;
        settled = true;
        cleanup();
        img.src = hdImg.src;
        btn.innerHTML = '✓ HD · Reload';
        btn.disabled = false;
        btn.dataset.retryRequested = '1';
        btn.style.color = 'var(--accent)';
    };
    hdImg.onerror = function() {
        if (settled) return;
        if (!hdImg.dataset.fallbackTried && hdTarget !== rawTarget) {
            hdImg.dataset.fallbackTried = '1';
            hdImg.src = localImageUrl(rawTarget, 'hd', true);
            return;
        }
        settled = true;
        cleanup();
        btn.innerHTML = 'Retry HD';
        btn.disabled = false;
        btn.dataset.retryRequested = '1';
    };
    hdImg.src = localImageUrl(hdTarget, 'hd', fresh);
}

function loadThumbImg(btn, url, imgId, hdUrl = url) {
    const fresh = btn.dataset.retryRequested === '1';
    btn.innerHTML = 'Loading image...';
    btn.disabled = true;
    let settled = false;
    const img = document.createElement('img');
    img.id = imgId;
    img.className = 'tweet-img';
    activeImageLoads.add(img);
    const timer = setTimeout(() => {
        if (!settled && typeof img.onerror === 'function') img.onerror();
    }, 55000);
    const cleanup = () => {
        clearTimeout(timer);
        activeImageLoads.delete(img);
    };

    img.onload = function() {
        if (settled) return;
        settled = true;
        cleanup();
        const parent = btn.parentElement;
        parent.innerHTML = '';
        parent.appendChild(img);
        const hdBox = document.createElement('div');
        hdBox.style = 'text-align:right; margin-top:4px;';
        hdBox.innerHTML = `
            <button type="button" data-url="${escapeHtml(hdUrl)}" onclick="loadHdImg(this, this.dataset.url, '${imgId}')" style="font-size:12px; color:var(--text-muted); background:none; border:none; cursor:pointer; padding:4px 8px;">
                HD View
            </button>`;
        parent.appendChild(hdBox);
    };
    img.onerror = function() {
        if (settled) return;
        if (url !== hdUrl && !img.dataset.originalRetried) {
            img.dataset.originalRetried = '1';
            img.src = localImageUrl(hdUrl, 'thumb', true);
            return;
        }
        settled = true;
        cleanup();
        btn.innerHTML = 'Retry loading';
        btn.disabled = false;
        btn.dataset.retryRequested = '1';
    };
    img.src = localImageUrl(url, 'thumb', fresh);
}

function retryOriginalPreview(img) {
    const originalUrl = img.dataset.originalUrl || img.dataset.previewUrl;
    if (!img.dataset.originalRetried && originalUrl !== img.dataset.previewUrl) {
        img.dataset.originalRetried = '1';
        img.src = localImageUrl(originalUrl, 'thumb', true);
        return;
    }
    if (!img.parentElement) return;
    const retryButton = document.createElement('button');
    retryButton.type = 'button';
    retryButton.className = 'btn btn-secondary btn-block';
    retryButton.textContent = 'Retry small preview';
    retryButton.dataset.retryRequested = '1';
    retryButton.onclick = () => loadThumbImg(retryButton, img.dataset.previewUrl, img.id, originalUrl);
    img.replaceWith(retryButton);
}

function mediaPreviewUrl(url, isVideo) {
    if (!isVideo) return url;
    try {
        const parsed = new URL(url);
        if (parsed.protocol !== 'https:' || parsed.hostname !== 'pbs.twimg.com') return url;
        const cleanPath = parsed.pathname.replace(/:(thumb|small|medium|large|orig)$/, '');
        if (cleanPath.startsWith('/media/')) {
            parsed.pathname = cleanPath;
            parsed.searchParams.set('name', 'thumb');
            return parsed.href;
        }
        const ext = (cleanPath.split('.').pop() || 'jpg').toLowerCase();
        const format = ['jpg', 'jpeg', 'png', 'webp'].includes(ext) ? (ext === 'jpeg' ? 'jpg' : ext) : 'jpg';
        parsed.pathname = cleanPath + ':thumb';
        parsed.search = '';
        parsed.searchParams.set('format', format);
        return parsed.href;
    } catch (_) { return url; }
}

function avatarVariantUrl(url, mode = 'mini') {
    if (!url || mode === 'off') return '';
    try {
        const parsed = new URL(url);
        if (parsed.protocol !== 'https:' || parsed.hostname !== 'pbs.twimg.com') return '';
        if (!parsed.pathname.startsWith('/profile_images/')) return '';
        if (/\.gif$/i.test(parsed.pathname)) return '';
        const suffix = mode === 'normal' ? '_normal' : '_mini';
        parsed.pathname = parsed.pathname.replace(/_(mini|normal|bigger|200x200|400x400)(\.[a-z0-9]+)$/i, suffix + '$2');
        return parsed.href;
    } catch (_) { return ''; }
}

function getEffectiveAvatarMode() {
    if (appConfig.image_mode === 'off') return 'off';
    const pref = appConfig.avatar_mode || 'mini';
    return ['mini', 'normal', 'off'].includes(pref) ? pref : 'mini';
}

function renderAvatarHtml(tw, sizeClass = '') {
    const label = String(tw.user_name || tw.user_screen_name || 'X').trim();
    const initial = escapeHtml((label[0] || 'X').toUpperCase());
    const srcUrl = avatarVariantUrl(tw.user_avatar, getEffectiveAvatarMode());
    const clickAttr = (!sizeClass && tw.user_screen_name)
        ? ` onclick="searchTag('from:${escapeHtml(tw.user_screen_name)}'); event.stopPropagation();"`
        : '';
    const imgTag = srcUrl
        ? `<img class="tweet-avatar-img" src="${localImageUrl(srcUrl, 'thumb')}" alt="" loading="lazy" decoding="async" onload="this.style.opacity='1'" onerror="this.remove()" />`
        : '';
    return `<span class="tweet-avatar${sizeClass ? ' ' + sizeClass : ''}"${clickAttr}><span>${initial}</span>${imgTag}</span>`;
}

function renderTweetHtml(tw) {
    let rtHtml = tw.is_retweet
        ? `<div class="retweet-banner">⇄ Retweeted by ${escapeHtml(tw.retweeted_by || 'Someone')}</div>`
        : '';

    let mediaHtml = '';
    if (tw.media && tw.media.length > 0) {
        mediaHtml += '<div style="margin-top:8px;" onclick="event.stopPropagation()">';
        tw.media.forEach(m => {
            let imgId = 'img_' + Math.random().toString(36).substr(2, 9);
            const isVideo = m.type === 'video' || m.type === 'animated_gif';
            const previewUrl = mediaPreviewUrl(m.url, isVideo);
            const mediaLabel = isVideo ? (m.type === 'animated_gif' ? 'GIF' : 'Video') + (m.duration_ms ? ' · ' + Math.ceil(m.duration_ms / 1000) + 's' : '') + ' · poster frame' : 'Photo';
            if (isVideo) mediaHtml += `<div style="font-size:12px; color:var(--text-muted); margin-top:6px;">${mediaLabel}</div>`;
            if (appConfig.image_mode === 'auto') {
                mediaHtml += `
                <div>
                    <img id="${imgId}" src="${localImageUrl(previewUrl, 'thumb')}" class="tweet-img" loading="lazy" data-preview-url="${escapeHtml(previewUrl)}" data-original-url="${escapeHtml(m.url)}" onerror="retryOriginalPreview(this)" />
                    <div style="text-align:right; margin-top:4px;">
                        <button type="button" data-url="${escapeHtml(m.url)}" onclick="loadHdImg(this, this.dataset.url, '${imgId}')" style="font-size:12px; color:var(--text-muted); background:none; border:none; cursor:pointer; padding:4px 8px;">
                            HD View
                        </button>
                    </div>
                </div>`;
            } else if (appConfig.image_mode === 'off') {
                mediaHtml += `<div style="font-size:13px; color:var(--text-muted); margin-top:4px;">[${mediaLabel}]</div>`;
            } else {
                mediaHtml += `
                <div style="margin-top:6px;">
                    <button type="button" class="btn btn-secondary btn-block" data-url="${escapeHtml(previewUrl)}" data-hd-url="${escapeHtml(m.url)}" onclick="loadThumbImg(this, this.dataset.url, '${imgId}', this.dataset.hdUrl)" style="font-size:13px; padding:8px 14px;">
                        ${isVideo ? 'Load poster frame' : 'Load small preview'}
                    </button>
                </div>`;
            }
            if (m.alt_text) mediaHtml += `<div style="font-size:13px; color:var(--text-muted); margin-top:6px;">${escapeHtml(m.alt_text)}</div>`;
        });
        mediaHtml += '</div>';
    }

    let quotedHtml = '';
    if (tw.quoted) {
        let q = tw.quoted;
        quotedHtml = `
        <div class="quoted-box" onclick="viewThread('${escapeHtml(q.id)}'); event.stopPropagation();">
            <div class="tweet-header" style="margin-bottom:4px;">
                ${renderAvatarHtml(q, 'mini')}
                <div class="tweet-meta">
                    <span class="tweet-name">${escapeHtml(q.user_name || q.user_screen_name || '𝕏 User')}</span>
                    <span class="tweet-handle">${q.user_screen_name ? '@' + escapeHtml(q.user_screen_name) : ''}</span>
                </div>
            </div>
            <div class="tweet-body" style="font-size:14px; margin-top:2px;">${linkify(q.text)}</div>
        </div>`;
    }

    let handleHtml = tw.user_screen_name ? `<span class="tweet-handle">@${escapeHtml(tw.user_screen_name)}</span>` : '';
    let timeHtml = tw.created_at ? `<span class="tweet-dot">&middot;</span><span class="tweet-time">${escapeHtml(tw.created_at)}</span>` : '';
    let bookmarked = isBookmarked(tw.id);

    return `
    <div class="tweet" data-id="${escapeHtml(tw.id)}">
        ${rtHtml}
        <div class="tweet-header">
            ${renderAvatarHtml(tw)}
            <div class="tweet-meta">
                <span class="tweet-name" onclick="searchTag('from:${escapeHtml(tw.user_screen_name)}'); event.stopPropagation();">
                    ${escapeHtml(tw.user_name || tw.user_screen_name || '𝕏 User')}
                </span>
                ${handleHtml}
                ${timeHtml}
            </div>
            ${tw.is_ad ? '<span class="ad-badge">Ad</span>' : ''}
        </div>
        <div class="tweet-body" onclick="viewThread('${escapeHtml(tw.id)}')">${linkify(tw.text)}</div>
        ${mediaHtml}
        ${quotedHtml}
        <div class="tweet-actions">
            <div class="tweet-actions-left">
                <span class="action-item" data-reply-id="${escapeHtml(tw.id)}" onclick="commentTweet('${escapeHtml(tw.id)}', event)">💬 ${tw.replies || 0}</span>
                <span class="action-item${tw.retweeted ? ' retweeted' : ''}" data-rt-id="${escapeHtml(tw.id)}" onclick="toggleRetweet('${escapeHtml(tw.id)}', event)">⇄ ${tw.retweets || 0}</span>
                <span class="action-item${tw.liked ? ' liked' : ''}" data-like-id="${escapeHtml(tw.id)}" onclick="toggleLike('${escapeHtml(tw.id)}', event)">${tw.liked ? '♥' : '♡'} ${tw.likes || 0}</span>
            </div>
            <div class="tweet-actions-right">
                <span class="action-item${bookmarked ? ' saved' : ''}" data-bm-id="${escapeHtml(tw.id)}" onclick="toggleBookmark('${escapeHtml(tw.id)}', event)">${bookmarked ? '★ Saved' : '☆ Save'}</span>
                <span class="action-item" onclick="copyTweetLink('${escapeHtml(tw.user_screen_name)}', '${escapeHtml(tw.id)}', event)">🔗</span>
            </div>
        </div>

}

function extractUser(tw) {
    let uRes = tw.core?.user_results?.result || tw.user_results?.result || tw.user;
    if (!uRes) return { name: '', screen_name: '', avatar: '' };

    if (uRes.__typename === 'UserWithVisibilityResults') {
        uRes = uRes.user || uRes;
    }

    let core = uRes.core || {};
    let legacy = uRes.legacy || {};

    let name = decodeHtmlEntities(core.name || legacy.name || uRes.name || '');
    let screen_name = core.screen_name || legacy.screen_name || uRes.screen_name || '';
    let avatar = uRes.avatar?.image_url || legacy.profile_image_url_https || uRes.profile_image_url_https || '';

    return { name, screen_name, avatar };
}

function findInstructions(obj) {
    if (!obj || typeof obj !== 'object') return null;
    if (Array.isArray(obj.instructions)) return obj.instructions;
    for (let k in obj) {
        if (obj[k] && typeof obj[k] === 'object') {
            let found = findInstructions(obj[k]);
            if (found) return found;
        }
    }
    return null;
}

function isPromotedItem(item, entryId) {
    return !!(item?.promotedMetadata || (entryId && String(entryId).startsWith('promoted-tweet-')));
}

function parseTwitterGraphql(jsonStr) {
    let data;
    try {
        data = JSON.parse(jsonStr);
    } catch(e) {
        return { tweets: [], error: 'JSON parse error' };
    }

    if (data.errors && data.errors.length > 0 && !data.data) {
        return { tweets: [], error: data.errors[0]?.message || 'GraphQL Error', status: data.status };
    }
    if (data.error && !data.statuses && !data.globalObjects) {
        return { tweets: [], error: data.message || 'Error from Twitter', status: data.status };
    }

    // Direct REST v1.1 search format: { statuses: [...] }
    if (Array.isArray(data.statuses)) {
        let tweets = [];
        data.statuses.forEach(st => {
            let p = parseSingleTweet(st);
            if (p) tweets.push(p);
        });
        return { tweets, nextCursor: null };
    }

    // Direct Adaptive format: { globalObjects: { tweets: {...}, users: {...} } }
    if (data.globalObjects && data.globalObjects.tweets) {
        let tweets = [];
        let users = data.globalObjects.users || {};
        for (let tid in data.globalObjects.tweets) {
            let tw = data.globalObjects.tweets[tid];
            let user = users[tw.user_id_str] || {};
            tw.user = user;
            let p = parseSingleTweet(tw);
            if (p) tweets.push(p);
        }
        return { tweets, nextCursor: null };
    }

    let instructions = findInstructions(data) || [];

    let entries = [];
    instructions.forEach(ins => {
        if (ins.type === 'TimelineAddEntries') entries.push(...(ins.entries || []));
        if (ins.type === 'TimelineAddToModule') entries.push(...(ins.moduleItems || []));
    });

    let tweets = [];
    let nextCursor = null;

    entries.forEach(entry => {
        let content = entry.content || {};
        if (content.entryType === 'TimelineTimelineCursor' && content.cursorType === 'Bottom') {
            nextCursor = content.value;
        }

        let item = content.itemContent;
        if (item && item.itemType === 'TimelineTweet') {
            let res = item.tweet_results?.result;
            if (res) {
                let parsed = parseSingleTweet(res);
                if (parsed) {
                    if (isPromotedItem(item, entry.entryId)) {
                        parsed.is_ad = true;
                        allTweetsMap[parsed.id] = parsed;
                    }
                    tweets.push(parsed);
                }
            }
        }

        // Conversation thread replies & modules
        let subItems = content.items || [];
        subItems.forEach(sub => {
            let sItem = sub.item?.itemContent || sub.itemContent || sub.item?.content?.itemContent;
            if (sItem && sItem.itemType === 'TimelineTweet') {
                let sRes = sItem.tweet_results?.result || sItem.result;
                if (sRes) {
                    let parsed = parseSingleTweet(sRes);
                    if (parsed) {
                        if (isPromotedItem(sItem, sub.entryId)) {
                            parsed.is_ad = true;
                            allTweetsMap[parsed.id] = parsed;
                        }
                        tweets.push(parsed);
                    }
                }
            }
        });
    });

    return { tweets, nextCursor, error: tweets.length ? null : (data.errors?.[0]?.message || null), status: data.status };
}

function isQueryIdFailure(result) {
    return result.status === 404 || /GRAPHQL_VALIDATION_FAILED|unknown query|query.*not found/i.test(result.error || '');
}

function parseSingleTweet(tw) {
    if (!tw) return null;
    if (tw.__typename === 'TweetWithVisibilityResults') tw = tw.tweet || tw;
    let legacy = tw.legacy || {};
    let id = legacy.id_str || tw.rest_id || tw.id_str || tw.id;
    if (!id) return null;
    id = String(id);

    let isRetweet = false;
    let retweetedBy = null;
    if (legacy.retweeted_status_result) {
        let orig = legacy.retweeted_status_result.result;
        if (orig) {
            let p = parseSingleTweet(orig);
            if (p) {
                p.is_retweet = true;
                let retweeter = extractUser(tw);
                p.retweeted_by = retweeter.name || retweeter.screen_name || 'Someone';
                allTweetsMap[p.id] = p;
                return p;
            }
        }
    }

    let text = decodeHtmlEntities(tw.note_tweet?.note_tweet_results?.result?.text || legacy.full_text || tw.full_text || tw.text || '');
    text = text.replace(/https?:\/\/t\.co\/\S+$/, '').trim();

    let user = extractUser(tw);

    let media = [];
    let extMedia = legacy.extended_entities?.media || tw.extended_entities?.media || tw.entities?.media || [];
    extMedia.forEach(m => {
        let mUrl = m.media_url_https || m.media_url;
        if (mUrl) {
            media.push({ url: mUrl, type: m.type, duration_ms: m.video_info?.duration_millis || 0, alt_text: decodeHtmlEntities(m.ext_alt_text || m.alt_text || '') });
        }
    });

    // Quoted tweet
    let quoted = null;
    let qRes = tw.quoted_status_result?.result;
    if (qRes) {
        quoted = parseSingleTweet(qRes);
    }

    let parsed = {
        id,
        text,
        user_name: user.name,
        user_screen_name: user.screen_name,
        user_avatar: user.avatar || '',
        created_at: legacy.created_at ? new Date(legacy.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '',
        likes: legacy.favorite_count || tw.favorite_count || 0,
        retweets: legacy.retweet_count || tw.retweet_count || 0,
        replies: legacy.reply_count || tw.reply_count || 0,
        liked: !!(legacy.favorited || tw.favorited),
        retweeted: !!(legacy.retweeted || tw.retweeted),
        bookmarked: !!(legacy.bookmarked || tw.bookmarked),
        media,
        quoted,
        is_retweet: isRetweet,
        retweeted_by: retweetedBy,
        is_ad: false
    };
    allTweetsMap[id] = parsed;
    return parsed;
}

function feedToolbar() {
    return '<div class="feed-toolbar"><span id="feedProgress" class="feed-progress" role="status" aria-live="polite"></span><button id="feedRefreshButton" type="button" class="btn btn-secondary" onclick="refreshFeed()">Refresh</button></div>';
}

function setFeedProgress(loading, message, error = false) {
    const button = document.getElementById('feedRefreshButton');
    const progress = document.getElementById('feedProgress');
    if (button) {
        button.disabled = loading;
        button.innerHTML = loading ? '<span class="inline-spinner">Refreshing</span>' : 'Refresh';
    }
    if (progress) {
        progress.textContent = message || '';
        progress.classList.toggle('error', error);
    }
}

function refreshFeed() {
    if (currentView !== 'feed' || currentTab === 'cache') return;
    if (isFetching && isFetching.startsWith(currentTab + ':' + viewGeneration + ':')) {
        if (isFetching.endsWith(':true')) setFeedProgress(false, 'Loading more posts. Refresh again shortly.');
        return;
    }
    if (document.getElementById('feedContainer')) {
        fetchFeedData(currentTab, false);
    } else {
        loadFeed(currentTab, true);
    }
}

function loadFeed(feedType, forceRefresh = false, preserveStatus = false) {
    const container = document.getElementById('mainContent');

    if (feedType === 'cache') {
        if (!preserveStatus) showStatus('Viewing offline tweets', false, 0);
        let bookmarks = getBookmarks();
        let cached = window.AndroidBridge ? AndroidBridge.getCache('feed_cache') : '';
        let cachedList = [];
        try {
            const parsed = cached ? JSON.parse(cached) : [];
            if (Array.isArray(parsed)) cachedList = parsed;
        } catch(e){}

        bookmarks.forEach(t => { if (t && t.id) allTweetsMap[t.id] = { ...(allTweetsMap[t.id] || {}), ...t }; });
        cachedList.forEach(t => { if (t && t.id && !allTweetsMap[t.id]) allTweetsMap[t.id] = t; });

        if (bookmarks.length === 0 && cachedList.length === 0) {
            container.innerHTML = '<div class="card"><div class="card-title">No Offline Tweets</div><p class="card-desc">Tap ☆ Save on any tweet or browse feeds to save offline.</p></div>';
            return;
        }

        let out = '';
        if (bookmarks.length > 0) {
            out += '<div style="padding:12px 16px; font-weight:700; font-size:14px; border-bottom:1px solid var(--border);">Saved Tweets (' + bookmarks.length + ')</div>';
            out += bookmarks.map(t => renderTweetHtml(allTweetsMap[t.id] || t)).join('');
        }
        if (cachedList.length > 0) {
            out += '<div style="padding:12px 16px; font-weight:700; font-size:14px; color:var(--text-muted); border-bottom:1px solid var(--border);">Recent Cache</div>';
            out += cachedList.map(t => renderTweetHtml(allTweetsMap[t.id] || t)).join('');
        }
        container.innerHTML = '<div id="feedContainer">' + out + '</div>';
        return;
    }

    // Stale-While-Revalidate: Instant Load
    let cachedFeed = '';
    if (window.AndroidBridge) {
        cachedFeed = AndroidBridge.getCache('feed_' + feedType);
    }

    let hasCached = false;
    if (cachedFeed) {
        try {
            let list = JSON.parse(cachedFeed);
            if (list && list.length > 0) {
                currentTweetsList = list;
                cursors[feedType] = window.AndroidBridge ? AndroidBridge.getCache('feed_cursor_' + feedType) || null : null;
                usedFeedCursors[feedType].clear();
                list.forEach(t => { if (t && t.id) allTweetsMap[t.id] = t; });
                container.innerHTML = feedToolbar() + '<div id="feedContainer">' + list.map(renderTweetHtml).join('') + '</div>';
                hasCached = true;
                renderLoadMoreButton(feedType);
            }
        } catch (e) {}
    }

    if (!hasCached) {
        currentTweetsList = [];
        showStatus('', false);
        container.innerHTML = '<div class="spinner">Loading...</div>';
    } else if (!forceRefresh) {
        const lastUpdated = Number(window.AndroidBridge ? AndroidBridge.getCache('feed_updated_' + feedType) : localStorage.getItem('feed_updated_' + feedType));
        if (lastUpdated && Date.now() - lastUpdated < FEED_REFRESH_MS) {
            showStatus('Showing recent cached tweets', false, 2500);
            return;
        }
    }

    fetchFeedData(feedType, false);
}

function fetchFeedData(feedType, isPaging) {
    const generation = viewGeneration;
    const requestKey = feedType + ':' + generation + ':' + isPaging;
    if (isFetching && isFetching.startsWith(feedType + ':' + generation + ':')) return;
    isFetching = requestKey;
    if (!isPaging) setFeedProgress(true, 'Checking for new posts…');

    const cfg = TIMELINE_CONFIG[feedType];
    if (!cfg) {
        if (isFetching === requestKey) isFetching = false;
        return;
    }

    let cursor = isPaging ? cursors[feedType] : null;
    let variables = cfg.buildVariables(FEED_PAGE_SIZE, cursor);

    let url = `https://x.com/i/api/graphql/${cfg.queryId}/${cfg.op}?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;

    performAsyncGet(url, (resStr) => {
        if (generation !== viewGeneration || currentView !== 'feed' || currentTab !== feedType) return;
        let fallbackPending = false;
        try {
            let parsed = parseTwitterGraphql(resStr);

            const container = document.getElementById('mainContent');

            if (parsed.error) {
                if (cfg.fallbackQueryId && isQueryIdFailure(parsed)) {
                    fallbackPending = true;
                    let fallbackUrl = `https://x.com/i/api/graphql/${cfg.fallbackQueryId}/${cfg.op}?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;
                    performAsyncGet(fallbackUrl, (fbStr) => {
                        if (isFetching === requestKey) isFetching = false;
                        if (generation !== viewGeneration || currentView !== 'feed' || currentTab !== feedType) return;
                        try {
                            let fbParsed = parseTwitterGraphql(fbStr);
                            if (fbParsed.tweets && fbParsed.tweets.length > 0) {
                                applyFeedTweets(feedType, fbParsed, isPaging);
                            } else {
                                displayFeedError(feedType, fbParsed.error ? fbParsed : parsed, isPaging);
                            }
                        } catch (error) {
                            displayFeedError(feedType, { error: error.message || 'Could not read feed response' }, isPaging);
                        }
                    });
                    return;
                }
                displayFeedError(feedType, parsed, isPaging);
                return;
            }

            applyFeedTweets(feedType, parsed, isPaging);
        } catch(err) {
            console.error("fetchFeedData error:", err);
            displayFeedError(feedType, { error: err.message || 'Could not read feed response' }, isPaging);
        } finally {
            if (isFetching === requestKey && !fallbackPending) isFetching = false;
        }
    });
}

function applyFeedTweets(feedType, parsed, isPaging) {
    const container = document.getElementById('mainContent');
    if (parsed.tweets.length === 0 && !isPaging) {
        if (currentTweetsList.length) {
            setFeedProgress(false, 'No new posts returned. Tap Refresh to retry.', true);
        } else {
            container.innerHTML = feedToolbar() + '<div class="card"><p class="card-desc">No posts found. Tap Refresh to retry.</p></div>';
        }
        return;
    }

    const usedCursors = usedFeedCursors[feedType];
    if (isPaging && cursors[feedType]) usedCursors.add(cursors[feedType]);
    if (!isPaging) usedCursors.clear();
    const nextCursor = parsed.nextCursor;
    cursors[feedType] = nextCursor && !usedCursors.has(nextCursor) ? nextCursor : null;

    if (isPaging) {
        const existingIds = new Set(currentTweetsList.map(t => t.id));
        const freshTweets = parsed.tweets.filter(t => {
            if (existingIds.has(t.id)) return false;
            existingIds.add(t.id);
            return true;
        });
        currentTweetsList.push(...freshTweets);
        parsed.tweets.forEach(t => { if (t && t.id) allTweetsMap[t.id] = t; });
        let feedDiv = document.getElementById('feedContainer');
        if (feedDiv) {
            feedDiv.insertAdjacentHTML('beforeend', freshTweets.map(renderTweetHtml).join(''));
        }
        setFeedProgress(false, freshTweets.length ? '' : cursors[feedType] ? 'No new posts on this page. Load more to continue.' : 'No more posts.');
        showStatus('', false);
    } else {
        const seenIds = new Set();
        currentTweetsList = parsed.tweets.filter(t => {
            if (seenIds.has(t.id)) return false;
            seenIds.add(t.id);
            return true;
        });
        parsed.tweets.forEach(t => { if (t && t.id) allTweetsMap[t.id] = t; });
        if (window.AndroidBridge) {
            AndroidBridge.saveCache('feed_' + feedType, JSON.stringify(currentTweetsList));
            AndroidBridge.saveCache('feed_cache', JSON.stringify(currentTweetsList));
            AndroidBridge.saveCache('feed_cursor_' + feedType, cursors[feedType] || '');
            AndroidBridge.saveCache('feed_updated_' + feedType, String(Date.now()));
        } else {
            localStorage.setItem('feed_updated_' + feedType, String(Date.now()));
        }
        container.innerHTML = feedToolbar() + '<div id="feedContainer">' + currentTweetsList.map(renderTweetHtml).join('') + '</div>';
        setFeedProgress(false, 'Updated just now');
    }

    renderLoadMoreButton(feedType);
}

function displayFeedError(feedType, parsed, isPaging) {
    const container = document.getElementById('mainContent');
    let cachedFeed = window.AndroidBridge ? AndroidBridge.getCache('feed_' + feedType) : '';
    if (isPaging) {
        const btn = document.querySelector('#loadMoreBox button');
        if (btn) { btn.disabled = false; btn.textContent = 'Retry Load More'; }
        setFeedProgress(false, '');
        showStatus(parsed.error || 'Could not load more tweets', true, 5000);
    } else if (cachedFeed && document.getElementById('feedContainer')) {
        setFeedProgress(false, 'Refresh failed. Showing saved posts. Tap Refresh to retry.', true);
    } else {
        showStatus('', false);
        container.innerHTML = `
        <div class="card">
            <div class="card-title" style="color:var(--red);">Error loading feed</div>
            <p class="card-desc">${escapeHtml(parsed.error || 'Network error')}</p>
            <button type="button" class="btn btn-secondary" onclick="refreshFeed()">Retry Refresh</button>
            <a href="javascript:nav('settings')" class="btn btn-secondary">Check Settings &rarr;</a>
        </div>`;
    }
}

function renderLoadMoreButton(feedType) {
    let oldBtn = document.getElementById('loadMoreBox');
    if (oldBtn) oldBtn.remove();

    if (cursors[feedType] && currentView === 'feed' && currentTab === feedType) {
        const loadMoreHtml = `
        <div id="loadMoreBox" class="load-more-box">
            <button type="button" class="btn btn-secondary btn-block" onclick="loadMoreTweets('${feedType}')" style="padding:10px;">
                Load More
            </button>
        </div>`;
        const container = document.getElementById('mainContent');
        container.insertAdjacentHTML('beforeend', loadMoreHtml);
    }
}

function loadMoreTweets(feedType) {
    if (!cursors[feedType]) return;
    if (isFetching && isFetching.startsWith(feedType + ':' + viewGeneration + ':')) return;
    const btn = document.querySelector('#loadMoreBox button');
    if (btn) {
        btn.disabled = true;
        btn.innerHTML = 'Loading...';
    }
    fetchFeedData(feedType, true);
}

function getCurrentScrollY() {
    return Number(
        (typeof window !== 'undefined' ? window.scrollY : 0) ||
        (typeof document !== 'undefined' && document.documentElement ? document.documentElement.scrollTop : 0) ||
        (typeof document !== 'undefined' && document.body ? document.body.scrollTop : 0) ||
        0
    );
}

function restoreScrollPosition(scrollY) {
    const target = Math.max(0, Number(scrollY) || 0);
    if (typeof window.scrollTo === 'function') window.scrollTo(0, target);
    if (typeof requestAnimationFrame === 'function') {
        requestAnimationFrame(() => {
            if (currentView === 'feed' || currentView === 'search') window.scrollTo(0, target);
        });
    }
    setTimeout(() => {
        if (currentView === 'feed' || currentView === 'search') window.scrollTo(0, target);
    }, 60);
}

// Conversation / Thread View
function viewThread(tweetId, focusReply = false) {
    const capturedScrollY = getCurrentScrollY();
    if (currentView !== 'thread') {
        threadOriginView = currentView;
        if (currentView === 'feed') {
            savedFeedScrollY = capturedScrollY;
            savedFeedTab = currentTab;
            savedFeedRequestInterrupted = !!(isFetching && isFetching.startsWith(currentTab + ':' + viewGeneration + ':'));
            if (savedFeedRequestInterrupted) isFetching = false;
            const feedContainer = document.getElementById('mainContent');
            savedFeedMarkup = feedContainer.innerHTML;
            savedFeedNodes = document.createDocumentFragment();
            while (feedContainer.firstChild) savedFeedNodes.appendChild(feedContainer.firstChild);
        }
        if (currentView === 'search') {
            savedSearchScrollY = capturedScrollY;
            if (searchState && searchState.loading) {
                searchState.loading = false;
                if (searchState.cursor) renderSearchLoadMore('Search was interrupted. Retry to continue.');
                else {
                    document.getElementById('searchResults').innerHTML = '<div class="card"><p class="card-desc">Search was interrupted. Search again to retry.</p></div>';
                    document.getElementById('searchBtn').disabled = false;
                }
            }
            savedSearchMarkup = document.getElementById('mainContent').innerHTML;
        }
    }
    currentView = 'thread';
    viewGeneration++;
    currentFeedOrigin = currentTab;
    history.pushState({ view: 'thread', id: tweetId, originTab: currentTab }, '', '#thread-' + tweetId);
    renderThreadView(tweetId, focusReply);
}

function renderThreadView(tweetId, focusReply = false) {
    const generation = viewGeneration;
    activeThreadTweetId = String(tweetId || '');
    const tabNav = document.getElementById('tabNav');
    if (tabNav) tabNav.style.display = 'none';

    let focal = findTweetById(tweetId);

    const container = document.getElementById('mainContent');
    container.innerHTML = `
    <div class="sub-header">
        <button type="button" class="back-btn" onclick="goBackToFeed()">&larr;</button>
        <span>Conversation</span>
    </div>
    <div id="threadContainer">
        ${focal ? renderTweetHtml(focal) : '<div class="spinner">Loading tweet...</div>'}
        <div style="padding:14px 16px; border-bottom:1px solid var(--border);">
            <form onsubmit="postReply(event, '${escapeHtml(tweetId)}')">
                <textarea id="replyText" class="form-textarea" placeholder="Post your reply" style="min-height:65px; margin-bottom:10px;" required></textarea>
                <div style="display:flex; justify-content:flex-end;">
                    <button type="submit" id="replyBtn" class="btn">Reply</button>
                </div>
            </form>
        </div>
        <div id="repliesContainer">
            <div class="spinner">Loading replies...</div>
        </div>
    </div>`;

    if (focusReply) {
        setTimeout(() => {
            if (generation !== viewGeneration || currentView !== 'thread') return;
            const input = document.getElementById('replyText');
            if (input) {
                if (typeof input.scrollIntoView === 'function') input.scrollIntoView({ block: 'center' });
                if (typeof input.focus === 'function') input.focus();
            }
        }, 50);
    }

    let variables = {
        focalTweetId: tweetId,
        referrer: "tweet",
        with_rux_injections: false,
        rankingMode: "Relevance",
        includePromotedContent: false,
        withCommunity: true,
        withQuickPromoteEligibilityTweetFields: false,
        withBirdwatchNotes: true,
        withVoice: true
    };

    let url = `https://x.com/i/api/graphql/dQDdKtt882nl-Km98FJGSQ/TweetDetail?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;

    performAsyncGet(url, (resStr) => {
        if (generation !== viewGeneration || currentView !== 'thread') return;
        let parsed = parseTwitterGraphql(resStr);
        if (parsed.error && (!parsed.tweets || !parsed.tweets.length)) {
            let fbUrl = `https://x.com/i/api/graphql/qpemjmVMoTWDvcRT43JIVQ/TweetDetail?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;
            performAsyncGet(fbUrl, (fbStr) => {
                if (generation !== viewGeneration || currentView !== 'thread') return;
                let fbParsed = parseTwitterGraphql(fbStr);
                renderThreadData(tweetId, focal, fbParsed);
            });
            return;
        }
        renderThreadData(tweetId, focal, parsed);
    });
}

function renderThreadData(tweetId, focal, parsed) {
    const repContainer = document.getElementById('repliesContainer');
    if (!repContainer) return;

    if (!focal) {
        let found = parsed.tweets.find(t => t.id === tweetId);
        if (found) {
            focal = found;
            allTweetsMap[tweetId] = focal;
            let threadBox = document.getElementById('threadContainer');
            if (threadBox) {
                let sp = threadBox.querySelector('.spinner');
                if (sp) sp.outerHTML = renderTweetHtml(focal);
            }
        }
    }

    let replies = parsed.tweets.filter(t => t.id !== tweetId);

    if (replies.length > 0) {
        repContainer.innerHTML = '<div style="padding:12px 16px; font-size:14px; font-weight:700; color:var(--text-muted); border-bottom:1px solid var(--border);">Replies (' + replies.length + ')</div>' + replies.map(renderTweetHtml).join('');
    } else if (parsed.error) {
        repContainer.innerHTML = `<div class="card"><div class="card-title" style="color:var(--red);">Error</div><p class="card-desc">${escapeHtml(parsed.error)}</p></div>`;
    } else {
        repContainer.innerHTML = '<div style="padding:28px 16px; text-align:center; color:var(--text-muted); font-size:14px;">No replies yet</div>';
    }
}

function goBackToFeed() {
    if (window.history.state && window.history.state.view === 'thread') {
        window.history.back();
    } else {
        restoreFeedView(currentFeedOrigin, threadOriginView === 'feed');
    }
}

function restoreFeedView(targetTab, fromThread = false) {
    activeThreadTweetId = null;
    currentView = 'feed';
    viewGeneration++;
    currentTab = targetTab || currentTab || 'following';
    const tabNav = document.getElementById('tabNav');
    if (tabNav) tabNav.style.display = 'flex';
    document.querySelectorAll('.nav-tab').forEach((el, idx) => {
        el.classList.toggle('active', ['following', 'foryou', 'cache'][idx] === currentTab);
    });
    if (window.location.hash.startsWith('#thread-')) {
        try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch(e){}
    }
    if (fromThread && savedFeedMarkup && savedFeedTab === currentTab && savedFeedMarkup.includes('id="feedContainer"') && currentTab !== 'cache') {
        const scrollY = savedFeedScrollY;
        const container = document.getElementById('mainContent');
        if (savedFeedNodes && savedFeedNodes.firstChild) {
            container.innerHTML = '';
            container.appendChild(savedFeedNodes);
        } else {
            container.innerHTML = savedFeedMarkup;
        }
        syncVisibleTweetActions();
        if (savedFeedRequestInterrupted) {
            setFeedProgress(false, 'Loading interrupted. Tap Refresh to retry.');
            const loadMoreButton = document.querySelector('#loadMoreBox button');
            if (loadMoreButton) {
                loadMoreButton.disabled = false;
                loadMoreButton.textContent = 'Load More';
            }
        }
        savedFeedMarkup = '';
        savedFeedNodes = null;
        savedFeedRequestInterrupted = false;
        restoreScrollPosition(scrollY);
        return;
    }
    const cacheScrollY = fromThread && currentTab === 'cache' ? savedFeedScrollY : null;
    savedFeedMarkup = '';
    savedFeedNodes = null;
    loadFeed(currentTab);
    if (cacheScrollY !== null) restoreScrollPosition(cacheScrollY);
}

// History stack back navigation
window.onpopstate = function(e) {
    if (e.state && e.state.view === 'thread') {
        currentView = 'thread';
        viewGeneration++;
        renderThreadView(e.state.id);
    } else if (currentView === 'thread' && threadOriginView === 'search' && savedSearchMarkup) {
        activeThreadTweetId = null;
        currentView = 'search';
        viewGeneration++;
        document.getElementById('mainContent').innerHTML = savedSearchMarkup;
        syncVisibleTweetActions();
        document.getElementById('tabNav').style.display = 'none';
        document.querySelectorAll('.bottom-item').forEach((el, idx) => {

        });
        restoreScrollPosition(savedSearchScrollY);
    } else {
        let origin = (e.state && e.state.originTab) ? e.state.originTab : currentFeedOrigin || currentTab;
        restoreFeedView(origin, currentView === 'thread' && threadOriginView === 'feed');
    }
};

function prepareXTransaction(done) {
    if (!window.AndroidBridge) {
        done('Native bridge unavailable');
        return;
    }
    if (searchTransactionClient && Date.now() - searchTransactionFetchedAt < 15 * 60 * 1000) {
        done(null);
        return;
    }
    searchTransactionWaiters.push(done);
    if (searchTransactionLoading) return;
    searchTransactionLoading = true;

    function finish(error) {
        searchTransactionLoading = false;
        const waiters = searchTransactionWaiters.splice(0);
        waiters.forEach(waiter => waiter(error));
    }
    performAsyncGet('https://x.com/home', (html) => {
        if (!html || !html.includes('twitter-site-verification')) {
            finish('Could not prepare X session. Check your connection and account cookies.');
            return;
        }
        const chunk = html.match(/,(\d+):"ondemand\.s"/);
        const hash = chunk && html.match(new RegExp(',' + chunk[1] + ':"([0-9a-f]+)"'));
        if (!hash) {
            finish('X changed its session setup. Please check for an app update.');
            return;
        }
        const scriptUrl = 'https://abs.twimg.com/responsive-web/client-web/ondemand.s.' + hash[1] + 'a.js';
        performAsyncGet(scriptUrl, (script) => {
            try {
                searchTransactionClient = new XClientTransaction.ClientTransaction(html, script);
                searchTransactionClient.homePageResponse = '';
                searchTransactionClient.ondemandFileResponse = '';
                searchTransactionFetchedAt = Date.now();
                finish(null);
            } catch (e) {
                finish('X changed its session setup. Please check for an app update.');
            }
        });
    });
}

function prepareSearchTransaction(done) {
    if (!window.AndroidBridge || typeof AndroidBridge.executeSearchGetAsync !== 'function') {
        done('Install the v1.0.6 APK to enable search.');
        return;
    }
    prepareXTransaction((error) => {
        if (error && error.includes('X session')) done('Could not prepare X search. Check your connection and account cookies.');
        else if (error && error.includes('session setup')) done('X changed its search setup. Please check for an app update.');
        else done(error);
    });
}

function executeSearch(e) {
    if (e && e.preventDefault) e.preventDefault();
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;
    lastSearchQuery = q;
    const generation = ++viewGeneration;
    const resDiv = document.getElementById('searchResults');
    resDiv.innerHTML = '<div class="spinner">Searching...</div>';
    searchState = { query: q, cursor: null, usedCursors: new Set(), seenIds: new Set(), queryId: null, loading: false };
    const moreBox = document.getElementById('searchLoadMoreBox');
    if (moreBox) moreBox.innerHTML = '';
    fetchSearchPage(generation, null);
}

function loadMoreSearch() {
    if (!searchState || !searchState.cursor || searchState.loading || currentView !== 'search') return;
    fetchSearchPage(viewGeneration, searchState.cursor);
}

function renderSearchLoadMore(message) {
    const box = document.getElementById('searchLoadMoreBox');
    if (!box || !searchState) return;
    if (!searchState.cursor && !message) { box.innerHTML = ''; return; }
    box.innerHTML = `<div class="load-more-box">
        ${message ? `<p class="card-desc" role="alert" style="margin-bottom:10px;">${escapeHtml(message)}</p>` : ''}
        <button type="button" class="btn btn-secondary btn-block" onclick="loadMoreSearch()" ${searchState.loading ? 'disabled' : ''}>
            ${searchState.loading ? 'Loading...' : message ? 'Retry Load More' : 'Load More'}
        </button>
    </div>`;
}

function fetchSearchPage(generation, cursor) {
    if (!searchState || searchState.loading || generation !== viewGeneration || currentView !== 'search') return;
    const state = searchState;
    const q = state.query;
    const isPaging = !!cursor;
    const resDiv = document.getElementById('searchResults');
    const btn = document.getElementById('searchBtn');
    state.loading = true;
    if (btn) btn.disabled = true;
    if (isPaging) renderSearchLoadMore();

    let variables = {
        rawQuery: q,
        count: 8,
        querySource: 'typed_query',
        product: 'Top'
    };
    if (cursor) variables.cursor = cursor;

    // Query IDs rotate. The first ID was verified against X's current web client.
    const queryIds = [state.queryId, 'vLHjqbDv7TPFMBkIIO1nOA', 'GcXk9vN_d1jUfHNqLacXQA'].filter((id, i, all) => id && all.indexOf(id) === i);
    let lastError = '';
    function showUnavailable(message) {
        if (generation !== viewGeneration || state !== searchState || currentView !== 'search') return;
        state.loading = false;
        if (btn) btn.disabled = false;
        if (isPaging) renderSearchLoadMore(message);
        else resDiv.innerHTML = `<div class="card"><div class="card-title" style="color:var(--red);">Search unavailable</div><p class="card-desc">${escapeHtml(message)}</p><button type="button" class="btn btn-secondary" onclick="openSearchInX()">Open X search (uses more data)</button></div>`;
    }
    function handleResponse(response, index, retry) {
        if (generation !== viewGeneration || state !== searchState || currentView !== 'search') return;
        const parsed = parseTwitterGraphql(response);
        if (parsed.error) {
            lastError = parsed.error;
            if (isQueryIdFailure(parsed)) retry(index + 1);
            else showUnavailable(lastError);
            return;
        }
        state.loading = false;
        state.queryId = queryIds[index];
        if (cursor) state.usedCursors.add(cursor);
        const freshTweets = parsed.tweets.filter(tweet => !state.seenIds.has(tweet.id));
        freshTweets.forEach(tweet => {
            state.seenIds.add(tweet.id);
            allTweetsMap[tweet.id] = tweet;
        });
        const next = parsed.nextCursor;
        state.cursor = next && next !== cursor && !state.usedCursors.has(next) ? next : null;
        if (btn) btn.disabled = false;
        if (isPaging) {
            currentTweetsList.push(...freshTweets);
            resDiv.insertAdjacentHTML('beforeend', freshTweets.map(renderTweetHtml).join(''));
        } else {
            renderSearchResults(q, freshTweets, resDiv);
        }
        renderSearchLoadMore();
    }
    function tryPostQuery(index) {
        if (generation !== viewGeneration || state !== searchState || currentView !== 'search') return;
        if (index >= queryIds.length) {
            showUnavailable(lastError || 'X changed its search endpoint. Please try again later.');
            return;
        }
        const path = `/i/api/graphql/${queryIds[index]}/SearchTimeline`;
        const body = JSON.stringify({ variables, features: GRAPHQL_FEATURES, queryId: queryIds[index] });
        // The original APK supports POST without X's newer GET transaction header.
        setTimeout(() => {
            if (generation !== viewGeneration || state !== searchState || currentView !== 'search') return;
            let response;
            try {
                response = AndroidBridge.executePost(`https://x.com${path}`, body);
            } catch (e) {
                showUnavailable('Search request failed. Please try again.');
                return;
            }
            handleResponse(response, index, tryPostQuery);
        }, 50);
    }
    function tryQuery(index) {
        if (generation !== viewGeneration || state !== searchState || currentView !== 'search') return;
        if (index >= queryIds.length) {
            showUnavailable(lastError || 'X changed its search endpoint. Please try again later.');
            return;
        }
        const path = `/i/api/graphql/${queryIds[index]}/SearchTimeline`;
        let transactionId;
        try {
            transactionId = searchTransactionClient.generateTransactionId('GET', path);
        } catch (e) {
            showUnavailable('Could not prepare X search. Please try again.');
            return;
        }
        const url = `https://x.com${path}?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;
        performAsyncGet(url, (response) => handleResponse(response, index, tryQuery), transactionId);
    }
    if (window.AndroidBridge && typeof AndroidBridge.executeSearchGetAsync !== 'function' && typeof AndroidBridge.executePost === 'function') {
        tryPostQuery(0);
        return;
    }
    prepareSearchTransaction((error) => {
        if (generation !== viewGeneration || state !== searchState || currentView !== 'search') return;
        if (error) showUnavailable(error);
        else tryQuery(0);
    });
}

function buildTweetVariables(text, replyToId) {
    const variables = {
        tweet_text: text,
        dark_request: false,
        media: {
            media_entities: [],
            possibly_sensitive: false
        },
        semantic_annotation_ids: [],
        disallowed_reply_options: null
    };
    if (replyToId) {
        variables.reply = {
            in_reply_to_tweet_id: String(replyToId),
            exclude_reply_user_ids: []
        };
    }
    return variables;
}

function postReply(e, replyToId) {
    e.preventDefault();
    const input = document.getElementById('replyText');
    const btn = document.getElementById('replyBtn');
    const text = input ? input.value.trim() : '';
    if (!text) return;
    const submitGeneration = viewGeneration;

    if (btn) {
        btn.disabled = true;
        btn.innerHTML = 'Posting...';
    }

    performPostMutation('CreateTweet', buildTweetVariables(text, replyToId), ({ ok, error }) => {
        const stillInThread = submitGeneration === viewGeneration && currentView === 'thread';
        if (!ok || error) {
            if (stillInThread) alert('Reply failed: ' + (error || 'Error'));
            else showStatus('Reply failed: ' + (error || 'Error'), true, 5000);
            if (btn) { btn.disabled = false; btn.innerHTML = 'Reply'; }
            return;
        }
        const parentTweet = findTweetById(replyToId);
        if (parentTweet) {
            parentTweet.replies = (Number(parentTweet.replies) || 0) + 1;
            syncTweetActionState(replyToId);
        }
        showStatus('Reply posted', false, 2500);
        if (stillInThread) {
            if (input) input.value = '';
            renderThreadView(replyToId);
        }
    });
}
