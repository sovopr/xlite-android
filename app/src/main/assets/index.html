<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>𝕏 Lite</title>
<style>
:root {
  --bg: #000000;
  --surface: #121212;
  --surface-hover: #1c1c1f;
  --border: #27272a;
  --text: #f4f4f5;
  --text-muted: #a1a1aa;
  --accent: #1d9bf0;
  --accent-light: #60a5fa;
  --green: #00ba7c;
  --green-bg: rgba(0, 186, 124, 0.15);
  --red: #f91880;
  --yellow: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  padding-bottom: 75px;
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--accent); text-decoration: none; }
.header {
  position: sticky;
  top: 0;
  background: rgba(0, 0, 0, 0.95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 8px; }
.header-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.badge { background: #1e3a5f; color: var(--accent-light); font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 9999px; }
.savings-pill {
  background: rgba(0, 186, 124, 0.15);
  color: var(--green);
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 9999px;
  border: 1px solid rgba(0, 186, 124, 0.3);
}
.header-actions { display: flex; align-items: center; gap: 8px; }
.update-btn {
  background: rgba(29, 155, 240, 0.15);
  border: 1px solid var(--accent);
  color: var(--accent-light);
  font-size: 11px;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: 9999px;
  cursor: pointer;
}
.update-btn:active { background: var(--accent); color: #fff; }
.nav-tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); }
.nav-tab { flex: 1; text-align: center; padding: 12px 6px; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
.nav-tab.active { color: var(--text); border-bottom: 2px solid var(--accent); }

.status-pill {
  padding: 6px 14px;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border-bottom: 1px solid var(--border);
  background: #09090b;
  color: var(--text-muted);
  transition: all 0.2s ease;
}
.status-pill.updating { background: rgba(29, 155, 240, 0.1); color: var(--accent-light); }
.status-pill.success { background: var(--green-bg); color: var(--green); }
.status-pill.warning { background: rgba(245, 158, 11, 0.12); color: var(--yellow); }

.tweet { padding: 12px 14px; border-bottom: 1px solid var(--border); }
.tweet:active { background: rgba(255, 255, 255, 0.02); }
.tweet-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
.tweet-name { font-weight: 700; color: var(--text); }
.tweet-handle { color: var(--text-muted); font-size: 13px; }
.tweet-time { color: var(--text-muted); font-size: 13px; }
.tweet-body { font-size: 15px; word-break: break-word; white-space: pre-wrap; line-height: 1.45; cursor: pointer; }
.tweet-img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; background: #18181b; }
.tweet-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 12px; color: var(--text-muted); }
.tweet-actions-left { display: flex; align-items: center; gap: 18px; }
.tweet-actions-right { display: flex; align-items: center; gap: 14px; }
.action-item { cursor: pointer; display: flex; align-items: center; gap: 4px; }
.action-item:hover { color: var(--accent); }
.retweet-banner { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }

.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.96); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; }
.bottom-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--text-muted); cursor: pointer; }
.bottom-item.active { color: var(--accent); font-weight: 700; }

.btn { display: inline-block; padding: 8px 16px; background: var(--accent); color: #fff; border: none; border-radius: 9999px; font-size: 14px; font-weight: 700; cursor: pointer; text-align: center; }
.btn-block { display: block; width: 100%; }
.btn-secondary { background: #27272a; color: var(--text); }
.btn-secondary:active { background: #3f3f46; }
.form-input, .form-textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
.form-textarea { resize: vertical; min-height: 90px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 14px; }
.card h2 { font-size: 16px; margin-bottom: 8px; }
.alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 12px 14px; margin: 12px 14px; border-radius: 8px; font-size: 13px; }
.spinner { text-align: center; padding: 30px 14px; color: var(--text-muted); font-size: 14px; }
.load-more-box { padding: 14px; text-align: center; }
.profile-card { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px; }
</style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <div class="header-title">
            <span>𝕏 Lite</span>
            <span class="badge">64kbps FUP</span>
        </div>
        <span id="savingsPill" class="savings-pill" title="Data saved vs heavy official app">⚡ 98.4% Saved</span>
    </div>
    <div class="header-actions">
        <button type="button" class="update-btn" onclick="triggerAppUpdate()" title="Check for in-app OTA updates">🔄 Update</button>
        <span id="statusIndicator" style="font-size:11px; color:var(--green);">● Live</span>
    </div>
</div>

<div id="tabNav" class="nav-tabs">
    <div class="nav-tab active" onclick="switchFeed('following')">Following</div>
    <div class="nav-tab" onclick="switchFeed('foryou')">For You</div>
    <div class="nav-tab" onclick="switchFeed('cache')">💾 Offline</div>
</div>

<div id="statusPill" class="status-pill" style="display:none;"></div>

<div id="mainContent">
    <div id="feedContainer"></div>
</div>

<div class="bottom-bar">
    <div class="bottom-item active" onclick="nav('feed')">
        <span>🏠</span>
        <span>Feed</span>
    </div>
    <div class="bottom-item" onclick="nav('search')">
        <span>🔍</span>
        <span>Search</span>
    </div>
    <div class="bottom-item" onclick="nav('post')">
        <span>✍️</span>
        <span>Post</span>
    </div>
    <div class="bottom-item" onclick="nav('settings')">
        <span>⚙️</span>
        <span>Settings</span>
    </div>
</div>

<script>
let currentTab = 'following';
let cursors = { following: null, foryou: null };
let appConfig = { auth_token: '', ct0: '', image_mode: 'tap' };
let currentTweetsList = [];
let isFetching = false;
let pendingCallbacks = {};

// Track data savings stats (inspired by Opera Mini & Twitter Lite)
let dataStats = {
    bytesReceived: 0,
    bytesSaved: 0
};

try {
    let savedStats = localStorage.getItem('xlite_stats');
    if (savedStats) dataStats = JSON.parse(savedStats);
} catch (e) {}

function addDataStats(received, estimatedHeavy) {
    dataStats.bytesReceived += received;
    dataStats.bytesSaved += Math.max(0, estimatedHeavy - received);
    try {
        localStorage.setItem('xlite_stats', JSON.stringify(dataStats));
    } catch(e) {}
    updateSavingsDisplay();
}

function updateSavingsDisplay() {
    const el = document.getElementById('savingsPill');
    if (!el) return;
    let total = dataStats.bytesReceived + dataStats.bytesSaved;
    if (total > 0) {
        let pct = Math.min(99.6, Math.max(90, (dataStats.bytesSaved / total) * 100)).toFixed(1);
        let mbSaved = (dataStats.bytesSaved / (1024 * 1024)).toFixed(1);
        el.innerHTML = `⚡ ${pct}% Saved (${mbSaved} MB)`;
    }
}

const TIMELINE_CONFIG = {
    following: {
        queryId: '2ee46L1AFXmnTa0EvUog-Q',
        op: 'HomeLatestTimeline',
        buildVariables: (count, cursor) => {
            let v = {
                count: count || 12,
                includePromotedContent: false,
                latestControlAvailable: true,
                requestContext: 'launch'
            };
            if (cursor) v.cursor = cursor;
            return v;
        }
    },
    foryou: {
        queryId: 'fedFLLzmiCAuzPgA8lyh8Q',
        op: 'HomeTimeline',
        buildVariables: (count, cursor) => {
            let v = {
                count: count || 12,
                includePromotedContent: false,
                requestContext: 'launch',
                seenTweetIds: []
            };
            if (cursor) v.cursor = cursor;
            return v;
        }
    }
};

const GRAPHQL_FEATURES = {
    responsive_web_graphql_timeline_navigation_enabled: true,
    rweb_video_screen_enabled: false,
    profile_label_improvements_pcf_label_in_post_enabled: true,
    responsive_web_profile_redirect_enabled: false,
    rweb_tipjar_consumption_enabled: false,
    verified_phone_label_enabled: false,
    creator_subscriptions_tweet_preview_api_enabled: true,
    responsive_web_graphql_skip_user_profile_image_extensions_enabled: false,
    communities_web_enable_tweet_community_results_fetch: true,
    c9s_tweet_anatomy_moderator_badge_enabled: true,
    articles_preview_enabled: true,
    responsive_web_edit_tweet_api_enabled: true,
    graphql_is_translatable_rweb_tweet_is_translatable_enabled: true,
    view_counts_everywhere_api_enabled: true,
    longform_notetweets_consumption_enabled: true,
    responsive_web_twitter_article_tweet_consumption_enabled: true,
    tweet_awards_web_tipping_enabled: false,
    creator_subscriptions_quote_tweet_preview_enabled: false,
    freedom_of_speech_not_reach_fetch_enabled: true,
    standardized_nudges_misinfo: true,
    tweet_with_visibility_results_prefer_gql_limited_actions_policy_enabled: true,
    rweb_video_timestamps_enabled: false,
    longform_notetweets_rich_text_read_enabled: true,
    longform_notetweets_inline_media_enabled: true,
    responsive_web_enhance_cards_enabled: false
};

function init() {
    updateSavingsDisplay();
    if (window.AndroidBridge) {
        try {
            appConfig = JSON.parse(AndroidBridge.getCookies());
        } catch (e) {
            console.error(e);
        }
    }
    if (!appConfig.auth_token || !appConfig.ct0) {
        nav('settings');
    } else {
        loadFeed(currentTab);
    }
}

// Global callback dispatcher called from native Android on async completion
window.__onAsyncFinish = function(callbackId) {
    if (pendingCallbacks[callbackId]) {
        let resStr = '';
        if (window.AndroidBridge && AndroidBridge.getCache) {
            resStr = AndroidBridge.getCache('temp_res_' + callbackId);
            AndroidBridge.saveCache('temp_res_' + callbackId, ''); // cleanup
        }
        let cb = pendingCallbacks[callbackId];
        delete pendingCallbacks[callbackId];
        cb(resStr);
    }
};

function performAsyncGet(url, callback) {
    let cbId = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
    pendingCallbacks[cbId] = callback;

    if (window.AndroidBridge && AndroidBridge.executeGetAsync) {
        AndroidBridge.executeGetAsync(url, cbId);
    } else if (window.AndroidBridge && AndroidBridge.executeGet) {
        setTimeout(() => {
            let res = AndroidBridge.executeGet(url);
            window.__onAsyncFinish(cbId, res);
        }, 10);
    } else {
        callback(JSON.stringify({ error: true, message: 'Bridge not available' }));
    }
}

function showStatusPill(text, type, autoHideMs) {
    const pill = document.getElementById('statusPill');
    if (!pill) return;
    if (!text) {
        pill.style.display = 'none';
        return;
    }
    pill.className = 'status-pill ' + (type || '');
    pill.innerHTML = text;
    pill.style.display = 'flex';

    if (autoHideMs) {
        setTimeout(() => {
            if (pill.innerHTML === text) {
                pill.style.display = 'none';
            }
        }, autoHideMs);
    }
}

function nav(view) {
    document.querySelectorAll('.bottom-item').forEach((el, idx) => {
        el.classList.toggle('active', ['feed', 'search', 'post', 'settings'][idx] === view);
    });

    const tabNav = document.getElementById('tabNav');
    tabNav.style.display = (view === 'feed') ? 'flex' : 'none';

    if (view === 'feed') {
        loadFeed(currentTab);
    } else {
        showStatusPill('', '');
        if (view === 'search') renderSearch();
        else if (view === 'post') renderPost();
        else if (view === 'settings') renderSettings();
    }
}

function switchFeed(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-tab').forEach((el, idx) => {
        el.classList.toggle('active', ['following', 'foryou', 'cache'][idx] === tab);
    });
    loadFeed(tab);
}

function escapeHtml(text) {
    if (!text) return '';
    return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function linkify(text) {
    let s = escapeHtml(text);
    s = s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" onclick="event.stopPropagation()">$1</a>');
    s = s.replace(/@([a-zA-Z0-9_]+)/g, '<a href="javascript:searchTag(\'from:$1\')" onclick="event.stopPropagation()">@$1</a>');
    s = s.replace(/#([a-zA-Z0-9_]+)/g, '<a href="javascript:searchTag(\'#$1\')" onclick="event.stopPropagation()">#$1</a>');
    return s;
}

// Bookmarking & Saved Tweets
function getBookmarks() {
    try {
        let b = AndroidBridge ? AndroidBridge.getCache('bookmarks') : localStorage.getItem('bookmarks');
        return b ? JSON.parse(b) : [];
    } catch(e) { return []; }
}

function isBookmarked(id) {
    return getBookmarks().some(t => t.id === id);
}

function toggleBookmark(twId) {
    let list = getBookmarks();
    let idx = list.findIndex(t => t.id === twId);
    let el = document.getElementById('bm-' + twId);
    if (idx >= 0) {
        list.splice(idx, 1);
        if (el) el.innerHTML = '☆ Save';
        showStatusPill('Removed from offline bookmarks', '', 2000);
    } else {
        let tweetObj = currentTweetsList.find(t => t.id === twId);
        if (tweetObj) {
            list.unshift(tweetObj);
            if (el) el.innerHTML = '⭐ Saved';
            showStatusPill('⭐ Saved for offline reading!', 'success', 2500);
        }
    }
    let s = JSON.stringify(list);
    if (window.AndroidBridge) AndroidBridge.saveCache('bookmarks', s);
    else localStorage.setItem('bookmarks', s);
}

function copyTweetLink(screenName, id) {
    let url = 'https://x.com/' + (screenName || 'i') + '/status/' + id;
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => {
            showStatusPill('🔗 Copied link to clipboard!', 'success', 2500);
        }).catch(() => {
            prompt('Copy link:', url);
        });
    } else {
        prompt('Copy link:', url);
    }
}

function renderTweetHtml(tw) {
    let rtHtml = tw.is_retweet
        ? `<div class="retweet-banner">🔁 Retweeted by ${escapeHtml(tw.retweeted_by || 'Someone')}</div>`
        : '';

    let mediaHtml = '';
    if (tw.media && tw.media.length > 0) {
        mediaHtml += '<div style="margin-top:8px;" onclick="event.stopPropagation()">';
        tw.media.forEach(m => {
            if (appConfig.image_mode === 'auto') {
                mediaHtml += `<img src="https://local.xlite/img?url=${encodeURIComponent(m.url)}&mode=thumb" class="tweet-img" loading="lazy" />`;
            } else if (appConfig.image_mode === 'off') {
                mediaHtml += `<div style="font-size:12px; color:var(--text-muted); margin-top:4px;">[📷 Photo (0 KB mode)]</div>`;
            } else {
                mediaHtml += `
                <div style="margin-top:6px;">
                    <button type="button" class="btn btn-secondary" onclick="loadOnDemandImg(this, '${m.url}')" style="font-size:12px; padding:6px 12px; width:100%;">
                        🖼️ View Image (~3.5 KB)
                    </button>
                </div>`;
            }
        });
        mediaHtml += '</div>';
    }

    let handleHtml = tw.user_screen_name ? `<span class="tweet-handle">@${escapeHtml(tw.user_screen_name)}</span>` : '';
    let timeHtml = tw.created_at ? `<span class="tweet-time">&bull; ${escapeHtml(tw.created_at)}</span>` : '';
    let bookmarked = isBookmarked(tw.id);

    return `
    <div class="tweet" data-id="${escapeHtml(tw.id)}">
        ${rtHtml}
        <div class="tweet-header">
            <span class="tweet-name" onclick="searchTag('from:${escapeHtml(tw.user_screen_name)}'); event.stopPropagation();" style="cursor:pointer;">
                ${escapeHtml(tw.user_name || tw.user_screen_name || '𝕏 User')}
            </span>
            ${handleHtml}
            ${timeHtml}
        </div>
        <div class="tweet-body" onclick="viewThread('${escapeHtml(tw.id)}')">${linkify(tw.text)}</div>
        ${mediaHtml}
        <div class="tweet-actions">
            <div class="tweet-actions-left">
                <span class="action-item" onclick="viewThread('${escapeHtml(tw.id)}')">💬 ${tw.replies || 0}</span>
                <span class="action-item">🔁 ${tw.retweets || 0}</span>
                <span class="action-item">❤️ ${tw.likes || 0}</span>
            </div>
            <div class="tweet-actions-right">
                <span class="action-item" id="bm-${escapeHtml(tw.id)}" onclick="toggleBookmark('${escapeHtml(tw.id)}')">${bookmarked ? '⭐ Saved' : '☆ Save'}</span>
                <span class="action-item" onclick="copyTweetLink('${escapeHtml(tw.user_screen_name)}', '${escapeHtml(tw.id)}')">🔗</span>
            </div>
        </div>
    </div>`;
}

function loadOnDemandImg(btn, url) {
    btn.innerHTML = '⏳ Loading (~3.5 KB)...';
    btn.disabled = true;
    const img = document.createElement('img');
    img.src = 'https://local.xlite/img?url=' + encodeURIComponent(url) + '&mode=thumb';
    img.className = 'tweet-img';
    img.onload = function() {
        addDataStats(3600, 1500000); // 3.6 KB downloaded vs 1.5 MB uncompressed photo!
        const parent = btn.parentElement;
        parent.innerHTML = '';
        parent.appendChild(img);
        const hd = document.createElement('div');
        hd.style = 'text-align:right; font-size:11px; margin-top:2px;';
        hd.innerHTML = `<a href="https://local.xlite/img?url=${encodeURIComponent(url)}&mode=hd" target="_blank" style="color:var(--text-muted);">🔍 HD (~12 KB)</a>`;
        parent.appendChild(hd);
    };
    img.onerror = function() {
        btn.innerHTML = '⚠️ Tap to retry';
        btn.disabled = false;
    };
}

function extractUser(tw) {
    let uRes = tw.core?.user_results?.result || tw.user_results?.result;
    if (!uRes) return { name: '', screen_name: '', avatar: '' };

    if (uRes.__typename === 'UserWithVisibilityResults') {
        uRes = uRes.user || uRes;
    }

    let core = uRes.core || {};
    let legacy = uRes.legacy || {};

    let name = core.name || legacy.name || uRes.name || '';
    let screen_name = core.screen_name || legacy.screen_name || uRes.screen_name || '';
    let avatar = uRes.avatar?.image_url || legacy.profile_image_url_https || '';

    return { name, screen_name, avatar };
}

function parseTwitterGraphql(jsonStr) {
    let data;
    try {
        data = JSON.parse(jsonStr);
    } catch(e) {
        return { tweets: [], error: 'JSON parse error' };
    }

    if (data.errors && data.errors.length > 0) {
        return { tweets: [], error: data.errors[0]?.message || 'GraphQL Error' };
    }
    if (data.error) {
        return { tweets: [], error: data.message || 'Error from Twitter' };
    }

    let instructions = 
        data?.data?.home?.home_timeline_urt?.instructions ||
        data?.data?.user?.result?.timeline_v2?.timeline?.instructions ||
        data?.data?.search_by_raw_query?.search_timeline?.timeline?.instructions ||
        data?.data?.threaded_conversation_with_injections_v2?.instructions ||
        [];

    let entries = [];
    instructions.forEach(ins => {
        if (ins.type === 'TimelineAddEntries') entries.push(...(ins.entries || []));
        if (ins.type === 'TimelineAddToModule') entries.push(...(ins.moduleItems || []));
    });

    let tweets = [];
    let nextCursor = null;

    entries.forEach(entry => {
        let content = entry.content || {};
        if (content.entryType === 'TimelineTimelineCursor' && content.cursorType === 'Bottom') {
            nextCursor = content.value;
        }

        let item = content.itemContent;
        if (item && item.itemType === 'TimelineTweet') {
            let res = item.tweet_results?.result;
            if (res) {
                let parsed = parseSingleTweet(res);
                if (parsed) tweets.push(parsed);
            }
        }

        // Support conversation / thread items
        let subItems = content.items || [];
        subItems.forEach(sub => {
            let sItem = sub.item?.itemContent;
            if (sItem && sItem.itemType === 'TimelineTweet') {
                let sRes = sItem.tweet_results?.result;
                if (sRes) {
                    let parsed = parseSingleTweet(sRes);
                    if (parsed) tweets.push(parsed);
                }
            }
        });
    });

    return { tweets, nextCursor };
}

function parseSingleTweet(tw) {
    if (tw.__typename === 'TweetWithVisibilityResults') tw = tw.tweet || {};
    let legacy = tw.legacy || {};
    let id = legacy.id_str || tw.rest_id;
    if (!id) return null;

    let isRetweet = false;
    let retweetedBy = null;
    if (legacy.retweeted_status_result) {
        let orig = legacy.retweeted_status_result.result;
        if (orig) {
            let p = parseSingleTweet(orig);
            if (p) {
                p.is_retweet = true;
                let retweeter = extractUser(tw);
                p.retweeted_by = retweeter.name || retweeter.screen_name || 'Someone';
                return p;
            }
        }
    }

    let text = tw.note_tweet?.note_tweet_results?.result?.text || legacy.full_text || '';
    text = text.replace(/https?:\/\/t\.co\/\S+$/, '').trim();

    let user = extractUser(tw);

    let media = [];
    let extMedia = legacy.extended_entities?.media || [];
    extMedia.forEach(m => {
        if (m.media_url_https) {
            media.push({ url: m.media_url_https, type: m.type });
        }
    });

    return {
        id,
        text,
        user_name: user.name,
        user_screen_name: user.screen_name,
        created_at: legacy.created_at ? new Date(legacy.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '',
        likes: legacy.favorite_count || 0,
        retweets: legacy.retweet_count || 0,
        replies: legacy.reply_count || 0,
        media,
        is_retweet: isRetweet,
        retweeted_by: retweetedBy
    };
}

function loadFeed(feedType) {
    const container = document.getElementById('mainContent');

    if (feedType === 'cache') {
        showStatusPill('💾 Viewing offline cached tweets & bookmarks', '', 0);
        let bookmarks = getBookmarks();
        let cached = AndroidBridge ? AndroidBridge.getCache('feed_cache') : '';
        let cachedList = [];
        try { if (cached) cachedList = JSON.parse(cached); } catch(e){}

        if (bookmarks.length === 0 && cachedList.length === 0) {
            container.innerHTML = '<div class="card"><h2>No Saved Tweets</h2><p style="color:var(--text-muted); font-size:13px;">Tap ☆ Save on any tweet or browse feeds to save offline.</p></div>';
            return;
        }

        let out = '';
        if (bookmarks.length > 0) {
            out += '<div style="padding:10px 14px; font-weight:700; font-size:13px; color:var(--accent-light); border-bottom:1px solid var(--border);">⭐ Bookmarked Tweets (' + bookmarks.length + '):</div>';
            out += bookmarks.map(renderTweetHtml).join('');
        }
        if (cachedList.length > 0) {
            out += '<div style="padding:10px 14px; font-weight:700; font-size:13px; color:var(--text-muted); border-bottom:1px solid var(--border);">Recent Offline Feed:</div>';
            out += cachedList.map(renderTweetHtml).join('');
        }
        container.innerHTML = '<div id="feedContainer">' + out + '</div>';
        return;
    }

    // --- STALE-WHILE-REVALIDATE (Instant Load) ---
    let cachedFeed = '';
    if (window.AndroidBridge) {
        cachedFeed = AndroidBridge.getCache('feed_' + feedType);
    }

    let hasCached = false;
    if (cachedFeed) {
        try {
            let list = JSON.parse(cachedFeed);
            if (list && list.length > 0) {
                currentTweetsList = list;
                container.innerHTML = '<div id="feedContainer">' + list.map(renderTweetHtml).join('') + '</div>';
                hasCached = true;
                showStatusPill('⚡ Updating in background (~3.5 KB)...', 'updating');
            }
        } catch (e) {}
    }

    if (!hasCached) {
        container.innerHTML = '<div class="spinner">⚡ Fetching feed over 64kbps (~3.5 KB)...</div>';
        showStatusPill('⚡ Fetching feed over 64kbps...', 'updating');
    }

    fetchFeedData(feedType, false);
}

function fetchFeedData(feedType, isPaging) {
    if (isFetching) return;
    isFetching = true;

    const cfg = TIMELINE_CONFIG[feedType];
    if (!cfg) {
        isFetching = false;
        return;
    }

    let cursor = isPaging ? cursors[feedType] : null;
    let variables = cfg.buildVariables(12, cursor);

    let url = `https://x.com/i/api/graphql/${cfg.queryId}/${cfg.op}?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;

    performAsyncGet(url, (resStr) => {
        isFetching = false;
        addDataStats(resStr ? resStr.length : 3500, 2500000); // 3.5 KB vs 2.5 MB heavy client!
        let parsed = parseTwitterGraphql(resStr);

        const container = document.getElementById('mainContent');

        if (parsed.error) {
            let cachedFeed = AndroidBridge ? AndroidBridge.getCache('feed_' + feedType) : '';
            if (cachedFeed && !isPaging) {
                showStatusPill(`⚠️ Offline (${escapeHtml(parsed.error)}) &bull; Showing cached`, 'warning', 5000);
            } else {
                showStatusPill('', '');
                container.innerHTML = `
                <div class="alert-error">
                    ⚠️ <strong>Error loading ${feedType}:</strong> ${escapeHtml(parsed.error)}<br><br>
                    <a href="javascript:nav('settings')" style="color:#93c5fd; font-size:13px; font-weight:700;">Check Cookies in Settings &rarr;</a>
                </div>`;
            }
            return;
        }

        if (parsed.tweets.length === 0 && !isPaging) {
            showStatusPill('', '');
            container.innerHTML = '<div class="card"><p>No tweets found.</p></div>';
            return;
        }

        cursors[feedType] = parsed.nextCursor;

        if (isPaging) {
            currentTweetsList.push(...parsed.tweets);
            let feedDiv = document.getElementById('feedContainer');
            if (feedDiv) {
                feedDiv.insertAdjacentHTML('beforeend', parsed.tweets.map(renderTweetHtml).join(''));
            }
            showStatusPill('✅ Loaded ' + parsed.tweets.length + ' more tweets', 'success', 2500);
        } else {
            currentTweetsList = parsed.tweets;
            if (window.AndroidBridge) {
                AndroidBridge.saveCache('feed_' + feedType, JSON.stringify(parsed.tweets));
                AndroidBridge.saveCache('feed_cache', JSON.stringify(parsed.tweets));
            }
            container.innerHTML = '<div id="feedContainer">' + parsed.tweets.map(renderTweetHtml).join('') + '</div>';
            showStatusPill('✅ Updated just now', 'success', 2500);
        }

        renderLoadMoreButton(feedType);
    });
}

function renderLoadMoreButton(feedType) {
    let oldBtn = document.getElementById('loadMoreBox');
    if (oldBtn) oldBtn.remove();

    if (cursors[feedType]) {
        const loadMoreHtml = `
        <div id="loadMoreBox" class="load-more-box">
            <button type="button" class="btn btn-secondary btn-block" onclick="loadMoreTweets('${feedType}')" style="padding:10px;">
                📥 Load Next 12 Tweets (~3.5 KB)
            </button>
        </div>`;
        const container = document.getElementById('mainContent');
        container.insertAdjacentHTML('beforeend', loadMoreHtml);
    }
}

function loadMoreTweets(feedType) {
    const btn = document.querySelector('#loadMoreBox button');
    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '⏳ Loading next tweets (~3.5 KB)...';
    }
    fetchFeedData(feedType, true);
}

// Conversation / Thread View
function viewThread(tweetId) {
    history.pushState({ view: 'thread', id: tweetId }, '', '#thread-' + tweetId);
    renderThreadView(tweetId);
}

function renderThreadView(tweetId) {
    const tabNav = document.getElementById('tabNav');
    if (tabNav) tabNav.style.display = 'none';

    const container = document.getElementById('mainContent');
    container.innerHTML = `
    <div style="padding:10px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px;">
        <button type="button" class="btn btn-secondary" onclick="window.history.back()" style="padding:4px 10px; font-size:12px;">&larr; Back</button>
        <span style="font-weight:700; font-size:14px;">Conversation Thread</span>
    </div>
    <div id="threadContainer">
        <div class="spinner">⚡ Loading replies over 64kbps (~4 KB)...</div>
    </div>`;

    let cachedFocal = currentTweetsList.find(t => t.id === tweetId);

    let url = `https://x.com/i/api/graphql/qpemjmVMoTWDvcRT43JIVQ/TweetDetail?variables=${encodeURIComponent(JSON.stringify({focalTweetId: tweetId, with_rux_injections: false, rankingMode: "Relevance", includePromotedContent: false, withCommunity: true}))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;

    performAsyncGet(url, (resStr) => {
        let parsed = parseTwitterGraphql(resStr);
        const threadBox = document.getElementById('threadContainer');
        if (!threadBox) return;

        let focal = parsed.tweets.find(t => t.id === tweetId) || cachedFocal;
        let replies = parsed.tweets.filter(t => t.id !== tweetId);

        let out = '';
        if (focal) {
            out += renderTweetHtml(focal);
        }

        out += `
        <div class="card" style="margin:12px 14px; padding:12px;">
            <form onsubmit="postReply(event, '${escapeHtml(tweetId)}')">
                <textarea id="replyText" class="form-textarea" placeholder="Post your reply..." style="min-height:60px; margin-bottom:8px;" required></textarea>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:11px; color:var(--text-muted);">Tiny ~150B payload</span>
                    <button type="submit" class="btn" style="padding:6px 14px; font-size:13px;">Reply</button>
                </div>
            </form>
        </div>`;

        if (replies.length > 0) {
            out += '<div style="padding:8px 14px; font-size:12px; font-weight:700; color:var(--text-muted); border-bottom:1px solid var(--border);">Replies (' + replies.length + '):</div>';
            out += replies.map(renderTweetHtml).join('');
        } else {
            out += '<div style="padding:20px 14px; text-align:center; color:var(--text-muted); font-size:13px;">No replies yet.</div>';
        }

        threadBox.innerHTML = out;
    });
}

function postReply(e, replyToId) {
    e.preventDefault();
    const text = document.getElementById('replyText').value.trim();
    if (!text) return;

    let payload = JSON.stringify({
        variables: {
            tweet_text: text,
            reply: { in_reply_to_tweet_id: replyToId },
            dark_request: false,
            media: { media_entities: [], possibly_sensitive: false }
        },
        features: {},
        queryId: "SoVnXZKRa69q3K9Q6gzTSw"
    });

    if (window.AndroidBridge && AndroidBridge.executePost) {
        AndroidBridge.executePost("https://x.com/i/api/graphql/SoVnXZKRa69q3K9Q6gzTSw/CreateTweet", payload);
        alert("Reply submitted!");
        document.getElementById('replyText').value = '';
        renderThreadView(replyToId);
    }
}

function renderSearch() {
    const container = document.getElementById('mainContent');
    container.innerHTML = `
    <div style="padding:14px; border-bottom:1px solid var(--border);">
        <form onsubmit="executeSearch(event)" style="display:flex; gap:8px;">
            <input type="text" id="searchInput" class="form-input" placeholder="Search keywords, #hashtags, from:user..." style="margin-bottom:0;" required>
            <button type="submit" class="btn">Search</button>
        </form>
    </div>
    <div id="searchResults"></div>`;
}

function searchTag(tag) {
    nav('search');
    setTimeout(() => {
        let input = document.getElementById('searchInput');
        if (input) {
            input.value = tag;
            executeSearch(new Event('submit'));
        }
    }, 50);
}

function executeSearch(e) {
    if (e && e.preventDefault) e.preventDefault();
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;

    const resDiv = document.getElementById('searchResults');
    resDiv.innerHTML = '<div class="spinner">Searching Twitter (~4 KB)...</div>';

    let url = `https://x.com/i/api/graphql/vLHjqbDv7TPFMBkIIO1nOA/SearchTimeline?variables=${encodeURIComponent(JSON.stringify({rawQuery: q, count: 15, querySource: 'typed_query'}))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;

    performAsyncGet(url, (resStr) => {
        addDataStats(resStr ? resStr.length : 4000, 2000000);
        let parsed = parseTwitterGraphql(resStr);
        if (parsed.error) {
            resDiv.innerHTML = `<div class="alert-error">${escapeHtml(parsed.error)}</div>`;
        } else if (parsed.tweets.length === 0) {
            resDiv.innerHTML = `<div class="card"><p>No results found for "${escapeHtml(q)}"</p></div>`;
        } else {
            currentTweetsList = parsed.tweets;
            let header = '';
            if (q.startsWith('from:')) {
                let user = q.replace('from:', '');
                header = `
                <div class="profile-card">
                    <h2 style="font-size:16px;">@${escapeHtml(user)}</h2>
                    <p style="font-size:12px; color:var(--text-muted);">Recent tweets &bull; Low data mode</p>
                </div>`;
            }
            resDiv.innerHTML = header + parsed.tweets.map(renderTweetHtml).join('');
        }
    });
}

// In-app hot updater
function triggerAppUpdate() {
    showStatusPill('⏳ Checking repo for updates (~5 KB)...', 'updating');
    const statusText = document.getElementById('updateStatusText');
    if (statusText) statusText.innerHTML = '⏳ Downloading latest code from GitHub...';

    const updateUrl = 'https://gist.githubusercontent.com/sovopr/c52e8a1490b3a5415525b27063726bbe/raw/index.html?t=' + Date.now();

    performAsyncGet(updateUrl, (html) => {
        if (!html || html.length < 500 || !html.includes('<!DOCTYPE html>') || !html.includes('mainContent')) {
            const fallbackUrl = 'https://raw.githubusercontent.com/sovopr/xlite-android/main/app/src/main/assets/index.html?t=' + Date.now();
            performAsyncGet(fallbackUrl, (fbHtml) => {
                if (fbHtml && fbHtml.length > 500 && fbHtml.includes('<!DOCTYPE html>')) {
                    applyUpdate(fbHtml);
                } else {
                    showStatusPill('❌ Update check failed (network slow or offline)', 'warning', 4000);
                    if (statusText) statusText.innerHTML = '❌ Could not pull update. Please try again.';
                }
            });
            return;
        }
        applyUpdate(html);
    });
}

function applyUpdate(newHtml) {
    if (window.AndroidBridge && AndroidBridge.saveLiveHtml) {
        let ok = AndroidBridge.saveLiveHtml(newHtml);
        if (ok) {
            showStatusPill('✅ Update installed! Reloading app in 1s...', 'success');
            const statusText = document.getElementById('updateStatusText');
            if (statusText) statusText.innerHTML = '✅ Update installed! Reloading...';
            setTimeout(() => {
                AndroidBridge.reloadApp();
            }, 1000);
        } else {
            showStatusPill('⚠️ Failed to save live update', 'warning', 3000);
        }
    } else {
        alert("Please install v1.0.1 APK to enable in-app hot updates!");
    }
}

function resetToFactoryAsset() {
    if (window.AndroidBridge && AndroidBridge.resetLiveHtml) {
        AndroidBridge.resetLiveHtml();
        alert("Reset to bundled factory version! Reloading...");
        AndroidBridge.reloadApp();
    }
}
