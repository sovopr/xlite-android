<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>𝕏 Lite</title>
<style>
:root {
  --bg: #000000;
  --surface: #121212;
  --border: #27272a;
  --text: #f4f4f5;
  --text-muted: #a1a1aa;
  --accent: #1d9bf0;
  --green: #00ba7c;
  --red: #f91880;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  padding-bottom: 70px;
}
a { color: var(--accent); text-decoration: none; }
.header {
  position: sticky;
  top: 0;
  background: rgba(0,0,0,0.92);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 100;
}
.header-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.badge { background: #1e3a5f; color: #60a5fa; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
.nav-tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); }
.nav-tab { flex: 1; text-align: center; padding: 12px 6px; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
.nav-tab.active { color: var(--text); border-bottom: 2px solid var(--accent); }
.tweet { padding: 12px 14px; border-bottom: 1px solid var(--border); }
.tweet-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
.tweet-name { font-weight: 700; color: var(--text); }
.tweet-handle { color: var(--text-muted); font-size: 13px; }
.tweet-time { color: var(--text-muted); font-size: 13px; }
.tweet-body { font-size: 15px; word-break: break-word; white-space: pre-wrap; }
.tweet-img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; background: #18181b; }
.tweet-actions { display: flex; align-items: center; gap: 18px; margin-top: 8px; font-size: 12px; color: var(--text-muted); }
.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.95); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; }
.bottom-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--text-muted); cursor: pointer; }
.bottom-item.active { color: var(--accent); font-weight: 700; }
.btn { display: inline-block; padding: 8px 16px; background: var(--accent); color: #fff; border: none; border-radius: 9999px; font-size: 14px; font-weight: 700; cursor: pointer; text-align: center; }
.btn-block { display: block; width: 100%; }
.btn-secondary { background: #27272a; color: var(--text); }
.form-input, .form-textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
.form-textarea { resize: vertical; min-height: 90px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 14px; }
.alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 10px 14px; margin: 12px 14px; border-radius: 6px; font-size: 13px; }
.spinner { text-align: center; padding: 20px; color: var(--text-muted); font-size: 14px; }
</style>
</head>
<body>

<div class="header">
    <div class="header-title">
        <span>𝕏 Lite</span>
        <span class="badge">64kbps FUP Mode</span>
    </div>
    <div id="statusIndicator" style="font-size:11px; color:var(--green);">⚡ Standalone</div>
</div>

<div id="tabNav" class="nav-tabs">
    <div class="nav-tab active" onclick="switchFeed('following')">Following</div>
    <div class="nav-tab" onclick="switchFeed('foryou')">For You</div>
    <div class="nav-tab" onclick="switchFeed('cache')">💾 Offline</div>
</div>

<div id="mainContent">
    <div id="feedContainer"></div>
</div>

<div class="bottom-bar">
    <div class="bottom-item active" onclick="nav('feed')">
        <span>🏠</span>
        <span>Feed</span>
    </div>
    <div class="bottom-item" onclick="nav('search')">
        <span>🔍</span>
        <span>Search</span>
    </div>
    <div class="bottom-item" onclick="nav('post')">
        <span>✍️</span>
        <span>Post</span>
    </div>
    <div class="bottom-item" onclick="nav('settings')">
        <span>⚙️</span>
        <span>Settings</span>
    </div>
</div>

<script>
let currentTab = 'following';
let currentCursor = null;
let appConfig = { auth_token: '', ct0: '', image_mode: 'tap' };

function init() {
    if (window.AndroidBridge) {
        try {
            appConfig = JSON.parse(AndroidBridge.getCookies());
        } catch (e) {
            console.error(e);
        }
    }
    if (!appConfig.auth_token || !appConfig.ct0) {
        nav('settings');
    } else {
        loadFeed(currentTab);
    }
}

function nav(view) {
    document.querySelectorAll('.bottom-item').forEach((el, idx) => {
        el.classList.toggle('active', ['feed', 'search', 'post', 'settings'][idx] === view);
    });

    const tabNav = document.getElementById('tabNav');
    tabNav.style.display = (view === 'feed') ? 'flex' : 'none';

    if (view === 'feed') {
        loadFeed(currentTab);
    } else if (view === 'search') {
        renderSearch();
    } else if (view === 'post') {
        renderPost();
    } else if (view === 'settings') {
        renderSettings();
    }
}

function switchFeed(tab) {
    currentTab = tab;
    currentCursor = null;
    document.querySelectorAll('.nav-tab').forEach((el, idx) => {
        el.classList.toggle('active', ['following', 'foryou', 'cache'][idx] === tab);
    });
    loadFeed(tab);
}

function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function linkify(text) {
    let s = escapeHtml(text);
    s = s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
    s = s.replace(/@([a-zA-Z0-9_]+)/g, '<a href="javascript:viewProfile(\'$1\')">@$1</a>');
    s = s.replace(/#([a-zA-Z0-9_]+)/g, '<a href="javascript:searchTag(\'$1\')">#$1</a>');
    return s;
}

function renderTweetHtml(tw) {
    let rtHtml = tw.is_retweet ? `<div style="font-size:12px; color:var(--text-muted); margin-bottom:4px;">🔁 Retweeted by ${escapeHtml(tw.retweeted_by)}</div>` : '';
    
    let mediaHtml = '';
    if (tw.media && tw.media.length > 0) {
        mediaHtml += '<div style="margin-top:8px;">';
        tw.media.forEach(m => {
            if (appConfig.image_mode === 'auto') {
                mediaHtml += `<img src="https://local.xlite/img?url=${encodeURIComponent(m.url)}&mode=thumb" class="tweet-img" loading="lazy" />`;
            } else if (appConfig.image_mode === 'off') {
                mediaHtml += `<div style="font-size:12px; color:var(--text-muted); margin-top:4px;">[📷 Photo (0 KB mode)]</div>`;
            } else {
                mediaHtml += `
                <div style="margin-top:6px;">
                    <button type="button" class="btn btn-secondary" onclick="loadOnDemandImg(this, '${m.url}')" style="font-size:12px; padding:6px 12px; width:100%;">
                        🖼️ View Image (~3.5 KB)
                    </button>
                </div>`;
            }
        });
        mediaHtml += '</div>';
    }

    return `
    <div class="tweet">
        ${rtHtml}
        <div class="tweet-header">
            <span class="tweet-name">${escapeHtml(tw.user_name)}</span>
            <span class="tweet-handle">@${escapeHtml(tw.user_screen_name)}</span>
            <span class="tweet-time">&bull; ${escapeHtml(tw.created_at)}</span>
        </div>
        <div class="tweet-body">${linkify(tw.text)}</div>
        ${mediaHtml}
        <div class="tweet-actions">
            <span>💬 ${tw.replies || 0}</span>
            <span>🔁 ${tw.retweets || 0}</span>
            <span>❤️ ${tw.likes || 0}</span>
        </div>
    </div>`;
}

function loadOnDemandImg(btn, url) {
    btn.innerHTML = '⏳ Loading (~3.5 KB)...';
    btn.disabled = true;
    const img = document.createElement('img');
    img.src = 'https://local.xlite/img?url=' + encodeURIComponent(url) + '&mode=thumb';
    img.className = 'tweet-img';
    img.onload = function() {
        const parent = btn.parentElement;
        parent.innerHTML = '';
        parent.appendChild(img);
        const hd = document.createElement('div');
        hd.style = 'text-align:right; font-size:11px; margin-top:2px;';
        hd.innerHTML = `<a href="https://local.xlite/img?url=${encodeURIComponent(url)}&mode=hd" target="_blank" style="color:var(--text-muted);">🔍 HD</a>`;
        parent.appendChild(hd);
    };
    img.onerror = function() {
        btn.innerHTML = '⚠️ Tap to retry';
        btn.disabled = false;
    };
}

function parseTwitterGraphql(jsonStr) {
    let data;
    try {
        data = JSON.parse(jsonStr);
    } catch(e) {
        return { tweets: [], error: 'JSON parse error' };
    }

    if (data.error) {
        return { tweets: [], error: data.message || 'Error from Twitter' };
    }

    let instructions = 
        data?.data?.home?.home_timeline_urt?.instructions ||
        data?.data?.search_by_raw_query?.search_timeline?.timeline?.instructions ||
        [];

    let entries = [];
    instructions.forEach(ins => {
        if (ins.type === 'TimelineAddEntries') entries.push(...(ins.entries || []));
        if (ins.type === 'TimelineAddToModule') entries.push(...(ins.moduleItems || []));
    });

    let tweets = [];
    let nextCursor = null;

    entries.forEach(entry => {
        let content = entry.content || {};
        if (content.entryType === 'TimelineTimelineCursor' && content.cursorType === 'Bottom') {
            nextCursor = content.value;
        }

        let item = content.itemContent;
        if (item && item.itemType === 'TimelineTweet') {
            let res = item.tweet_results?.result;
            if (res) {
                let parsed = parseSingleTweet(res);
                if (parsed) tweets.push(parsed);
            }
        }
    });

    return { tweets, nextCursor };
}

function parseSingleTweet(tw) {
    if (tw.__typename === 'TweetWithVisibilityResults') tw = tw.tweet || {};
    let legacy = tw.legacy || {};
    let id = legacy.id_str || tw.rest_id;
    if (!id) return null;

    let isRetweet = false;
    let retweetedBy = null;
    if (legacy.retweeted_status_result) {
        let orig = legacy.retweeted_status_result.result;
        if (orig) {
            let p = parseSingleTweet(orig);
            if (p) {
                p.is_retweet = true;
                p.retweeted_by = tw.core?.user_results?.result?.legacy?.name || '';
                return p;
            }
        }
    }

    let text = tw.note_tweet?.note_tweet_results?.result?.text || legacy.full_text || '';
    text = text.replace(/https?:\/\/t\.co\/\S+$/, '').trim();

    let user = tw.core?.user_results?.result?.legacy || {};
    let media = [];
    let extMedia = legacy.extended_entities?.media || [];
    extMedia.forEach(m => {
        if (m.media_url_https) {
            media.push({ url: m.media_url_https, type: m.type });
        }
    });

    return {
        id,
        text,
        user_name: user.name || '',
        user_screen_name: user.screen_name || '',
        created_at: legacy.created_at ? new Date(legacy.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '',
        likes: legacy.favorite_count || 0,
        retweets: legacy.retweet_count || 0,
        replies: legacy.reply_count || 0,
        media,
        is_retweet: isRetweet,
        retweeted_by: retweetedBy
    };
}

function loadFeed(feedType) {
    const container = document.getElementById('mainContent');

    if (feedType === 'cache') {
        let cached = AndroidBridge.getCache('feed_cache');
        if (!cached) {
            container.innerHTML = '<div class="card"><h2>No Cached Tweets</h2><p>Browsed tweets are saved here automatically.</p></div>';
            return;
        }
        let list = JSON.parse(cached);
        container.innerHTML = list.map(renderTweetHtml).join('');
        return;
    }

    container.innerHTML = '<div class="spinner">⚡ Fetching feed over low data...</div>';

    let op = (feedType === 'following') ? 'HomeLatestTimeline' : 'HomeTimeline';
    let url = `https://x.com/i/api/graphql/2ee46L1AFXmnTa0EvUog-Q/${op}?variables=%7B%22count%22%3A25%2C%22includePromotedContent%22%3Afalse%2C%22latestControlAvailable%22%3Atrue%7D&features=%7B%22responsive_web_graphql_timeline_navigation_enabled%22%3Atrue%7D`;

    setTimeout(() => {
        let resStr = AndroidBridge.executeGet(url);
        let parsed = parseTwitterGraphql(resStr);

        if (parsed.error) {
            container.innerHTML = `
            <div class="alert-error">
                ⚠️ <strong>Error loading feed:</strong> ${escapeHtml(parsed.error)}<br>
                <a href="javascript:nav('settings')" style="color:#93c5fd; font-size:12px;">Check Cookies in Settings &rarr;</a>
            </div>`;
            return;
        }

        if (parsed.tweets.length === 0) {
            container.innerHTML = '<div class="card"><p>No tweets found.</p></div>';
            return;
        }

        AndroidBridge.saveCache('feed_cache', JSON.stringify(parsed.tweets));
        container.innerHTML = parsed.tweets.map(renderTweetHtml).join('');
    }, 50);
}

function renderSearch() {
    const container = document.getElementById('mainContent');
    container.innerHTML = `
    <div style="padding:14px; border-bottom:1px solid var(--border);">
        <form onsubmit="executeSearch(event)" style="display:flex; gap:8px;">
            <input type="text" id="searchInput" class="form-input" placeholder="Search keywords, #hashtags..." style="margin-bottom:0;" required>
            <button type="submit" class="btn">Search</button>
        </form>
    </div>
    <div id="searchResults"></div>`;
}

function executeSearch(e) {
    e.preventDefault();
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;

    const resDiv = document.getElementById('searchResults');
    resDiv.innerHTML = '<div class="spinner">Searching...</div>';

    let url = `https://x.com/i/api/graphql/vLHjqbDv7TPFMBkIIO1nOA/SearchTimeline?variables=${encodeURIComponent(JSON.stringify({rawQuery: q, count: 20, querySource: 'typed_query'}))}&features=${encodeURIComponent(JSON.stringify({responsive_web_graphql_timeline_navigation_enabled: true}))}`;

    setTimeout(() => {
        let resStr = AndroidBridge.executeGet(url);
        let parsed = parseTwitterGraphql(resStr);
        if (parsed.error) {
            resDiv.innerHTML = `<div class="alert-error">${escapeHtml(parsed.error)}</div>`;
        } else {
            resDiv.innerHTML = parsed.tweets.map(renderTweetHtml).join('');
        }
    }, 50);
}

function renderPost() {
    const container = document.getElementById('mainContent');
    container.innerHTML = `
    <div class="card">
        <h2>Compose Tweet</h2>
        <form onsubmit="executePostTweet(event)">
            <textarea id="postText" class="form-textarea" placeholder="What is happening?!" maxlength="280" required></textarea>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:12px; color:var(--text-muted);">Tiny ~150B payload</span>
                <button type="submit" class="btn">Post 𝕏</button>
            </div>
        </form>
    </div>`;
}

function executePostTweet(e) {
    e.preventDefault();
    const text = document.getElementById('postText').value.trim();
    if (!text) return;

    let payload = JSON.stringify({
        variables: { tweet_text: text, dark_request: false, media: { media_entities: [], possibly_sensitive: false } },
        features: {},
        queryId: "SoVnXZKRa69q3K9Q6gzTSw"
    });

    let res = AndroidBridge.executePost("https://x.com/i/api/graphql/SoVnXZKRa69q3K9Q6gzTSw/CreateTweet", payload);
    alert("Post submitted!");
    nav('feed');
}

function renderSettings() {
    const container = document.getElementById('mainContent');
    let cookies = { auth_token: '', ct0: '', image_mode: 'tap' };
    if (window.AndroidBridge) {
        try { cookies = JSON.parse(AndroidBridge.getCookies()); } catch(e){}
    }

    container.innerHTML = `
    <div class="card">
        <h2>⚙️ Account Credentials</h2>
        <p>100% On-Phone Compute. Your cookies stay in local Android private storage.</p>
        <form onsubmit="saveSettings(event)">
            <label style="font-size:12px; color:var(--text-muted);">auth_token cookie</label>
            <input type="text" id="cfgAuth" value="${escapeHtml(cookies.auth_token)}" class="form-input" placeholder="Paste auth_token from x.com" required>

            <label style="font-size:12px; color:var(--text-muted);">ct0 (csrf token) cookie</label>
            <input type="text" id="cfgCt0" value="${escapeHtml(cookies.ct0)}" class="form-input" placeholder="Paste ct0 from x.com" required>

            <h3 style="font-size:14px; margin: 12px 0 6px;">Image Mode</h3>
            <div style="font-size:13px; line-height:1.8; margin-bottom:14px;">
                <label style="display:block;">
                    <input type="radio" name="imgMode" value="tap" ${cookies.image_mode === 'tap' ? 'checked' : ''}>
                    <strong>Tap-to-Load (~3.5 KB)</strong> &mdash; Recommended for 64kbps
                </label>
                <label style="display:block;">
                    <input type="radio" name="imgMode" value="auto" ${cookies.image_mode === 'auto' ? 'checked' : ''}>
                    <strong>Auto-load Smart WebP</strong>
                </label>
                <label style="display:block;">
                    <input type="radio" name="imgMode" value="off" ${cookies.image_mode === 'off' ? 'checked' : ''}>
                    <strong>Pure Text Only (0 KB)</strong>
                </label>
            </div>

            <button type="submit" class="btn btn-block">Save Configuration</button>
        </form>
    </div>
    <div class="card">
        <h2>💾 Local Cache</h2>
        <button type="button" class="btn btn-secondary" onclick="AndroidBridge.clearCache(); alert('Cache cleared!');">Clear Stored Tweets</button>
    </div>`;
}

function saveSettings(e) {
    e.preventDefault();
    const auth = document.getElementById('cfgAuth').value.trim();
    const ct0 = document.getElementById('cfgCt0').value.trim();
    const mode = document.querySelector('input[name="imgMode"]:checked').value;

    if (window.AndroidBridge) {
        AndroidBridge.saveConfig(auth, ct0, mode);
        appConfig = { auth_token: auth, ct0: ct0, image_mode: mode };
        alert("Configuration saved!");
        nav('feed');
    }
}

window.onload = init;
</script>
</body>
</html>
