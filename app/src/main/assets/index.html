<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>𝕏 Lite</title>
<style>
:root {
  --bg: #000000;
  --surface: #000000;
  --card: #16181c;
  --border: #2f3336;
  --text: #e7e9ea;
  --text-muted: #71767b;
  --accent: #1d9bf0;
  --accent-hover: #1a8cd8;
  --red: #f4212e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.4;
  padding-bottom: 65px;
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--accent); text-decoration: none; }

/* Clean official header */
.header {
  position: sticky;
  top: 0;
  background: rgba(0, 0, 0, 0.95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  height: 52px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 100;
}
.header-logo {
  font-size: 22px;
  font-weight: 900;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.header-sub {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
}

/* Tabs */
.nav-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.nav-tab {
  flex: 1;
  text-align: center;
  padding: 14px 6px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 3px solid transparent;
}
.nav-tab.active {
  color: var(--text);
  border-bottom: 3px solid var(--accent);
}

/* Subtle status bar */
.status-bar {
  padding: 6px 14px;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--border);
  background: #080808;
  color: var(--text-muted);
}
.status-bar.error {
  color: #fca5a5;
  background: rgba(244, 33, 46, 0.1);
}

/* Tweets */
.tweet {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.tweet:active {
  background: rgba(255, 255, 255, 0.02);
}
.tweet-header {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.tweet-name {
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
}
.tweet-handle {
  color: var(--text-muted);
  font-size: 14px;
}
.tweet-dot {
  color: var(--text-muted);
  font-size: 12px;
}
.tweet-time {
  color: var(--text-muted);
  font-size: 14px;
}
.tweet-body {
  font-size: 15px;
  word-break: break-word;
  white-space: pre-wrap;
  line-height: 1.45;
  cursor: pointer;
}
.tweet-img {
  max-width: 100%;
  border-radius: 12px;
  margin-top: 8px;
  display: block;
  background: #16181c;
  border: 1px solid var(--border);
}
.tweet-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 420px;
  margin-top: 10px;
  font-size: 13px;
  color: var(--text-muted);
}
.tweet-actions-left {
  display: flex;
  align-items: center;
  gap: 22px;
}
.tweet-actions-right {
  display: flex;
  align-items: center;
  gap: 16px;
}
.action-item {
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  user-select: none;
}
.action-item:active {
  color: var(--accent);
}
.retweet-banner {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.quoted-box {
  margin-top: 8px;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.02);
  cursor: pointer;
}
.quoted-box:active {
  background: rgba(255, 255, 255, 0.05);
}

/* Bottom Bar */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 52px;
  background: rgba(0, 0, 0, 0.98);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}
.bottom-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 11px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px 12px;
}
.bottom-item.active {
  color: var(--text);
  font-weight: 700;
}
.bottom-icon {
  font-size: 18px;
  line-height: 1.2;
}

/* Buttons and Inputs */
.btn {
  display: inline-block;
  padding: 8px 18px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 9999px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
}
.btn:active {
  background: var(--accent-hover);
}
.btn-block {
  display: block;
  width: 100%;
}
.btn-secondary {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:active {
  background: #16181c;
}
.form-input, .form-textarea {
  width: 100%;
  background: #16181c;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px;
  border-radius: 8px;
  font-size: 15px;
  margin-bottom: 12px;
  font-family: inherit;
}
.form-input:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.form-textarea {
  resize: vertical;
  min-height: 90px;
}

/* Clean cards for Settings */
.card {
  border-bottom: 1px solid var(--border);
  padding: 16px;
}
.card-title {
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 6px;
}
.card-desc {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 14px;
  line-height: 1.4;
}
.spinner {
  text-align: center;
  padding: 36px 16px;
  color: var(--text-muted);
  font-size: 14px;
}
.load-more-box {
  padding: 16px;
  text-align: center;
}
.sub-header {
  height: 48px;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 16px;
  font-weight: 700;
}
.back-btn {
  background: none;
  border: none;
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 9999px;
}
</style>
</head>
<body>

<div class="header">
    <div class="header-logo">
        <span>𝕏</span>
        <span class="header-sub">Lite</span>
    </div>
</div>

<div id="tabNav" class="nav-tabs">
    <div class="nav-tab active" onclick="switchFeed('following')">Following</div>
    <div class="nav-tab" onclick="switchFeed('foryou')">For You</div>
    <div class="nav-tab" onclick="switchFeed('cache')">Offline</div>
</div>

<div id="statusBar" class="status-bar" style="display:none;"></div>

<div id="mainContent">
    <div id="feedContainer"></div>
</div>

<div class="bottom-bar">
    <div class="bottom-item active" onclick="nav('feed')">
        <span class="bottom-icon">⌂</span>
        <span>Home</span>
    </div>
    <div class="bottom-item" onclick="nav('search')">
        <span class="bottom-icon">⚲</span>
        <span>Search</span>
    </div>
    <div class="bottom-item" onclick="nav('post')">
        <span class="bottom-icon">✎</span>
        <span>Post</span>
    </div>
    <div class="bottom-item" onclick="nav('settings')">
        <span class="bottom-icon">⚙</span>
        <span>Settings</span>
    </div>
</div>

// Global callback dispatcher for native Android async requests
window.__onAsyncFinish = function(callbackId, directResult) {
    if (pendingCallbacks[callbackId]) {
        let resStr = '';
        if (directResult !== undefined) {
            resStr = directResult;
        } else if (window.AndroidBridge && AndroidBridge.getCache) {
            resStr = AndroidBridge.getCache('temp_res_' + callbackId);
            AndroidBridge.saveCache('temp_res_' + callbackId, '');
        }
        let cb = pendingCallbacks[callbackId];
        delete pendingCallbacks[callbackId];
        try {
            cb(resStr);
        } catch(err) {
            console.error("Callback error:", err);
        }
    }
};

function performAsyncGet(url, callback, transactionId) {
    let cbId = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
    pendingCallbacks[cbId] = callback;

    if (transactionId) {
        if (window.AndroidBridge && typeof AndroidBridge.executeSearchGetAsync === 'function') {
            AndroidBridge.executeSearchGetAsync(url, transactionId, cbId);
        } else {
            window.__onAsyncFinish(cbId, JSON.stringify({ error: true, message: 'Install the v1.0.6 APK to enable search.' }));
        }
    } else if (window.AndroidBridge && AndroidBridge.executeGetAsync) {
        AndroidBridge.executeGetAsync(url, cbId);
    } else if (window.AndroidBridge && AndroidBridge.executeGet) {
        setTimeout(() => {
            let res = AndroidBridge.executeGet(url);
            window.__onAsyncFinish(cbId, res);
        }, 10);
    } else {
        // Fallback to native browser fetch
        fetch(url)
            .then(r => r.text())
            .then(txt => window.__onAsyncFinish(cbId, txt))
            .catch(err => window.__onAsyncFinish(cbId, JSON.stringify({ error: true, message: err.message })));
    }
}

function showStatus(text, isError, autoHideMs) {
    const bar = document.getElementById('statusBar');
    if (!bar) return;
    if (!text) {
        bar.style.display = 'none';
        bar.innerHTML = '';
        return;
    }
    bar.className = 'status-bar' + (isError ? ' error' : '');
    bar.textContent = text;
    bar.style.display = 'flex';

    if (autoHideMs) {
        setTimeout(() => {
            if (bar.textContent === text) {
                bar.style.display = 'none';
                bar.innerHTML = '';
            }
        }, autoHideMs);
    }
}

function escapeHtml(text) {
    if (!text) return '';
    return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function linkify(text) {
    const source = String(text || '');
    const matcher = /https?:\/\/[^\s<>"']+|@[a-zA-Z0-9_]+|#[a-zA-Z0-9_]+/g;
    let result = '';
    let offset = 0;
    for (const match of source.matchAll(matcher)) {
        result += escapeHtml(source.slice(offset, match.index));
        const token = match[0];
        if (token.startsWith('http')) {
            result += `<a href="${escapeHtml(token)}" onclick="event.stopPropagation()">${escapeHtml(token)}</a>`;
        } else {
            const query = token[0] === '@' ? 'from:' + token.slice(1) : token;
            result += `<a href="javascript:searchTag('${query}')" onclick="event.stopPropagation()">${escapeHtml(token)}</a>`;
        }
        offset = match.index + token.length;
    }
    return result + escapeHtml(source.slice(offset));
}

function getBookmarks() {
    try {
        let b = window.AndroidBridge ? AndroidBridge.getCache('bookmarks') : localStorage.getItem('bookmarks');
        return b ? JSON.parse(b) : [];
    } catch(e) { return []; }
}

function isBookmarked(id) {
    return getBookmarks().some(t => t.id === id);
}

function toggleBookmark(twId) {
    let list = getBookmarks();
    let idx = list.findIndex(t => t.id === twId);
    let el = document.getElementById('bm-' + twId);
    if (idx >= 0) {
        list.splice(idx, 1);
        if (el) el.innerHTML = '☆ Save';
        showStatus('Removed from offline saved', false, 2000);
    } else {
        let tweetObj = allTweetsMap[twId] || currentTweetsList.find(t => t.id === twId);
        if (tweetObj) {
            list.unshift(tweetObj);
            if (el) el.innerHTML = '★ Saved';
            showStatus('Saved for offline reading', false, 2000);
        }
    }
    let s = JSON.stringify(list);
    if (window.AndroidBridge) AndroidBridge.saveCache('bookmarks', s);
    else localStorage.setItem('bookmarks', s);
}

function extractUser(tw) {
    let uRes = tw.core?.user_results?.result || tw.user_results?.result || tw.user;
    if (!uRes) return { name: '', screen_name: '', avatar: '' };

    if (uRes.__typename === 'UserWithVisibilityResults') {
        uRes = uRes.user || uRes;
    }

    let core = uRes.core || {};
    let legacy = uRes.legacy || {};

    let name = core.name || legacy.name || uRes.name || '';
    let screen_name = core.screen_name || legacy.screen_name || uRes.screen_name || '';
    let avatar = uRes.avatar?.image_url || legacy.profile_image_url_https || uRes.profile_image_url_https || '';

    return { name, screen_name, avatar };
}

function findInstructions(obj) {
    if (!obj || typeof obj !== 'object') return null;
    if (Array.isArray(obj.instructions)) return obj.instructions;
    for (let k in obj) {
        if (obj[k] && typeof obj[k] === 'object') {
            let found = findInstructions(obj[k]);
            if (found) return found;
        }
    }
    return null;
}

function parseTwitterGraphql(jsonStr) {
    let data;
    try {
        data = JSON.parse(jsonStr);
    } catch(e) {
        return { tweets: [], error: 'JSON parse error' };
    }

    if (data.errors && data.errors.length > 0 && !data.data) {
        return { tweets: [], error: data.errors[0]?.message || 'GraphQL Error', status: data.status };
    }
    if (data.error && !data.statuses && !data.globalObjects) {
        return { tweets: [], error: data.message || 'Error from Twitter', status: data.status };
    }

    // Direct REST v1.1 search format: { statuses: [...] }
    if (Array.isArray(data.statuses)) {
        let tweets = [];
        data.statuses.forEach(st => {
            let p = parseSingleTweet(st);
            if (p) tweets.push(p);
        });
        return { tweets, nextCursor: null };
    }

    // Direct Adaptive format: { globalObjects: { tweets: {...}, users: {...} } }
    if (data.globalObjects && data.globalObjects.tweets) {
        let tweets = [];
        let users = data.globalObjects.users || {};
        for (let tid in data.globalObjects.tweets) {
            let tw = data.globalObjects.tweets[tid];
            let user = users[tw.user_id_str] || {};
            tw.user = user;
            let p = parseSingleTweet(tw);
            if (p) tweets.push(p);
        }
        return { tweets, nextCursor: null };
    }

    let instructions = findInstructions(data) || [];

    let entries = [];
    instructions.forEach(ins => {
        if (ins.type === 'TimelineAddEntries') entries.push(...(ins.entries || []));
        if (ins.type === 'TimelineAddToModule') entries.push(...(ins.moduleItems || []));
    });

    let tweets = [];
    let nextCursor = null;

    entries.forEach(entry => {
        let content = entry.content || {};
        if (content.entryType === 'TimelineTimelineCursor' && content.cursorType === 'Bottom') {
            nextCursor = content.value;
        }

        let item = content.itemContent;
        if (item && item.itemType === 'TimelineTweet') {
            let res = item.tweet_results?.result;
            if (res) {
                let parsed = parseSingleTweet(res);
                if (parsed) tweets.push(parsed);
            }
        }

        // Conversation thread replies & modules
        let subItems = content.items || [];
        subItems.forEach(sub => {
            let sItem = sub.item?.itemContent || sub.itemContent || sub.item?.content?.itemContent;
            if (sItem && sItem.itemType === 'TimelineTweet') {
                let sRes = sItem.tweet_results?.result || sItem.result;
                if (sRes) {
                    let parsed = parseSingleTweet(sRes);
                    if (parsed) tweets.push(parsed);
                }
            }
        });
    });

    return { tweets, nextCursor, error: tweets.length ? null : (data.errors?.[0]?.message || null), status: data.status };
}

function isQueryIdFailure(result) {
    return result.status === 404 || /GRAPHQL_VALIDATION_FAILED|unknown query|query.*not found/i.test(result.error || '');
}

function parseSingleTweet(tw) {
    if (!tw) return null;
    if (tw.__typename === 'TweetWithVisibilityResults') tw = tw.tweet || tw;
    let legacy = tw.legacy || {};
    let id = legacy.id_str || tw.rest_id || tw.id_str || tw.id;
    if (!id) return null;
    id = String(id);

    let isRetweet = false;
    let retweetedBy = null;
    if (legacy.retweeted_status_result) {
        let orig = legacy.retweeted_status_result.result;
        if (orig) {
            let p = parseSingleTweet(orig);
            if (p) {
                p.is_retweet = true;
                let retweeter = extractUser(tw);
                p.retweeted_by = retweeter.name || retweeter.screen_name || 'Someone';
                allTweetsMap[p.id] = p;
                return p;
            }
        }
    }

    let text = tw.note_tweet?.note_tweet_results?.result?.text || legacy.full_text || tw.full_text || tw.text || '';
    text = text.replace(/https?:\/\/t\.co\/\S+$/, '').trim();

    let user = extractUser(tw);

    let media = [];
    let extMedia = legacy.extended_entities?.media || tw.extended_entities?.media || tw.entities?.media || [];
    extMedia.forEach(m => {
        let mUrl = m.media_url_https || m.media_url;
        if (mUrl) {
            media.push({ url: mUrl, type: m.type });
        }
    });

    // Quoted tweet
    let quoted = null;
    let qRes = tw.quoted_status_result?.result;
    if (qRes) {
        quoted = parseSingleTweet(qRes);
    }

    let parsed = {
        id,
        text,
        user_name: user.name,
        user_screen_name: user.screen_name,
        created_at: legacy.created_at ? new Date(legacy.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '',
        likes: legacy.favorite_count || tw.favorite_count || 0,
        retweets: legacy.retweet_count || tw.retweet_count || 0,
        replies: legacy.reply_count || tw.reply_count || 0,
        media,
        quoted,
        is_retweet: isRetweet,
        retweeted_by: retweetedBy
    };
    allTweetsMap[id] = parsed;
    return parsed;
}

function loadFeed(feedType, forceRefresh = false) {
    const container = document.getElementById('mainContent');

    if (feedType === 'cache') {
        showStatus('Viewing offline tweets', false, 0);
        let bookmarks = getBookmarks();
        let cached = window.AndroidBridge ? AndroidBridge.getCache('feed_cache') : '';
        let cachedList = [];
        try { if (cached) cachedList = JSON.parse(cached); } catch(e){}

        if (bookmarks.length === 0 && cachedList.length === 0) {
            container.innerHTML = '<div class="card"><div class="card-title">No Offline Tweets</div><p class="card-desc">Tap ☆ Save on any tweet or browse feeds to save offline.</p></div>';
            return;
        }

        let out = '';
        if (bookmarks.length > 0) {
            out += '<div style="padding:12px 16px; font-weight:700; font-size:14px; border-bottom:1px solid var(--border);">Saved Tweets (' + bookmarks.length + ')</div>';
            out += bookmarks.map(renderTweetHtml).join('');
        }
        if (cachedList.length > 0) {
            out += '<div style="padding:12px 16px; font-weight:700; font-size:14px; color:var(--text-muted); border-bottom:1px solid var(--border);">Recent Cache</div>';
            out += cachedList.map(renderTweetHtml).join('');
        }
        container.innerHTML = '<div id="feedContainer">' + out + '</div>';
        return;
    }

    // Stale-While-Revalidate: Instant Load
    let cachedFeed = '';
    if (window.AndroidBridge) {
        cachedFeed = AndroidBridge.getCache('feed_' + feedType);
    }

    let hasCached = false;
    if (cachedFeed) {
        try {
            let list = JSON.parse(cachedFeed);
            if (list && list.length > 0) {
                currentTweetsList = list;
                list.forEach(t => { if (t && t.id) allTweetsMap[t.id] = t; });
                container.innerHTML = feedToolbar() + '<div id="feedContainer">' + list.map(renderTweetHtml).join('') + '</div>';
                hasCached = true;
                renderLoadMoreButton(feedType);
            }
        } catch (e) {}
    }

    if (!hasCached) {
        showStatus('', false);
        container.innerHTML = '<div class="spinner">Loading...</div>';
    } else if (!forceRefresh) {
        const lastUpdated = Number(window.AndroidBridge ? AndroidBridge.getCache('feed_updated_' + feedType) : localStorage.getItem('feed_updated_' + feedType));
        if (lastUpdated && Date.now() - lastUpdated < FEED_REFRESH_MS) {
            showStatus('Showing recent cached tweets', false, 2500);
            return;
        }
    }

    if (hasCached) showStatus('Refreshing in background...', false, 4000);
    fetchFeedData(feedType, false);
}

function fetchFeedData(feedType, isPaging) {
    const generation = viewGeneration;
    const requestKey = feedType + ':' + generation + ':' + isPaging;
    if (isFetching === requestKey) return;
    isFetching = requestKey;

    const cfg = TIMELINE_CONFIG[feedType];
    if (!cfg) {
        if (isFetching === requestKey) isFetching = false;
        return;
    }

    let cursor = isPaging ? cursors[feedType] : null;
    let variables = cfg.buildVariables(FEED_PAGE_SIZE, cursor);

    let url = `https://x.com/i/api/graphql/${cfg.queryId}/${cfg.op}?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;

    performAsyncGet(url, (resStr) => {
        if (isFetching === requestKey) isFetching = false;
        if (generation !== viewGeneration || currentView !== 'feed' || currentTab !== feedType) return;
        try {
            let parsed = parseTwitterGraphql(resStr);

            const container = document.getElementById('mainContent');

            if (parsed.error) {
                if (cfg.fallbackQueryId && isQueryIdFailure(parsed)) {
                    let fallbackUrl = `https://x.com/i/api/graphql/${cfg.fallbackQueryId}/${cfg.op}?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;
                    performAsyncGet(fallbackUrl, (fbStr) => {
                        if (generation !== viewGeneration || currentView !== 'feed' || currentTab !== feedType) return;
                        let fbParsed = parseTwitterGraphql(fbStr);
                        if (fbParsed.tweets && fbParsed.tweets.length > 0) {
                            applyFeedTweets(feedType, fbParsed, isPaging);
                        } else if (feedType === 'foryou') {
                            displayFeedError(feedType, fbParsed.error ? fbParsed : parsed, isPaging);
                        } else {
                            displayFeedError(feedType, fbParsed, isPaging);
                        }
                    });
                    return;
                }
                displayFeedError(feedType, parsed, isPaging);
                return;
            }

            applyFeedTweets(feedType, parsed, isPaging);
        } catch(err) {
            console.error("fetchFeedData error:", err);
            displayFeedError(feedType, { error: err.message || 'Could not read feed response' }, isPaging);
        } finally {
            if (isFetching === requestKey) isFetching = false;
        }
    });
}

function applyFeedTweets(feedType, parsed, isPaging) {
    const container = document.getElementById('mainContent');
    if (parsed.tweets.length === 0 && !isPaging) {
        showStatus('', false);
        container.innerHTML = '<div class="card"><p class="card-desc">No tweets found.</p></div>';
        return;
    }

    cursors[feedType] = parsed.nextCursor;

    if (isPaging) {
        const existingIds = new Set(currentTweetsList.map(t => t.id));
        const freshTweets = parsed.tweets.filter(t => !existingIds.has(t.id));
        currentTweetsList.push(...freshTweets);
        parsed.tweets.forEach(t => { if (t && t.id) allTweetsMap[t.id] = t; });
        let feedDiv = document.getElementById('feedContainer');
        if (feedDiv) {
            feedDiv.insertAdjacentHTML('beforeend', freshTweets.map(renderTweetHtml).join(''));
        }
        showStatus('', false);
    } else {
        currentTweetsList = parsed.tweets;
        parsed.tweets.forEach(t => { if (t && t.id) allTweetsMap[t.id] = t; });
        if (window.AndroidBridge) {
            AndroidBridge.saveCache('feed_' + feedType, JSON.stringify(parsed.tweets));
            AndroidBridge.saveCache('feed_cache', JSON.stringify(parsed.tweets));
            AndroidBridge.saveCache('feed_updated_' + feedType, String(Date.now()));
        } else {
            localStorage.setItem('feed_updated_' + feedType, String(Date.now()));
        }
        container.innerHTML = feedToolbar() + '<div id="feedContainer">' + parsed.tweets.map(renderTweetHtml).join('') + '</div>';
        showStatus('Feed updated', false, 1500);
    }

    renderLoadMoreButton(feedType);
}

function displayFeedError(feedType, parsed, isPaging) {
    const container = document.getElementById('mainContent');
    let cachedFeed = window.AndroidBridge ? AndroidBridge.getCache('feed_' + feedType) : '';
    if (isPaging) {
        const btn = document.querySelector('#loadMoreBox button');
        if (btn) { btn.disabled = false; btn.textContent = 'Retry Load More'; }
        showStatus(parsed.error || 'Could not load more tweets', true, 5000);
    } else if (cachedFeed && !isPaging) {
        showStatus('Offline: Showing cached tweets', false, 3000);
    } else {
        showStatus('', false);
        container.innerHTML = `
        <div class="card">
            <div class="card-title" style="color:var(--red);">Error loading feed</div>
            <p class="card-desc">${escapeHtml(parsed.error || 'Network error')}</p>
            <a href="javascript:nav('settings')" class="btn btn-secondary">Check Settings &rarr;</a>
        </div>`;
    }
}

    let url = `https://x.com/i/api/graphql/qpemjmVMoTWDvcRT43JIVQ/TweetDetail?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;

    performAsyncGet(url, (resStr) => {

function renderThreadData(tweetId, focal, parsed) {
    const repContainer = document.getElementById('repliesContainer');
    if (!repContainer) return;

    if (!focal) {
        let found = parsed.tweets.find(t => t.id === tweetId);

            focal = found;
            allTweetsMap[tweetId] = focal;
            let threadBox = document.getElementById('threadContainer');
            if (threadBox) {
                let sp = threadBox.querySelector('.spinner');
                if (sp) sp.outerHTML = renderTweetHtml(focal);
            }
        }
    }

    let replies = parsed.tweets.filter(t => t.id !== tweetId);

    if (replies.length > 0) {
        repContainer.innerHTML = '<div style="padding:12px 16px; font-size:14px; font-weight:700; color:var(--text-muted); border-bottom:1px solid var(--border);">Replies (' + replies.length + ')</div>' + replies.map(renderTweetHtml).join('');

    } else {

function prepareSearchTransaction(done) {
    if (!window.AndroidBridge || typeof AndroidBridge.executeSearchGetAsync !== 'function') {
        done('Install the v1.0.6 APK to enable search.');
        return;
    }
    if (searchTransactionClient && Date.now() - searchTransactionFetchedAt < 15 * 60 * 1000) {
        done(null);
        return;
    }
    searchTransactionWaiters.push(done);
    if (searchTransactionLoading) return;
    searchTransactionLoading = true;

    function finish(error) {
        searchTransactionLoading = false;
        const waiters = searchTransactionWaiters.splice(0);
        waiters.forEach(waiter => waiter(error));
    }
    performAsyncGet('https://x.com/home', (html) => {
        if (!html || !html.includes('twitter-site-verification')) {
            finish('Could not prepare X search. Check your connection and account cookies.');
            return;
        }
        const chunk = html.match(/,(\d+):"ondemand\.s"/);
        const hash = chunk && html.match(new RegExp(',' + chunk[1] + ':"([0-9a-f]+)"'));
        if (!hash) {
            finish('X changed its search setup. Please check for an app update.');
            return;
        }
        const scriptUrl = 'https://abs.twimg.com/responsive-web/client-web/ondemand.s.' + hash[1] + 'a.js';
        performAsyncGet(scriptUrl, (script) => {
            try {
                searchTransactionClient = new XClientTransaction.ClientTransaction(html, script);
                searchTransactionClient.homePageResponse = '';
                searchTransactionClient.ondemandFileResponse = '';
                searchTransactionFetchedAt = Date.now();
                finish(null);
            } catch (e) {
                finish('X changed its search setup. Please check for an app update.');
            }
        });
    });
}

function executeSearch(e) {
    if (e && e.preventDefault) e.preventDefault();
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;
    lastSearchQuery = q;
    const generation = ++viewGeneration;

    const resDiv = document.getElementById('searchResults');
    resDiv.innerHTML = '<div class="spinner">Searching...</div>';
    const btn = document.getElementById('searchBtn');
    if (btn) btn.disabled = true;

    let variables = {
        rawQuery: q,
        count: 8,
        querySource: 'typed_query',
        product: 'Top'
    };

    // Query IDs rotate. The first ID was verified against X's current web client.
    const queryIds = ['vLHjqbDv7TPFMBkIIO1nOA', 'GcXk9vN_d1jUfHNqLacXQA'];
    let lastError = '';
    function showUnavailable(message) {
        if (btn) btn.disabled = false;
        resDiv.innerHTML = `<div class="card"><div class="card-title" style="color:var(--red);">Search unavailable</div><p class="card-desc">${escapeHtml(message)}</p><button type="button" class="btn btn-secondary" onclick="openSearchInX()">Open X search (uses more data)</button></div>`;
    }
    function tryQuery(index) {
        if (generation !== viewGeneration || currentView !== 'search') return;
        if (index >= queryIds.length) {
            showUnavailable(lastError || 'X changed its search endpoint. Please try again later.');
            return;
        }
        const path = `/i/api/graphql/${queryIds[index]}/SearchTimeline`;
        let transactionId;
        try {
            transactionId = searchTransactionClient.generateTransactionId('GET', path);
        } catch (e) {
            showUnavailable('Could not prepare X search. Please try again.');
            return;
        }
        const url = `https://x.com${path}?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;
        performAsyncGet(url, (response) => {
            if (generation !== viewGeneration || currentView !== 'search') return;
            const parsed = parseTwitterGraphql(response);
            if (parsed.error) {
                lastError = parsed.error;
                if (isQueryIdFailure(parsed)) tryQuery(index + 1);
                else tryQuery(queryIds.length);
                return;
            }
            if (btn) btn.disabled = false;
            renderSearchResults(q, parsed.tweets, resDiv);
        }, transactionId);
    }
    prepareSearchTransaction((error) => {
        if (generation !== viewGeneration || currentView !== 'search') return;
        if (error) showUnavailable(error);
        else tryQuery(0);
    });
}

function openSearchInX() {

    const text = input ? input.value.trim() : '';
    if (!text) return;

    if (btn) {
        btn.disabled = true;
        btn.innerHTML = 'Posting...';
    }

    let payload = JSON.stringify({
        variables: {
            tweet_text: text,
            reply: {
                in_reply_to_tweet_id: replyToId,
                exclude_reply_user_ids: []
            },
            dark_request: false,
            media: {
                media_entities: [],
                possibly_sensitive: false
            },
            semantic_annotation_ids: []
        },
        features: GRAPHQL_FEATURES,
        queryId: "wR5Z_lEibLvkew3tF9w-Sg"
    });

    if (window.AndroidBridge && AndroidBridge.executePost) {
        setTimeout(() => {
            let resStr = AndroidBridge.executePost("https://x.com/i/api/graphql/wR5Z_lEibLvkew3tF9w-Sg/CreateTweet", payload);
            let res;
            try {
                res = JSON.parse(resStr);
            } catch(e) {
                res = { error: true, message: resStr };
            }

            if (res.errors && res.errors.length > 0) {
                alert("Reply failed: " + res.errors[0].message);
                if (btn) { btn.disabled = false; btn.innerHTML = 'Reply'; }
            } else if (res.error) {
                alert("Reply failed: " + (res.message || 'Error'));
                if (btn) { btn.disabled = false; btn.innerHTML = 'Reply'; }
            } else {
                showStatus('Reply posted', false, 2500);
                if (input) input.value = '';
                renderThreadView(replyToId);
            }
        }, 10);
    } else {
        alert("Native bridge unavailable");
        if (btn) { btn.disabled = false; btn.innerHTML = 'Reply'; }
    }
}

    const updateBtn = document.getElementById('updateBtn');
    if (statusText) statusText.innerHTML = 'Checking for updates...';
    if (updateBtn) updateBtn.disabled = true;

    const updateUrl = 'https://gist.githubusercontent.com/sovopr/c52e8a1490b3a5415525b27063726bbe/raw/index.html?t=' + Date.now();

    // Use native fetch first (clean network stack without Twitter headers)
    fetch(updateUrl)
        .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
        })
        .then(html => {
            if (html && html.includes('<!DOCTYPE html>') && html.includes('mainContent')) {
                applyUpdate(html);
            } else {
                throw new Error('Invalid update file');
            }
        })
        .catch(err => {
            // Fallback to bridge with clean headers
            performAsyncGet(updateUrl, (bridgeHtml) => {
                if (bridgeHtml && bridgeHtml.includes('<!DOCTYPE html>') && bridgeHtml.includes('mainContent')) {
                    applyUpdate(bridgeHtml);
                } else {
                    if (statusText) statusText.innerHTML = 'Update check failed. Please try again.';
                    if (updateBtn) updateBtn.disabled = false;
                }
            });
        });
}

function applyUpdate(newHtml) {
    const statusText = document.getElementById('updateStatusText');
    const versionMatch = newHtml.match(/const APP_VERSION = '([0-9]+\.[0-9]+\.[0-9]+)'/);
    if (!versionMatch) {
        if (statusText) statusText.textContent = 'Update file has no version information.';
        const btn = document.getElementById('updateBtn');
        if (btn) btn.disabled = false;
        return;
    }
    const newer = versionMatch[1].split('.').map(Number).some((part, i, parts) => part > Number(APP_VERSION.split('.')[i]) && parts.slice(0, i).every((p, j) => p === Number(APP_VERSION.split('.')[j])));
    if (!newer) {
        if (statusText) statusText.textContent = 'Already up to date (v' + APP_VERSION + ').';
        const btn = document.getElementById('updateBtn');
        if (btn) btn.disabled = false;
        return;
    }
    if (window.AndroidBridge && AndroidBridge.saveLiveHtml) {
        let ok = AndroidBridge.saveLiveHtml(newHtml);
        if (ok) {
            if (statusText) statusText.innerHTML = 'Update installed. Reloading...';
            setTimeout(() => {
                AndroidBridge.reloadApp();
            }, 800);
        } else {
            if (statusText) statusText.innerHTML = 'Failed to save update.';
            const updateBtn = document.getElementById('updateBtn');
            if (updateBtn) updateBtn.disabled = false;
        }
    } else {
        alert("Please install the current APK once to enable in-app updates.");
    }
}

function resetToFactoryAsset() {
    if (window.AndroidBridge && AndroidBridge.resetLiveHtml) {
        AndroidBridge.resetLiveHtml();
        alert("Reset to bundled version. Reloading...");
        AndroidBridge.reloadApp();
    }
}

window.onload = init;
</script>
