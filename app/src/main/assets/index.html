<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>𝕏 Lite</title>
<style>
:root {
  --bg: #000000;
  --surface: #000000;
  --card: #16181c;
  --border: #2f3336;
  --text: #e7e9ea;
  --text-muted: #71767b;
  --accent: #1d9bf0;
  --accent-hover: #1a8cd8;
  --red: #f4212e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.4;
  padding-bottom: 65px;
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--accent); text-decoration: none; }

/* Clean official header */
.header {
  position: sticky;
  top: 0;
  background: rgba(0, 0, 0, 0.95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  height: 52px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 100;
}
.header-logo {
  font-size: 22px;
  font-weight: 900;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.header-sub {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
}

/* Tabs */
.nav-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.nav-tab {
  flex: 1;
  text-align: center;
  padding: 14px 6px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 3px solid transparent;
}
.nav-tab.active {
  color: var(--text);
  border-bottom: 3px solid var(--accent);
}

/* Subtle status bar */
.status-bar {
  padding: 6px 14px;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--border);
  background: #080808;
  color: var(--text-muted);
}
.status-bar.error {
  color: #fca5a5;
  background: rgba(244, 33, 46, 0.1);
}

/* Tweets */
.tweet {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.tweet:active {
  background: rgba(255, 255, 255, 0.02);
}
.tweet-header {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.tweet-name {
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
}
.tweet-handle {
  color: var(--text-muted);
  font-size: 14px;
}
.tweet-dot {
  color: var(--text-muted);
  font-size: 12px;
}
.tweet-time {
  color: var(--text-muted);
  font-size: 14px;
}
.tweet-body {
  font-size: 15px;
  word-break: break-word;
  white-space: pre-wrap;
  line-height: 1.45;
  cursor: pointer;
}
.tweet-img {
  max-width: 100%;
  border-radius: 12px;
  margin-top: 8px;
  display: block;
  background: #16181c;
  border: 1px solid var(--border);
}
.tweet-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 420px;
  margin-top: 10px;
  font-size: 13px;
  color: var(--text-muted);
}
.tweet-actions-left {
  display: flex;
  align-items: center;
  gap: 22px;
}
.tweet-actions-right {
  display: flex;
  align-items: center;
  gap: 16px;
}
.action-item {
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  user-select: none;
}
.action-item:active {
  color: var(--accent);
}
.retweet-banner {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.quoted-box {
  margin-top: 8px;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.02);
  cursor: pointer;
}
.quoted-box:active {
  background: rgba(255, 255, 255, 0.05);
}

/* Bottom Bar */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 52px;
  background: rgba(0, 0, 0, 0.98);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}
.bottom-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 11px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px 12px;
}
.bottom-item.active {
  color: var(--text);
  font-weight: 700;
}
.bottom-icon {
  font-size: 18px;
  line-height: 1.2;
}

/* Buttons and Inputs */
.btn {
  display: inline-block;
  padding: 8px 18px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 9999px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
}
.btn:active {
  background: var(--accent-hover);
}
.btn-block {
  display: block;
  width: 100%;
}
.btn-secondary {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:active {
  background: #16181c;
}
.form-input, .form-textarea {
  width: 100%;
  background: #16181c;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px;
  border-radius: 8px;
  font-size: 15px;
  margin-bottom: 12px;
  font-family: inherit;
}
.form-input:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.form-textarea {
  resize: vertical;
  min-height: 90px;
}

/* Clean cards for Settings */
.card {
  border-bottom: 1px solid var(--border);
  padding: 16px;
}
.card-title {
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 6px;
}
.card-desc {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 14px;
  line-height: 1.4;
}
.spinner {
  text-align: center;
  padding: 36px 16px;
  color: var(--text-muted);
  font-size: 14px;
}
.load-more-box {
  padding: 16px;
  text-align: center;
}
.sub-header {
  height: 48px;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 16px;
  font-weight: 700;
}
.back-btn {
  background: none;
  border: none;
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 9999px;
}
</style>
</head>
<body>

<div class="header">
    <div class="header-logo">
        <span>𝕏</span>
        <span class="header-sub">Lite</span>
    </div>
</div>

<div id="tabNav" class="nav-tabs">
    <div class="nav-tab active" onclick="switchFeed('following')">Following</div>
    <div class="nav-tab" onclick="switchFeed('foryou')">For You</div>
    <div class="nav-tab" onclick="switchFeed('cache')">Offline</div>
</div>

<div id="statusBar" class="status-bar" style="display:none;"></div>

<div id="mainContent">
    <div id="feedContainer"></div>
</div>

<div class="bottom-bar">
    <div class="bottom-item active" onclick="nav('feed')">
        <span class="bottom-icon">⌂</span>
        <span>Home</span>
    </div>
    <div class="bottom-item" onclick="nav('search')">
        <span class="bottom-icon">⚲</span>
        <span>Search</span>
    </div>
    <div class="bottom-item" onclick="nav('post')">
        <span class="bottom-icon">✎</span>
        <span>Post</span>
    </div>
    <div class="bottom-item" onclick="nav('settings')">
        <span class="bottom-icon">⚙</span>
        <span>Settings</span>
    </div>
</div>

<script>
let currentTab = 'following';
let currentFeedOrigin = 'following';
let cursors = { following: null, foryou: null };
let appConfig = { auth_token: '', ct0: '', image_mode: 'tap' };
let currentTweetsList = [];
let allTweetsMap = {};
let isFetching = false;
let pendingCallbacks = {};

const TIMELINE_CONFIG = {
    following: {
        queryId: '2ee46L1AFXmnTa0EvUog-Q',
        op: 'HomeLatestTimeline',
        buildVariables: (count, cursor) => {
            let v = {
                count: count || 12,
                includePromotedContent: false,
                latestControlAvailable: true,
                requestContext: 'launch'
            };
            if (cursor) v.cursor = cursor;
            return v;
        }
    },
    foryou: {
        queryId: 'KmJCeZ__ef1fNos7tKN_fg',
        fallbackQueryId: 'fedFLLzmiCAuzPgA8lyh8Q',
        op: 'HomeTimeline',
        buildVariables: (count, cursor) => {
            let v = {
                count: count || 12,
                includePromotedContent: false,
                requestContext: 'launch',
                seenTweetIds: [],
                withCommunity: true
            };
            if (cursor) v.cursor = cursor;
            return v;
        }
    }
};

const GRAPHQL_FEATURES = {
    rweb_video_screen_enabled: false,
    rweb_cashtags_enabled: true,
    profile_label_improvements_pcf_label_in_post_enabled: true,
    responsive_web_profile_redirect_enabled: true,
    rweb_tipjar_consumption_enabled: false,
    verified_phone_label_enabled: false,
    creator_subscriptions_tweet_preview_api_enabled: true,
    responsive_web_graphql_timeline_navigation_enabled: true,
    premium_content_api_read_enabled: false,
    communities_web_enable_tweet_community_results_fetch: true,
    c9s_tweet_anatomy_moderator_badge_enabled: true,
    responsive_web_grok_analyze_button_fetch_trends_enabled: false,
    responsive_web_grok_analyze_post_followups_enabled: true,
    rweb_cashtags_composer_attachment_enabled: true,
    responsive_web_jetfuel_frame: true,
    rweb_sports_post_context_enabled: true,
    x_elections_post_context_enabled: true,
    responsive_web_grok_share_attachment_enabled: true,
    responsive_web_grok_annotations_enabled: true,
    articles_preview_enabled: true,
    responsive_web_edit_tweet_api_enabled: true,
    graphql_is_translatable_rweb_tweet_is_translatable_enabled: true,
    view_counts_everywhere_api_enabled: true,
    longform_notetweets_consumption_enabled: true,
    responsive_web_twitter_article_tweet_consumption_enabled: true,
    content_disclosure_indicator_enabled: true,
    content_disclosure_ai_generated_indicator_enabled: true,
    responsive_web_grok_show_grok_translated_post: true,
    responsive_web_grok_analysis_button_from_backend: true,
    post_ctas_fetch_enabled: true,
    freedom_of_speech_not_reach_fetch_enabled: true,
    standardized_nudges_misinfo: true,
    tweet_with_visibility_results_prefer_gql_limited_actions_policy_enabled: true,
    longform_notetweets_rich_text_read_enabled: true,
    longform_notetweets_inline_media_enabled: false,
    responsive_web_nested_quote_preview_enabled: true,
    responsive_web_grok_image_annotation_enabled: true,
    responsive_web_grok_imagine_annotation_enabled: true,
    responsive_web_grok_community_note_auto_translation_is_enabled: true,
    responsive_web_enhance_cards_enabled: false
};

function init() {
    if (window.AndroidBridge) {
        try {
            appConfig = JSON.parse(AndroidBridge.getCookies());
        } catch (e) {
            console.error(e);
        }
    }
    try {
        let saved = localStorage.getItem('last_active_tab');
        if (saved && ['following', 'foryou', 'cache'].includes(saved)) {
            currentTab = saved;
            currentFeedOrigin = saved;
            document.querySelectorAll('.nav-tab').forEach((el, idx) => {
                el.classList.toggle('active', ['following', 'foryou', 'cache'][idx] === currentTab);
            });
        }
    } catch(e){}

    if (!appConfig.auth_token || !appConfig.ct0) {
        nav('settings');
    } else {
        loadFeed(currentTab);
    }
}

// Global callback dispatcher for native Android async requests
window.__onAsyncFinish = function(callbackId) {
    if (pendingCallbacks[callbackId]) {
        let resStr = '';
        if (window.AndroidBridge && AndroidBridge.getCache) {
            resStr = AndroidBridge.getCache('temp_res_' + callbackId);
            AndroidBridge.saveCache('temp_res_' + callbackId, '');
        }
        let cb = pendingCallbacks[callbackId];
        delete pendingCallbacks[callbackId];
        try {
            cb(resStr);
        } catch(err) {
            console.error("Callback error:", err);
        }
    }
};

function performAsyncGet(url, callback) {
    let cbId = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
    pendingCallbacks[cbId] = callback;

    if (window.AndroidBridge && AndroidBridge.executeGetAsync) {
        AndroidBridge.executeGetAsync(url, cbId);
    } else if (window.AndroidBridge && AndroidBridge.executeGet) {
        setTimeout(() => {
            let res = AndroidBridge.executeGet(url);
            window.__onAsyncFinish(cbId, res);
        }, 10);
    } else {
        // Fallback to native browser fetch
        fetch(url)
            .then(r => r.text())
            .then(txt => callback(txt))
            .catch(err => callback(JSON.stringify({ error: true, message: err.message })));
    }
}

function showStatus(text, isError, autoHideMs) {
    const bar = document.getElementById('statusBar');
    if (!bar) return;
    if (!text) {
        bar.style.display = 'none';
        bar.innerHTML = '';
        return;
    }
    bar.className = 'status-bar' + (isError ? ' error' : '');
    bar.innerHTML = text;
    bar.style.display = 'flex';

    if (autoHideMs) {
        setTimeout(() => {
            if (bar.innerHTML === text) {
                bar.style.display = 'none';
                bar.innerHTML = '';
            }
        }, autoHideMs);
    }
}

function nav(view) {
    document.querySelectorAll('.bottom-item').forEach((el, idx) => {
        el.classList.toggle('active', ['feed', 'search', 'post', 'settings'][idx] === view);
    });

    const tabNav = document.getElementById('tabNav');
    tabNav.style.display = (view === 'feed') ? 'flex' : 'none';

    if (view === 'feed') {
        restoreFeedView(currentTab);
    } else {
        showStatus('', false);
        if (view === 'search') renderSearch();
        else if (view === 'post') renderPost();
        else if (view === 'settings') renderSettings();
    }
}

function switchFeed(tab) {
    currentTab = tab;
    currentFeedOrigin = tab;
    try { localStorage.setItem('last_active_tab', tab); } catch(e){}
    document.querySelectorAll('.nav-tab').forEach((el, idx) => {
        el.classList.toggle('active', ['following', 'foryou', 'cache'][idx] === tab);
    });
    loadFeed(tab);
}

function escapeHtml(text) {
    if (!text) return '';
    return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function linkify(text) {
    let s = escapeHtml(text);
    s = s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" onclick="event.stopPropagation()">$1</a>');
    s = s.replace(/@([a-zA-Z0-9_]+)/g, '<a href="javascript:searchTag(\'from:$1\')" onclick="event.stopPropagation()">@$1</a>');
    s = s.replace(/#([a-zA-Z0-9_]+)/g, '<a href="javascript:searchTag(\'#$1\')" onclick="event.stopPropagation()">#$1</a>');
    return s;
}

function getBookmarks() {
    try {
        let b = AndroidBridge ? AndroidBridge.getCache('bookmarks') : localStorage.getItem('bookmarks');
        return b ? JSON.parse(b) : [];
    } catch(e) { return []; }
}

function isBookmarked(id) {
    return getBookmarks().some(t => t.id === id);
}

function toggleBookmark(twId) {
    let list = getBookmarks();
    let idx = list.findIndex(t => t.id === twId);
    let el = document.getElementById('bm-' + twId);
    if (idx >= 0) {
        list.splice(idx, 1);
        if (el) el.innerHTML = '☆ Save';
        showStatus('Removed from offline saved', false, 2000);
    } else {
        let tweetObj = currentTweetsList.find(t => t.id === twId);
        if (tweetObj) {
            list.unshift(tweetObj);
            if (el) el.innerHTML = '★ Saved';
            showStatus('Saved for offline reading', false, 2000);
        }
    }
    let s = JSON.stringify(list);
    if (window.AndroidBridge) AndroidBridge.saveCache('bookmarks', s);
    else localStorage.setItem('bookmarks', s);
}

function copyTweetLink(screenName, id) {
    let url = 'https://x.com/' + (screenName || 'i') + '/status/' + id;
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => {
            showStatus('Link copied to clipboard', false, 2000);
        }).catch(() => {
            prompt('Copy link:', url);
        });
    } else {
        prompt('Copy link:', url);
    }
}

// In-place HD image loader
function loadHdImg(btn, url, imgId) {
    btn.innerHTML = 'Loading HD...';
    btn.disabled = true;
    const img = document.getElementById(imgId);
    if (!img) return;

    const hdImg = new Image();
    hdImg.src = 'https://local.xlite/img?url=' + encodeURIComponent(url) + '&mode=hd';
    hdImg.onload = function() {
        img.src = hdImg.src;
        btn.innerHTML = '✓ HD Loaded';
        btn.style.color = 'var(--accent)';
    };
    hdImg.onerror = function() {
        btn.innerHTML = 'Retry HD';
        btn.disabled = false;
    };
}

function loadThumbImg(btn, url, imgId) {
    btn.innerHTML = 'Loading image...';
    btn.disabled = true;
    const img = document.createElement('img');
    img.id = imgId;
    img.className = 'tweet-img';
    img.src = 'https://local.xlite/img?url=' + encodeURIComponent(url) + '&mode=thumb';
    img.onload = function() {
        const parent = btn.parentElement;
        parent.innerHTML = '';
        parent.appendChild(img);
        const hdBox = document.createElement('div');
        hdBox.style = 'text-align:right; margin-top:4px;';
        hdBox.innerHTML = `
            <button type="button" onclick="loadHdImg(this, '${escapeHtml(url)}', '${imgId}')" style="font-size:12px; color:var(--text-muted); background:none; border:none; cursor:pointer; padding:4px 8px;">
                HD View
            </button>`;
        parent.appendChild(hdBox);
    };
    img.onerror = function() {
        btn.innerHTML = 'Retry loading';
        btn.disabled = false;
    };
}

function renderTweetHtml(tw) {
    let rtHtml = tw.is_retweet
        ? `<div class="retweet-banner">⇄ Retweeted by ${escapeHtml(tw.retweeted_by || 'Someone')}</div>`
        : '';

    let mediaHtml = '';
    if (tw.media && tw.media.length > 0) {
        mediaHtml += '<div style="margin-top:8px;" onclick="event.stopPropagation()">';
        tw.media.forEach(m => {
            let imgId = 'img_' + Math.random().toString(36).substr(2, 9);
            if (appConfig.image_mode === 'auto') {
                mediaHtml += `
                <div>
                    <img id="${imgId}" src="https://local.xlite/img?url=${encodeURIComponent(m.url)}&mode=thumb" class="tweet-img" loading="lazy" />
                    <div style="text-align:right; margin-top:4px;">
                        <button type="button" onclick="loadHdImg(this, '${escapeHtml(m.url)}', '${imgId}')" style="font-size:12px; color:var(--text-muted); background:none; border:none; cursor:pointer; padding:4px 8px;">
                            HD View
                        </button>
                    </div>
                </div>`;
            } else if (appConfig.image_mode === 'off') {
                mediaHtml += `<div style="font-size:13px; color:var(--text-muted); margin-top:4px;">[Photo]</div>`;
            } else {
                mediaHtml += `
                <div style="margin-top:6px;">
                    <button type="button" class="btn btn-secondary btn-block" onclick="loadThumbImg(this, '${escapeHtml(m.url)}', '${imgId}')" style="font-size:13px; padding:8px 14px;">
                        Load Image (~3.5 KB)
                    </button>
                </div>`;
            }
        });
        mediaHtml += '</div>';
    }

    let quotedHtml = '';
    if (tw.quoted) {
        let q = tw.quoted;
        quotedHtml = `
        <div class="quoted-box" onclick="viewThread('${escapeHtml(q.id)}'); event.stopPropagation();">
            <div class="tweet-header">
                <span class="tweet-name">${escapeHtml(q.user_name || q.user_screen_name || '𝕏 User')}</span>
                <span class="tweet-handle">${q.user_screen_name ? '@' + escapeHtml(q.user_screen_name) : ''}</span>
            </div>
            <div class="tweet-body" style="font-size:14px; margin-top:2px;">${linkify(q.text)}</div>
        </div>`;
    }

    let handleHtml = tw.user_screen_name ? `<span class="tweet-handle">@${escapeHtml(tw.user_screen_name)}</span>` : '';
    let timeHtml = tw.created_at ? `<span class="tweet-dot">&middot;</span><span class="tweet-time">${escapeHtml(tw.created_at)}</span>` : '';
    let bookmarked = isBookmarked(tw.id);

    return `
    <div class="tweet" data-id="${escapeHtml(tw.id)}">
        ${rtHtml}
        <div class="tweet-header">
            <span class="tweet-name" onclick="searchTag('from:${escapeHtml(tw.user_screen_name)}'); event.stopPropagation();">
                ${escapeHtml(tw.user_name || tw.user_screen_name || '𝕏 User')}
            </span>
            ${handleHtml}
            ${timeHtml}
        </div>
        <div class="tweet-body" onclick="viewThread('${escapeHtml(tw.id)}')">${linkify(tw.text)}</div>
        ${mediaHtml}
        ${quotedHtml}
        <div class="tweet-actions">
            <div class="tweet-actions-left">
                <span class="action-item" onclick="viewThread('${escapeHtml(tw.id)}')">💬 ${tw.replies || 0}</span>
                <span class="action-item">⇄ ${tw.retweets || 0}</span>
                <span class="action-item">♡ ${tw.likes || 0}</span>
            </div>
            <div class="tweet-actions-right">
                <span class="action-item" id="bm-${escapeHtml(tw.id)}" onclick="toggleBookmark('${escapeHtml(tw.id)}')">${bookmarked ? '★ Saved' : '☆ Save'}</span>
                <span class="action-item" onclick="copyTweetLink('${escapeHtml(tw.user_screen_name)}', '${escapeHtml(tw.id)}')">🔗</span>
            </div>
        </div>
    </div>`;
}

function extractUser(tw) {
    let uRes = tw.core?.user_results?.result || tw.user_results?.result || tw.user;
    if (!uRes) return { name: '', screen_name: '', avatar: '' };

    if (uRes.__typename === 'UserWithVisibilityResults') {
        uRes = uRes.user || uRes;
    }

    let core = uRes.core || {};
    let legacy = uRes.legacy || {};

    let name = core.name || legacy.name || uRes.name || '';
    let screen_name = core.screen_name || legacy.screen_name || uRes.screen_name || '';
    let avatar = uRes.avatar?.image_url || legacy.profile_image_url_https || uRes.profile_image_url_https || '';

    return { name, screen_name, avatar };
}

function findInstructions(obj) {
    if (!obj || typeof obj !== 'object') return null;
    if (Array.isArray(obj.instructions)) return obj.instructions;
    for (let k in obj) {
        if (obj[k] && typeof obj[k] === 'object') {
            let found = findInstructions(obj[k]);
            if (found) return found;
        }
    }
    return null;
}

function parseTwitterGraphql(jsonStr) {
    let data;
    try {
        data = JSON.parse(jsonStr);
    } catch(e) {
        return { tweets: [], error: 'JSON parse error' };
    }

    if (data.errors && data.errors.length > 0) {
        return { tweets: [], error: data.errors[0]?.message || 'GraphQL Error' };
    }
    if (data.error && !data.statuses && !data.globalObjects) {
        return { tweets: [], error: data.message || 'Error from Twitter' };
    }

    // Direct REST v1.1 search format: { statuses: [...] }
    if (Array.isArray(data.statuses)) {
        let tweets = [];
        data.statuses.forEach(st => {
            let p = parseSingleTweet(st);
            if (p) tweets.push(p);
        });
        return { tweets, nextCursor: null };
    }

    // Direct Adaptive format: { globalObjects: { tweets: {...}, users: {...} } }
    if (data.globalObjects && data.globalObjects.tweets) {
        let tweets = [];
        let users = data.globalObjects.users || {};
        for (let tid in data.globalObjects.tweets) {
            let tw = data.globalObjects.tweets[tid];
            let user = users[tw.user_id_str] || {};
            tw.user = user;
            let p = parseSingleTweet(tw);
            if (p) tweets.push(p);
        }
        return { tweets, nextCursor: null };
    }

    let instructions = findInstructions(data) || [];

    let entries = [];
    instructions.forEach(ins => {
        if (ins.type === 'TimelineAddEntries') entries.push(...(ins.entries || []));
        if (ins.type === 'TimelineAddToModule') entries.push(...(ins.moduleItems || []));
    });

    let tweets = [];
    let nextCursor = null;

    entries.forEach(entry => {
        let content = entry.content || {};
        if (content.entryType === 'TimelineTimelineCursor' && content.cursorType === 'Bottom') {
            nextCursor = content.value;
        }

        let item = content.itemContent;
        if (item && item.itemType === 'TimelineTweet') {
            let res = item.tweet_results?.result;
            if (res) {
                let parsed = parseSingleTweet(res);
                if (parsed) tweets.push(parsed);
            }
        }

        // Conversation thread replies & modules
        let subItems = content.items || [];
        subItems.forEach(sub => {
            let sItem = sub.item?.itemContent || sub.itemContent || sub.item?.content?.itemContent;
            if (sItem && sItem.itemType === 'TimelineTweet') {
                let sRes = sItem.tweet_results?.result || sItem.result;
                if (sRes) {
                    let parsed = parseSingleTweet(sRes);
                    if (parsed) tweets.push(parsed);
                }
            }
        });
    });

    return { tweets, nextCursor };
}

function parseSingleTweet(tw) {
    if (!tw) return null;
    if (tw.__typename === 'TweetWithVisibilityResults') tw = tw.tweet || tw;
    let legacy = tw.legacy || {};
    let id = legacy.id_str || tw.rest_id || tw.id_str || tw.id;
    if (!id) return null;
    id = String(id);

    let isRetweet = false;
    let retweetedBy = null;
    if (legacy.retweeted_status_result) {
        let orig = legacy.retweeted_status_result.result;
        if (orig) {
            let p = parseSingleTweet(orig);
            if (p) {
                p.is_retweet = true;
                let retweeter = extractUser(tw);
                p.retweeted_by = retweeter.name || retweeter.screen_name || 'Someone';
                allTweetsMap[p.id] = p;
                return p;
            }
        }
    }

    let text = tw.note_tweet?.note_tweet_results?.result?.text || legacy.full_text || tw.full_text || tw.text || '';
    text = text.replace(/https?:\/\/t\.co\/\S+$/, '').trim();

    let user = extractUser(tw);

    let media = [];
    let extMedia = legacy.extended_entities?.media || tw.extended_entities?.media || tw.entities?.media || [];
    extMedia.forEach(m => {
        let mUrl = m.media_url_https || m.media_url;
        if (mUrl) {
            media.push({ url: mUrl, type: m.type });
        }
    });

    // Quoted tweet
    let quoted = null;
    let qRes = tw.quoted_status_result?.result;
    if (qRes) {
        quoted = parseSingleTweet(qRes);
    }

    let parsed = {
        id,
        text,
        user_name: user.name,
        user_screen_name: user.screen_name,
        created_at: legacy.created_at ? new Date(legacy.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '',
        likes: legacy.favorite_count || tw.favorite_count || 0,
        retweets: legacy.retweet_count || tw.retweet_count || 0,
        replies: legacy.reply_count || tw.reply_count || 0,
        media,
        quoted,
        is_retweet: isRetweet,
        retweeted_by: retweetedBy
    };
    allTweetsMap[id] = parsed;
    return parsed;
}

function loadFeed(feedType) {
    const container = document.getElementById('mainContent');

    if (feedType === 'cache') {
        showStatus('Viewing offline tweets', false, 0);
        let bookmarks = getBookmarks();
        let cached = AndroidBridge ? AndroidBridge.getCache('feed_cache') : '';
        let cachedList = [];
        try { if (cached) cachedList = JSON.parse(cached); } catch(e){}

        if (bookmarks.length === 0 && cachedList.length === 0) {
            container.innerHTML = '<div class="card"><div class="card-title">No Offline Tweets</div><p class="card-desc">Tap ☆ Save on any tweet or browse feeds to save offline.</p></div>';
            return;
        }

        let out = '';
        if (bookmarks.length > 0) {
            out += '<div style="padding:12px 16px; font-weight:700; font-size:14px; border-bottom:1px solid var(--border);">Saved Tweets (' + bookmarks.length + ')</div>';
            out += bookmarks.map(renderTweetHtml).join('');
        }
        if (cachedList.length > 0) {
            out += '<div style="padding:12px 16px; font-weight:700; font-size:14px; color:var(--text-muted); border-bottom:1px solid var(--border);">Recent Cache</div>';
            out += cachedList.map(renderTweetHtml).join('');
        }
        container.innerHTML = '<div id="feedContainer">' + out + '</div>';
        return;
    }

    // Stale-While-Revalidate: Instant Load
    let cachedFeed = '';
    if (window.AndroidBridge) {
        cachedFeed = AndroidBridge.getCache('feed_' + feedType);
    }

    let hasCached = false;
    if (cachedFeed) {
        try {
            let list = JSON.parse(cachedFeed);
            if (list && list.length > 0) {
                currentTweetsList = list;
                list.forEach(t => { if (t && t.id) allTweetsMap[t.id] = t; });
                container.innerHTML = '<div id="feedContainer">' + list.map(renderTweetHtml).join('') + '</div>';
                hasCached = true;
                showStatus('Refreshing in background...', false, 4000);
            }
        } catch (e) {}
    }

    if (!hasCached) {
        showStatus('', false);
        container.innerHTML = '<div class="spinner">Loading...</div>';
    }

    fetchFeedData(feedType, false);
}

function fetchFeedData(feedType, isPaging) {
    if (isFetching) return;
    isFetching = true;

    const cfg = TIMELINE_CONFIG[feedType];
    if (!cfg) {
        isFetching = false;
        return;
    }

    let cursor = isPaging ? cursors[feedType] : null;
    let variables = cfg.buildVariables(12, cursor);

    let url = `https://x.com/i/api/graphql/${cfg.queryId}/${cfg.op}?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;

    performAsyncGet(url, (resStr) => {
        isFetching = false;
        try {
            let parsed = parseTwitterGraphql(resStr);

            const container = document.getElementById('mainContent');

            if (parsed.error) {
                if (cfg.fallbackQueryId) {
                    let fallbackUrl = `https://x.com/i/api/graphql/${cfg.fallbackQueryId}/${cfg.op}?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;
                    performAsyncGet(fallbackUrl, (fbStr) => {
                        let fbParsed = parseTwitterGraphql(fbStr);
                        if (fbParsed.tweets && fbParsed.tweets.length > 0) {
                            applyFeedTweets(feedType, fbParsed, isPaging);
                        } else if (feedType === 'foryou') {
                            // Fallback to following feed so user never gets a broken screen
                            fetchFeedData('following', isPaging);
                        } else {
                            displayFeedError(feedType, fbParsed, isPaging);
                        }
                    });
                    return;
                } else if (feedType === 'foryou') {
                    fetchFeedData('following', isPaging);
                    return;
                }
                displayFeedError(feedType, parsed, isPaging);
                return;
            }

            applyFeedTweets(feedType, parsed, isPaging);
        } catch(err) {
            console.error("fetchFeedData error:", err);
            showStatus('', false);
        } finally {
            isFetching = false;
        }
    });
}

function applyFeedTweets(feedType, parsed, isPaging) {
    const container = document.getElementById('mainContent');
    if (parsed.tweets.length === 0 && !isPaging) {
        showStatus('', false);
        container.innerHTML = '<div class="card"><p class="card-desc">No tweets found.</p></div>';
        return;
    }

    cursors[feedType] = parsed.nextCursor;

    if (isPaging) {
        currentTweetsList.push(...parsed.tweets);
        parsed.tweets.forEach(t => { if (t && t.id) allTweetsMap[t.id] = t; });
        let feedDiv = document.getElementById('feedContainer');
        if (feedDiv) {
            feedDiv.insertAdjacentHTML('beforeend', parsed.tweets.map(renderTweetHtml).join(''));
        }
        showStatus('', false);
    } else {
        currentTweetsList = parsed.tweets;
        parsed.tweets.forEach(t => { if (t && t.id) allTweetsMap[t.id] = t; });
        if (window.AndroidBridge) {
            AndroidBridge.saveCache('feed_' + feedType, JSON.stringify(parsed.tweets));
            AndroidBridge.saveCache('feed_cache', JSON.stringify(parsed.tweets));
        }
        container.innerHTML = '<div id="feedContainer">' + parsed.tweets.map(renderTweetHtml).join('') + '</div>';
        showStatus('Feed updated', false, 1500);
    }

    renderLoadMoreButton(feedType);
}

function displayFeedError(feedType, parsed, isPaging) {
    const container = document.getElementById('mainContent');
    let cachedFeed = AndroidBridge ? AndroidBridge.getCache('feed_' + feedType) : '';
    if (cachedFeed && !isPaging) {
        showStatus('Offline: Showing cached tweets', false, 3000);
    } else {
        showStatus('', false);
        container.innerHTML = `
        <div class="card">
            <div class="card-title" style="color:var(--red);">Error loading feed</div>
            <p class="card-desc">${escapeHtml(parsed.error || 'Network error')}</p>
            <a href="javascript:nav('settings')" class="btn btn-secondary">Check Settings &rarr;</a>
        </div>`;
    }
}

function renderLoadMoreButton(feedType) {
    let oldBtn = document.getElementById('loadMoreBox');
    if (oldBtn) oldBtn.remove();

    if (cursors[feedType]) {
        const loadMoreHtml = `
        <div id="loadMoreBox" class="load-more-box">

                Load More
            </button>
        </div>`;
        const container = document.getElementById('mainContent');
        container.insertAdjacentHTML('beforeend', loadMoreHtml);

}

function loadMoreTweets(feedType) {
    const btn = document.querySelector('#loadMoreBox button');
    if (btn) {
        btn.disabled = true;
        btn.innerHTML = 'Loading...';
    }
    fetchFeedData(feedType, true);
}

// Conversation / Thread View
function viewThread(tweetId) {
    currentFeedOrigin = currentTab;
    history.pushState({ view: 'thread', id: tweetId, originTab: currentTab }, '', '#thread-' + tweetId);
    renderThreadView(tweetId);
}

function renderThreadView(tweetId) {
    const tabNav = document.getElementById('tabNav');
    if (tabNav) tabNav.style.display = 'none';

    let focal = allTweetsMap[tweetId] || currentTweetsList.find(t => t.id === tweetId);

    const container = document.getElementById('mainContent');
    container.innerHTML = `
    <div class="sub-header">
        <button type="button" class="back-btn" onclick="goBackToFeed()">&larr;</button>
        <span>Conversation</span>
    </div>
    <div id="threadContainer">
        ${focal ? renderTweetHtml(focal) : '<div class="spinner">Loading tweet...</div>'}
        <div style="padding:14px 16px; border-bottom:1px solid var(--border);">
            <form onsubmit="postReply(event, '${escapeHtml(tweetId)}')">
                <textarea id="replyText" class="form-textarea" placeholder="Post your reply" style="min-height:65px; margin-bottom:10px;" required></textarea>
                <div style="display:flex; justify-content:flex-end;">
                    <button type="submit" id="replyBtn" class="btn">Reply</button>
                </div>
            </form>
        </div>
        <div id="repliesContainer">
            <div class="spinner">Loading replies...</div>
        </div>
    </div>`;

    let variables = {
        focalTweetId: tweetId,
        referrer: "tweet",
        with_rux_injections: false,
        rankingMode: "Relevance",
        includePromotedContent: false,
        withCommunity: true,
        withQuickPromoteEligibilityTweetFields: false,
        withBirdwatchNotes: true,
        withVoice: true
    };

    let url = `https://x.com/i/api/graphql/qpemjmVMoTWDvcRT43JIVQ/TweetDetail?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;

    performAsyncGet(url, (resStr) => {
        let parsed = parseTwitterGraphql(resStr);
        if (parsed.error && (!parsed.tweets || !parsed.tweets.length)) {
            let fbUrl = `https://x.com/i/api/graphql/dQDdKtt882nl-Km98FJGSQ/TweetDetail?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;
            performAsyncGet(fbUrl, (fbStr) => {
                let fbParsed = parseTwitterGraphql(fbStr);
                renderThreadData(tweetId, focal, fbParsed);
            });
            return;
        }
        renderThreadData(tweetId, focal, parsed);
    });
}

function renderThreadData(tweetId, focal, parsed) {
    const repContainer = document.getElementById('repliesContainer');
    if (!repContainer) return;

    if (!focal) {
        let found = parsed.tweets.find(t => t.id === tweetId);
        if (found) {
            focal = found;
            allTweetsMap[tweetId] = focal;
            let threadBox = document.getElementById('threadContainer');
            if (threadBox) {
                let sp = threadBox.querySelector('.spinner');
                if (sp) sp.outerHTML = renderTweetHtml(focal);
            }
        }
    }

    let replies = parsed.tweets.filter(t => t.id !== tweetId);

    if (replies.length > 0) {
        repContainer.innerHTML = '<div style="padding:12px 16px; font-size:14px; font-weight:700; color:var(--text-muted); border-bottom:1px solid var(--border);">Replies (' + replies.length + ')</div>' + replies.map(renderTweetHtml).join('');
    } else if (parsed.error && !focal) {
        repContainer.innerHTML = `<div class="card"><div class="card-title" style="color:var(--red);">Error</div><p class="card-desc">${escapeHtml(parsed.error)}</p></div>`;
    } else {
        repContainer.innerHTML = '<div style="padding:28px 16px; text-align:center; color:var(--text-muted); font-size:14px;">No replies yet</div>';
    }
}

function goBackToFeed() {
    if (window.history.state && window.history.state.view === 'thread') {
        window.history.back();
    } else {
        restoreFeedView(currentFeedOrigin);
    }
}

function restoreFeedView(targetTab) {
    currentTab = targetTab || currentTab || 'following';
    const tabNav = document.getElementById('tabNav');
    if (tabNav) tabNav.style.display = 'flex';
    document.querySelectorAll('.nav-tab').forEach((el, idx) => {
        el.classList.toggle('active', ['following', 'foryou', 'cache'][idx] === currentTab);
    });
    if (window.location.hash.startsWith('#thread-')) {
        try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch(e){}
    }
    loadFeed(currentTab);
}

// History stack back navigation
window.onpopstate = function(e) {
    if (e.state && e.state.view === 'thread') {
        renderThreadView(e.state.id);
    } else {
        let origin = (e.state && e.state.originTab) ? e.state.originTab : currentFeedOrigin || currentTab;
        restoreFeedView(origin);
    }
};

function searchTag(tag) {

        let input = document.getElementById('searchInput');

function executeSearch(e) {
    if (e && e.preventDefault) e.preventDefault();
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;

    const resDiv = document.getElementById('searchResults');
    resDiv.innerHTML = '<div class="spinner">Searching...</div>';

    let variables = {
        rawQuery: q,
        count: 20,
        querySource: 'typed_query',
        product: 'Top'
    };

    // Tier 1: Modern SearchTimeline queryId
    let url1 = `https://x.com/i/api/graphql/flaR-PUMshxFWZWPNpq4zA/SearchTimeline?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;

    performAsyncGet(url1, (res1) => {
        let p1 = parseTwitterGraphql(res1);
        if (p1.tweets && p1.tweets.length > 0) {
            renderSearchResults(q, p1.tweets, resDiv);
            return;
        }

        // Tier 2 Fallback: 1BP5aKg8NvTNvRCyyCyq8g
        let url2 = `https://x.com/i/api/graphql/1BP5aKg8NvTNvRCyyCyq8g/SearchTimeline?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;
        performAsyncGet(url2, (res2) => {
            let p2 = parseTwitterGraphql(res2);
            if (p2.tweets && p2.tweets.length > 0) {
                renderSearchResults(q, p2.tweets, resDiv);
                return;
            }

            // Tier 3 Fallback: vLHjqbDv7TPFMBkIIO1nOA
            let url3 = `https://x.com/i/api/graphql/vLHjqbDv7TPFMBkIIO1nOA/SearchTimeline?variables=${encodeURIComponent(JSON.stringify(variables))}&features=${encodeURIComponent(JSON.stringify(GRAPHQL_FEATURES))}`;
            performAsyncGet(url3, (res3) => {
                let p3 = parseTwitterGraphql(res3);
                if (p3.tweets && p3.tweets.length > 0) {
                    renderSearchResults(q, p3.tweets, resDiv);
                    return;
                }

                // Tier 4 Fallback: REST API search
                let restUrl = `https://api.twitter.com/1.1/search/tweets.json?q=${encodeURIComponent(q)}&count=20&result_type=mixed`;
                performAsyncGet(restUrl, (restRes) => {
                    let pRest = parseTwitterGraphql(restRes);
                    if (pRest.tweets && pRest.tweets.length > 0) {
                        renderSearchResults(q, pRest.tweets, resDiv);
                    } else {
                        let err = p1.error || p2.error || p3.error || pRest.error || 'No results found.';
                        resDiv.innerHTML = `<div class="card"><div class="card-title" style="color:var(--red);">Search Error</div><p class="card-desc">${escapeHtml(err)}</p></div>`;
                    }
                });
            });
        });
    });
}

function postReply(e, replyToId) {
    e.preventDefault();
    const input = document.getElementById('replyText');
    const btn = document.getElementById('replyBtn');
    const text = input ? input.value.trim() : '';
    if (!text) return;

    if (btn) {
        btn.disabled = true;
        btn.innerHTML = 'Posting...';
    }

    let payload = JSON.stringify({
        variables: {
            tweet_text: text,
            reply: {
                in_reply_to_tweet_id: replyToId,
                exclude_reply_user_ids: []
            },
            dark_request: false,
            media: {
                media_entities: [],
                possibly_sensitive: false
            },
            semantic_annotation_ids: []
        },
        features: GRAPHQL_FEATURES,
        queryId: "wR5Z_lEibLvkew3tF9w-Sg"
    });

    if (window.AndroidBridge && AndroidBridge.executePost) {
        setTimeout(() => {
            let resStr = AndroidBridge.executePost("https://x.com/i/api/graphql/wR5Z_lEibLvkew3tF9w-Sg/CreateTweet", payload);
            let res;
            try {
                res = JSON.parse(resStr);
            } catch(e) {
                res = { error: true, message: resStr };
            }

            if (res.errors && res.errors.length > 0) {
                alert("Reply failed: " + res.errors[0].message);
                if (btn) { btn.disabled = false; btn.innerHTML = 'Reply'; }
            } else if (res.error) {
                alert("Reply failed: " + (res.message || 'Error'));
                if (btn) { btn.disabled = false; btn.innerHTML = 'Reply'; }
            } else {
                showStatus('Reply posted', false, 2500);
                if (input) input.value = '';
                renderThreadView(replyToId);
            }
        }, 10);
    } else {
        alert("Native bridge unavailable");
        if (btn) { btn.disabled = false; btn.innerHTML = 'Reply'; }
    }
}

function executePostTweet(e) {
    e.preventDefault();
    const text = document.getElementById('postText').value.trim();
    const btn = document.getElementById('postBtn');
    if (!text) return;

    if (btn) {
        btn.disabled = true;
        btn.innerHTML = 'Posting...';
    }

    let payload = JSON.stringify({
        variables: {
            tweet_text: text,
            dark_request: false,
            media: {
                media_entities: [],
                possibly_sensitive: false
            },
            semantic_annotation_ids: []
        },
        features: GRAPHQL_FEATURES,
        queryId: "wR5Z_lEibLvkew3tF9w-Sg"
    });

    if (window.AndroidBridge && AndroidBridge.executePost) {
        setTimeout(() => {
            let resStr = AndroidBridge.executePost("https://x.com/i/api/graphql/wR5Z_lEibLvkew3tF9w-Sg/CreateTweet", payload);
            let res;
            try { res = JSON.parse(resStr); } catch(err) { res = { error: true, message: resStr }; }

            if (res.errors && res.errors.length > 0) {
                alert("Post failed: " + res.errors[0].message);
                if (btn) { btn.disabled = false; btn.innerHTML = 'Post'; }
            } else if (res.error) {
                alert("Post failed: " + (res.message || 'Error'));
                if (btn) { btn.disabled = false; btn.innerHTML = 'Post'; }
            } else {
                showStatus('Post published', false, 2500);
                nav('feed');
            }
        }, 10);
    }
}

function saveSettings(e) {
    e.preventDefault();
    const auth = document.getElementById('cfgAuth').value.trim();
    const ct0 = document.getElementById('cfgCt0').value.trim();
    const mode = document.querySelector('input[name="imgMode"]:checked').value;

    if (window.AndroidBridge) {
        AndroidBridge.saveConfig(auth, ct0, mode);
        appConfig = { auth_token: auth, ct0: ct0, image_mode: mode };
        alert("Saved");
        nav('feed');
    }
}

// In-app hot updater
function triggerAppUpdate() {
    const statusText = document.getElementById('updateStatusText');
    const updateBtn = document.getElementById('updateBtn');
    if (statusText) statusText.innerHTML = 'Checking for updates...';
    if (updateBtn) updateBtn.disabled = true;

    const updateUrl = 'https://gist.githubusercontent.com/sovopr/c52e8a1490b3a5415525b27063726bbe/raw/index.html?t=' + Date.now();

    // Use native fetch first (clean network stack without Twitter headers)
    fetch(updateUrl)
        .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
        })
        .then(html => {
            if (html && html.includes('<!DOCTYPE html>') && html.includes('mainContent')) {
                applyUpdate(html);
            } else {
                throw new Error('Invalid update file');
            }
        })
        .catch(err => {
            // Fallback to bridge with clean headers
            performAsyncGet(updateUrl, (bridgeHtml) => {
                if (bridgeHtml && bridgeHtml.includes('<!DOCTYPE html>') && bridgeHtml.includes('mainContent')) {
                    applyUpdate(bridgeHtml);
                } else {
                    if (statusText) statusText.innerHTML = 'Update check failed. Please try again.';
                    if (updateBtn) updateBtn.disabled = false;
                }
            });
        });
}

function applyUpdate(newHtml) {
    const statusText = document.getElementById('updateStatusText');
    if (window.AndroidBridge && AndroidBridge.saveLiveHtml) {
        let ok = AndroidBridge.saveLiveHtml(newHtml);
        if (ok) {
            if (statusText) statusText.innerHTML = 'Update installed. Reloading...';
            setTimeout(() => {
                AndroidBridge.reloadApp();
            }, 800);
        } else {
            if (statusText) statusText.innerHTML = 'Failed to save update.';
            const updateBtn = document.getElementById('updateBtn');
            if (updateBtn) updateBtn.disabled = false;
        }
    } else {
        alert("Please install v1.0.4 APK once to enable in-app updates.");
    }
}

function resetToFactoryAsset() {
    if (window.AndroidBridge && AndroidBridge.resetLiveHtml) {
        AndroidBridge.resetLiveHtml();
        alert("Reset to bundled version. Reloading...");
        AndroidBridge.reloadApp();
    }
}

window.onload = init;
